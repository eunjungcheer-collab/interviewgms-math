  { main:{id:"WN1",cat:"수와 연산",grade:"중3",q:"소수는 무한히 많다는 것을 설명해 보세요.",a:"소수가 유한개라고 가정하고 모든 소수를 p₁, p₂, …, pₖ라 하겠습니다. 이 모두를 곱한 값에 1을 더한 수 N = p₁p₂…pₖ + 1을 생각합니다. N은 어떤 p로 나누어도 나머지가 1이므로 이 소수들 중 어느 것으로도 나누어떨어지지 않습니다. 그러면 N 자신이 소수이거나, N을 나누는 새로운 소수가 존재해야 하는데, 둘 다 우리가 가진 소수 목록에 없습니다. 이는 모든 소수를 나열했다는 가정에 모순이므로 소수는 무한히 많습니다.",kw:[{l:"1",a:["1"]},{l:"새로운 소수",a:["새로운 소수","새로운","소수"]}]},
    follow:{id:"WN1F",cat:"수와 연산",grade:"중3",q:"\"소수들을 차례로 곱하고 1을 더한 수는 항상 소수\"라고 주장하면 맞나요? 이어서, 3보다 큰 소수는 모두 6k − 1 또는 6k + 1 꼴이라고 합니다. 이유를 설명해 보세요.",a:"(앞 질문) 틀립니다. 2×3×5×7×11×13 + 1 = 30031은 59 × 509로 소수가 아닙니다. 위 증명에서 말한 것은 N이 소수라는 것이 아니라 N이 기존 목록에 없는 소수를 약수로 가진다는 것입니다. 이 경우 59와 509가 새로운 소수입니다. (뒤 질문) 자연수를 6으로 나눈 나머지는 0, 1, 2, 3, 4, 5입니다. 6k, 6k+2, 6k+4는 짝수이고 6k+3은 3의 배수이므로 소수가 될 수 없습니다. 3보다 큰 소수는 남은 6k+1 또는 6k+5, 즉 6k−1 꼴만 가능합니다. 다만 이 꼴이라고 해서 모두 소수인 것은 아닙니다. 예를 들어 25 = 6×4+1이지만 소수가 아닙니다.",kw:[{l:"반례 30031",a:["30031"]},{l:"나머지 분류",a:["나머지"]}]} },

  { main:{id:"WN2",cat:"수와 연산",grade:"중1",q:"자연수의 약수의 개수는 어떻게 구하나요? 72의 약수의 개수를 구해 보세요.",a:"소인수분해해서 각 소인수의 지수에 1을 더한 값을 곱합니다. 72 = 2³ × 3²이므로 약수의 개수는 (3+1)(2+1) = 12개입니다. 이유는 약수가 2의 0제곱부터 3제곱까지 4가지, 3의 0제곱부터 2제곱까지 3가지 중 하나씩 골라 곱한 수이기 때문입니다.",kw:[{l:"12개",a:["12개","12"]},{l:"지수에 1을 더하는 이유",a:["지수에","1을","이유"]}]},
    follow:{id:"WN2F",cat:"수와 연산",grade:"중1",q:"약수의 개수가 홀수인 자연수는 어떤 수이고, 왜 그런가요? 이어서, 1번부터 100번까지 사물함이 모두 닫혀 있습니다. 1번 학생은 모든 사물함을 열고, 2번 학생은 2의 배수 번호 사물함을 반대로(열려 있으면 닫고 닫혀 있으면 열고), 3번 학생은 3의 배수를 반대로, …, 100번 학생까지 같은 방식으로 합니다. 마지막에 열려 있는 사물함은 몇 개이고 어떤 번호인가요?",a:"(앞 질문) 완전제곱수입니다. 약수는 곱해서 그 수가 되는 짝으로 묶이는데, d와 N/d는 서로 짝입니다. 대부분의 경우 d와 N/d가 서로 다른 수라서 약수가 두 개씩 짝지어져 개수가 짝수입니다. 짝이 자기 자신인 경우, 즉 d = N/d인 경우에만 짝이 없는 약수가 하나 남는데 이때 N = d²이므로 완전제곱수입니다. 36의 약수 1, 2, 3, 4, 6, 9, 12, 18, 36은 9개로 홀수입니다. (뒤 질문) 열려 있는 사물함은 10개이고, 번호는 1, 4, 9, 16, 25, 36, 49, 64, 81, 100입니다. k번 사물함은 k의 약수 번호의 학생이 한 번씩 건드리므로 약수의 개수만큼 상태가 바뀝니다. 처음에 닫혀 있었으므로 바뀐 횟수가 홀수여야 열려 있는데, 약수의 개수가 홀수인 수는 완전제곱수입니다. 1부터 100까지 완전제곱수는 1², …, 10²로 10개입니다.",kw:[{l:"자기 짝 = 제곱근",a:["자기"]},{l:"10개",a:["10개","10"]},{l:"완전제곱수",a:["완전제곱수"]},{l:"약수 횟수 연결",a:["약수","횟수"]}]} },

  { main:{id:"WF4",cat:"함수",grade:"중2",q:"함수 y = |x − 1| + |x − 3|의 최솟값은 얼마이고, 그때의 x는 얼마인가요?",a:"|x − 1|은 수직선 위에서 x와 1 사이의 거리이고, |x − 3|은 x와 3 사이의 거리입니다. 그래서 y는 점 x에서 1과 3까지 거리의 합입니다. x가 1과 3 사이에 있으면 이 합은 항상 두 점 사이의 거리 2로 일정하고, 구간 밖으로 나가면 2보다 커집니다. 따라서 최솟값은 2이고, 1 ≤ x ≤ 3인 모든 x에서 얻어집니다. 그래프는 x < 1에서 기울기 −2, 1과 3 사이에서 기울기 0, x > 3에서 기울기 2인 꺾은선입니다.",kw:[{l:"거리 해석",a:["거리"]},{l:"2",a:["2"]},{l:"구간",a:["구간"]}]},
    follow:{id:"WF4F",cat:"함수",grade:"중2",q:"y = |x − 1| + |x − 3| + |x − 7|의 최솟값은 얼마인가요? 그때의 x가 어디인지 이유와 함께 말해 보세요. 이어서, 일직선 도로 위에 집이 n채 있을 때, 집들까지 거리의 합이 최소가 되도록 우체국을 짓는 위치는 어디일까요?",a:"(앞 질문) x = 3에서 최솟값 6입니다. 세 점 1, 3, 7 중 가운데 점이 3인데, x를 3보다 왼쪽으로 옮기면 점 3과 7까지는 멀어지고 점 1과만 가까워져서 합이 커집니다. 3보다 오른쪽으로 옮겨도 점 1과 3에서 멀어지는 정도가 더 커서 합이 커집니다. 따라서 가운데 점에서 최소이고 값은 2 + 0 + 4 = 6입니다. (뒤 질문) 집이 홀수 채이면 가운데 집, 즉 중앙값에 지어야 합니다. 짝수 채이면 가운데 두 집 사이의 어느 곳에 지어도 거리의 합이 같고 최소입니다. 우체국을 왼쪽으로 옮기면 왼쪽 절반의 집에는 가까워지고 오른쪽 절반의 집에는 멀어지는데, 양쪽의 집 수가 같아지는 곳이 가운데이기 때문입니다. 평균이 아니라 중앙값이라는 점이 핵심입니다.",kw:[{l:"x=3",a:["3"]},{l:"6",a:["6"]},{l:"중앙값",a:["중앙값"]}]} },

  { main:{id:"WS1",cat:"확률과 통계",grade:"중2",q:"문 3개 중 하나 뒤에 자동차가 있습니다. 내가 문 하나를 고르면 정답을 아는 사회자가 나머지 두 문 중 염소가 있는 문 하나를 열어 줍니다. 이때 처음 고른 문을 바꾸는 것이 유리할까요?",a:"바꾸는 것이 유리합니다. 처음에 자동차가 있는 문을 골랐을 확률은 1/3이고, 이 경우에만 바꾸면 집니다. 처음에 염소 문을 골랐을 확률은 2/3인데, 이때는 사회자가 남은 염소 문을 열어 주므로 바꾸면 반드시 자동차가 있는 문이 됩니다. 따라서 바꾸면 이길 확률은 2/3, 바꾸지 않으면 1/3입니다.",kw:[{l:"2",a:["2"]}]},
    follow:{id:"WS1F",cat:"확률과 통계",grade:"중2",q:"문이 100개이고 내가 한 개를 골랐을 때, 사회자가 나머지 99개 중 염소가 있는 98개를 열어 준다면 어떻게 하겠습니까? 이어서, 만약 사회자가 자동차가 어디 있는지 모르고 아무 문이나 무작위로 열었는데, 우연히 염소가 나왔다면 이때는 바꾸는 것이 유리할까요?",a:"(앞 질문) 바꾸겠습니다. 처음에 자동차를 골랐을 확률은 1/100이고, 99/100의 확률로 자동차는 내가 고르지 않은 문들 중에 있습니다. 사회자가 그중 염소 문을 모두 열었으므로 닫힌 마지막 한 문에 그 99/100의 확률이 모두 몰립니다. 그래서 바꾸면 99/100의 확률로 이깁니다. 3개의 문일 때와 같은 논리를 극단적으로 확장한 것입니다. (뒤 질문) 이 경우에는 바꾸나 안 바꾸나 확률이 1/2로 같습니다. 사회자가 무작위로 열었다면 자동차를 열어 버렸을 가능성도 있었고, 염소가 나왔다는 것은 그 가능성이 제거된 정보입니다. 내가 처음에 자동차를 골랐고 사회자가 염소를 열 확률은 1/3 × 1이고, 처음에 염소를 골랐고 사회자가 염소를 열 확률은 2/3 × 1/2 = 1/3입니다. 두 경우가 같은 확률이라 바꿔도 1/2입니다. 원래 문제와 달리 사회자의 행동에 정보가 없기 때문입니다.",kw:[{l:"99",a:["99"]},{l:"1",a:["1"]}]} },

  { main:{id:"WS2",cat:"확률과 통계",grade:"중2",q:"n개 중에서 r개를 뽑는 경우의 수 nCr과 nC(n−r)이 같은 이유는 무엇인가요?",a:"r개를 뽑는 것은 뽑지 않을 n−r개를 정하는 것과 같기 때문입니다. 뽑는 방법 하나마다 뽑지 않는 나머지 n−r개의 조합이 하나씩 대응되므로 두 경우의 수가 같습니다. 식으로는 n!/(r!(n−r)!)에서 r과 n−r을 바꿔도 값이 같다는 것으로도 확인됩니다.",kw:[{l:"일대일 대응",a:["대응"]}]},
    follow:{id:"WS2F",cat:"확률과 통계",grade:"중2",q:"원소가 n개인 집합의 부분집합은 모두 몇 개이고, 이것이 파스칼 삼각형과 어떤 관계가 있나요? 이어서, 원소가 n개(n ≥ 1)인 집합에서 원소의 개수가 짝수인 부분집합은 몇 개일까요? 이유도 설명해 보세요.",a:"(앞 질문) 2ⁿ개입니다. 각 원소를 부분집합에 넣을지 말지 두 가지씩 선택하므로 2를 n번 곱한 수입니다. 한편 원소 개수가 r개인 부분집합의 수는 nCr이므로 nC0 + nC1 + … + nCn = 2ⁿ입니다. 파스칼의 삼각형에서 n번째 줄의 수를 모두 더하면 2ⁿ이 되는 이유가 바로 이것입니다. (뒤 질문) 2ⁿ⁻¹개, 즉 전체의 절반입니다. 원소 하나 a를 정해 두고, 어떤 부분집합에 a가 들어 있으면 빼고, 없으면 넣는 방식으로 바꾸면 원소 개수가 홀수에서 짝수로 또는 짝수에서 홀수로 바뀝니다. 이 대응은 홀수 개인 부분집합과 짝수 개인 부분집합 사이의 일대일 대응이므로 두 종류의 수가 같고, 합이 2ⁿ이므로 각각 2ⁿ⁻¹개입니다. n = 3이면 공집합과 두 원소 부분집합 3개로 4개로 확인됩니다.",kw:[{l:"2ⁿ",a:["2ⁿ"]},{l:"두 가지 세는 방법 연결",a:["가지"]},{l:"2ⁿ⁻¹",a:["2ⁿ⁻¹","2ⁿ"]},{l:"일대일 대응",a:["일대일 대응","일대일","대응"]}]} },

  { main:{id:"WN3",cat:"수와 연산",grade:"중3",q:"1/2 + 1/4 + 1/8 + 1/16 + …을 끝없이 더하면 얼마가 되나요? 그림으로 설명해 보세요.",a:"1이 됩니다. 넓이가 1인 정사각형을 반으로 나누어 한쪽을 칠하면 1/2, 남은 반을 다시 반으로 나누어 칠하면 1/4, 이렇게 계속 칠하면 칠한 부분이 정사각형 전체에 한없이 가까워집니다. 매번 남은 부분이 절반씩 줄어서 남은 넓이가 0에 가까워지기 때문입니다. n번째까지의 합은 1 − 1/2ⁿ입니다.",kw:[{l:"1",a:["1"]},{l:"남은 부분이 절반씩",a:["남은 부분이 절반씩","남은","부분이"]}]},
    follow:{id:"WN3F",cat:"수와 연산",grade:"중3",q:"아킬레스가 초속 10m로 달리고 100m 앞에서 거북이가 초속 1m로 기어갑니다. 아킬레스가 거북이를 따라잡으려면 거북이가 있던 곳에 계속 도달해야 하니 영원히 못 잡는다는 주장이 있습니다. 어떻게 반박할 수 있나요? 이어서, 1 + 1/2 + 1/3 + 1/4 + …은 끝없이 더하면 어떻게 될까요? 앞의 1/2 + 1/4 + …과 무엇이 다른가요?",a:"(앞 질문) 아킬레스가 100m를 가는 동안 거북이는 10m를 가고, 그 10m를 가는 동안 거북이는 1m를 가는 식으로 거리가 10분의 1씩 줄어듭니다. 이 거리들의 합은 100 + 10 + 1 + 0.1 + … = 100 ÷ (1 − 0.1) ≈ 111.1m이고, 걸리는 시간도 10 + 1 + 0.1 + … ≈ 11.1초로 유한합니다. 단계가 무한히 많아도 합은 유한할 수 있어서 11.1초 뒤에 따라잡습니다. 식으로는 속도 차 9m/s로 100m를 따라잡는 시간 100/9 ≈ 11.1초와 같습니다. (뒤 질문) 이 합은 한없이 커집니다. 1/3 + 1/4은 1/4 + 1/4 = 1/2보다 크고, 1/5부터 1/8까지 네 항의 합도 1/8 × 4 = 1/2보다 큽니다. 이렇게 묶음마다 1/2보다 큰 값이 끝없이 이어지므로 합은 한없이 커집니다. 항이 0에 가까워진다고 해서 합이 유한해지는 것은 아니라는 점이 앞의 경우와 다릅니다. 앞의 경우는 항이 절반씩 급하게 줄어들어 합이 유한합니다.",kw:[{l:"무한합이 유한",a:["유한"]},{l:"묶어서 1",a:["1"]}]} },

  { main:{id:"WN4",cat:"문자와 식",grade:"중2",q:"1부터 n까지의 합이 n(n+1)/2인 이유를 설명해 보세요.",a:"합 S = 1 + 2 + … + n을 거꾸로 써서 더하면 각 자리의 합이 모두 n + 1이고 n개이므로 2S = n(n+1)이 됩니다. 따라서 S = n(n+1)/2입니다. 도형으로는 한 변이 n, n+1인 직사각형을 계단 모양 두 개로 나누는 것으로 볼 수 있습니다.",kw:[{l:"거꾸로 더하기",a:["거꾸로"]}]},
    follow:{id:"WN4F",cat:"문자와 식",grade:"중2",q:"처음 n개의 홀수의 합 1 + 3 + 5 + … + (2n−1)이 n²이 되는 이유를 설명해 보세요. 이어서, 1³ + 2³ + … + n³ = (1 + 2 + … + n)²이 성립한다고 합니다. n = 4에서 확인하고, 일반적으로 성립하는 이유도 말해 보세요.",a:"(앞 질문) 한 변이 n인 정사각형 점 배열에서 한 모퉁이의 점 1개, 그 둘레에 ㄱ자 모양으로 점 3개, 다시 그 바깥에 ㄱ자 모양 점 5개를 계속 붙이면 정사각형이 커집니다. k번째 ㄱ자에 들어가는 점은 2k − 1개이므로 n번 붙이면 n × n개가 됩니다. 식으로는 등차수열의 합 n(1 + (2n−1))/2 = n²과 같습니다. (뒤 질문) n = 4이면 1 + 8 + 27 + 64 = 100이고 (1+2+3+4)² = 10² = 100으로 같습니다. 일반적으로는 n에서 성립한다고 하면 n+1에서도 성립함을 보이면 됩니다. 즉 ((n+1)(n+2)/2)² − (n(n+1)/2)²이 (n+1)³인지 확인하면 됩니다. 이 차는 (n+1)²/4 × ((n+2)² − n²) = (n+1)²/4 × (4n+4) = (n+1)³이 되어 성립합니다.",kw:[{l:"ㄱ자 점 배열",a:["ㄱ자","배열"]},{l:"n=4 확인",a:["확인","4"]}]} },

  { main:{id:"WN5",cat:"수와 연산",grade:"중1",q:"13명의 사람이 있으면 그중 적어도 두 사람은 태어난 달이 같다는 것을 설명해 보세요.",a:"달은 12개뿐이므로 12개의 칸을 만들고 사람마다 자기 태어난 달의 칸에 넣는다고 생각합니다. 사람은 13명이므로 모두 다른 칸에 들어갈 수 없고 적어도 한 칸에는 두 명 이상이 들어갑니다. 이것이 비둘기집 원리입니다.",kw:[{l:"12칸 13명",a:["13명","12","13"]},{l:"원리 이름",a:["원리"]}]},
    follow:{id:"WN5F",cat:"수와 연산",grade:"중1",q:"서로 다른 정수 n+1개를 아무렇게나 고르면, 그중 두 수의 차가 n의 배수인 것이 반드시 있다는 것을 설명해 보세요. 이어서, 한 변의 길이가 1인 정삼각형 안에 점 5개를 찍으면, 그중 거리가 1/2 이하인 두 점이 반드시 있다는 것을 설명해 보세요.",a:"(앞 질문) n으로 나눈 나머지는 0부터 n−1까지 n가지뿐입니다. 정수가 n+1개이므로 비둘기집 원리에 의해 나머지가 같은 두 수가 반드시 있습니다. 나머지가 같은 두 수의 차는 n으로 나누어떨어집니다. 예를 들어 6개의 정수를 고르면 그중 두 수의 차는 5의 배수입니다. (뒤 질문) 각 변의 중점을 이어 한 변이 1/2인 작은 정삼각형 4개로 나눕니다. 점이 5개이고 칸이 4개이므로 비둘기집 원리에 의해 한 작은 정삼각형 안에 두 점이 들어갑니다. 한 변이 1/2인 정삼각형 안의 두 점 사이 거리는 가장 길어도 변의 길이 1/2을 넘지 않으므로 거리가 1/2 이하입니다.",kw:[{l:"차의 배수",a:["배수"]},{l:"4등분",a:["4"]},{l:"5점",a:["5"]},{l:"최대 거리",a:["거리"]}]} },

  { main:{id:"WN6",cat:"수와 연산",grade:"중2",q:"13명의 사람이 있으면 그중 적어도 두 사람은 태어난 달이 같다는 것을 설명해 보세요.",a:"달은 12개뿐이므로 12개의 칸을 만들고 사람마다 자기 태어난 달의 칸에 넣는다고 생각합니다. 사람은 13명이므로 모두 다른 칸에 들어갈 수 없고 적어도 한 칸에는 두 명 이상이 들어갑니다. 이것이 비둘기집 원리입니다.",kw:[{l:"12칸 13명",a:["13명","12","13"]},{l:"원리 이름",a:["원리"]}]},
    follow:{id:"WN6F",cat:"수와 연산",grade:"중2",q:"서로 다른 정수 n+1개를 아무렇게나 고르면, 그중 두 수의 차가 n의 배수인 것이 반드시 있다는 것을 설명해 보세요. 이어서, 한 변의 길이가 1인 정삼각형 안에 점 5개를 찍으면, 그중 거리가 1/2 이하인 두 점이 반드시 있다는 것을 설명해 보세요.",a:"(앞 질문) n으로 나눈 나머지는 0부터 n−1까지 n가지뿐입니다. 정수가 n+1개이므로 비둘기집 원리에 의해 나머지가 같은 두 수가 반드시 있습니다. 나머지가 같은 두 수의 차는 n으로 나누어떨어집니다. 예를 들어 6개의 정수를 고르면 그중 두 수의 차는 5의 배수입니다. (뒤 질문) 각 변의 중점을 이어 한 변이 1/2인 작은 정삼각형 4개로 나눕니다. 점이 5개이고 칸이 4개이므로 비둘기집 원리에 의해 한 작은 정삼각형 안에 두 점이 들어갑니다. 한 변이 1/2인 정삼각형 안의 두 점 사이 거리는 가장 길어도 변의 길이 1/2을 넘지 않으므로 거리가 1/2 이하입니다.",kw:[{l:"차의 배수",a:["배수"]},{l:"4등분",a:["4"]},{l:"5점",a:["5"]},{l:"최대 거리",a:["거리"]}]} },

  { main:{id:"WG5",cat:"기하",grade:"중2",q:"직선 l의 같은 쪽에 두 점 A, B가 있습니다. l 위의 한 점 P를 잡아 AP + PB를 가장 짧게 하려면 P를 어디에 잡아야 하나요?",a:"점 A를 직선 l에 대해 대칭이동한 점을 A′이라 하면 AP = A′P이므로 AP + PB = A′P + PB입니다. 이 값은 A′과 B를 잇는 선분이 가장 짧으므로, 직선 A′B가 l과 만나는 점이 P입니다. 이 점에서 AP + PB가 최소가 되고, 최솟값은 선분 A′B의 길이입니다.",kw:[{l:"직선 A′B와 l의 교점",a:["직선"]}]},
    follow:{id:"WG5F",cat:"기하",grade:"중2",q:"이 문제가 빛의 반사 법칙과 어떤 관계가 있나요? 이어서, 가로 1, 세로 2, 높이 3인 직육면체의 한 꼭짓점에서 대각선 반대편 꼭짓점까지 표면을 따라 가는 가장 짧은 거리는 얼마인가요?",a:"(앞 질문) 대칭점으로 구한 점 P에서는 입사각과 반사각이 같습니다. A′, P, B가 한 직선 위에 있고 A와 A′은 l에 대해 대칭이므로 A에서 P로 들어오는 선과 l이 이루는 각이 P에서 B로 나가는 선과 l이 이루는 각과 같아집니다. 즉 빛은 가장 짧은 경로로 간다는 것이고, 이것은 가장 짧은 시간이 걸리는 경로를 택한다는 페르마의 원리의 한 경우입니다. (뒤 질문) 전개도를 그려 직선 거리를 구합니다. 두 면을 이어 펼치는 방법이 세 가지인데, 각각 √((1+2)²+3²) = √18, √((1+3)²+2²) = √20, √((2+3)²+1²) = √26입니다. 이 중 가장 짧은 것은 √18 = 3√2 ≈ 4.24입니다. 직육면체 내부를 통과하는 공간 대각선 √14 ≈ 3.74보다는 길지만, 표면을 따라 가야 하므로 표면 위 최단 거리는 3√2입니다.",kw:[{l:"최단 경로",a:["경로"]},{l:"3가지 전개 비교",a:["전개","3"]},{l:"3√2",a:["3√2"]}]} },

  { main:{id:"WF1",cat:"함수",grade:"중3",q:"이차방정식 x²−2x−3=0의 해를 이차함수 y=x²−2x−3의 그래프와 연결하여 말로 설명하시오.",a:"이차방정식의 해는 이차함수 y=x²−2x−3의 그래프가 x축과 만나는 점의 x좌표입니다. 인수분해하면 (x−3)(x+1)=0이므로 x=3 또는 x=−1이고, 그래프는 x축과 (−1, 0), (3, 0)에서 만납니다. 즉 y=0을 대입한 식이 방정식이므로 방정식을 푸는 것은 함수의 값이 0이 되는 x를 찾는 것과 같습니다.",kw:[{l:"y=0 대입, x축과의 교점",a:["x축","y=0"]},{l:"해 x=3, x=−1",a:["3","−1"]},{l:"방정식=함수값이 0",a:["함수의 값","y=0"]}]},
    follow:{id:"WF1F",cat:"함수",grade:"중3",q:"이 이차함수의 꼭짓점의 좌표와, 방정식 x²−2x−3=k가 서로 다른 두 실근을 갖도록 하는 k의 범위를 그래프로 설명하시오.",a:"완전제곱식으로 고치면 y=(x−1)²−4이므로 꼭짓점은 (1, −4)입니다. x²−2x−3=k의 해는 그래프와 수평선 y=k의 교점의 x좌표이므로, 수평선이 포물선과 두 점에서 만나려면 꼭짓점보다 위에 있어야 합니다. 따라서 k>−4이고, k=−4이면 접하여 중근, k<−4이면 만나지 않습니다.",kw:[{l:"꼭짓점 (1,−4)",a:["(1, −4)","(1,−4)"]},{l:"수평선 y=k와의 교점",a:["수평선","y=k"]},{l:"k>−4",a:["−4"]}]} },

  { main:{id:"WF2",cat:"함수",grade:"중3",q:"이차함수 y=x²의 그래프와 직선 y=x+2의 교점을 구하고, 이것이 연립방정식을 푸는 것과 어떤 관계인지 설명하시오.",a:"교점은 두 그래프 위에 동시에 있는 점이므로 두 식을 모두 만족합니다. 그래서 x²=x+2에서 x²−x−2=0, (x−2)(x+1)=0이므로 x=2 또는 x=−1이고, 교점은 (2, 4), (−1, 1)입니다. 즉 두 그래프의 교점의 좌표는 두 식을 연립한 방정식의 해와 같습니다.",kw:[{l:"두 식을 동시에 만족",a:["동시에","연립"]},{l:"x=2, x=−1",a:["2","−1"]},{l:"교점 (2,4), (−1,1)",a:["(2, 4)","(−1, 1)"]}]},
    follow:{id:"WF2F",cat:"함수",grade:"중3",q:"이 두 교점을 이은 선분 위의 점에서 포물선까지 거리가 가장 먼 점, 즉 두 교점과 삼각형을 이루어 넓이가 최대가 되는 포물선 위의 점은 어디인지 설명하시오. (두 교점 사이의 포물선 위)",a:"직선과 기울기가 같은 접선을 그을 때의 접점입니다. y=x+k와 y=x²가 접하려면 x²−x−k=0이 중근을 가져야 하므로 판별식 1+4k=0, k=−1/4이고 접점은 x=1/2, 즉 (1/2, 1/4)입니다. 직선에서 가장 먼 점이므로 삼각형의 높이가 최대가 되어 넓이가 최대입니다.",kw:[{l:"기울기가 같은 접선",a:["접선","평행"]},{l:"중근, k=−1/4",a:["중근","−1/4"]},{l:"(1/2, 1/4)",a:["1/2","1/4"]}]} },

  { main:{id:"WG1",cat:"기하",grade:"중3",q:"좌표평면 위에서 O(0, 0), A(a, 0), B(a, b), C(0, b)인 직사각형 OABC가 있습니다. 네 점이 한 원 위에 있음을 증명하고 그 원의 중심과 반지름을 구하시오.",a:"대각선 OB와 AC의 중점은 모두 (a/2, b/2)로 같습니다. 이 점을 M이라 하면 OM=BM=AM=CM=√(a²+b²)/2입니다. 직사각형의 두 대각선은 길이가 같고 서로 다른 것을 이등분하므로 M에서 네 꼭짓점까지의 거리가 같습니다. 따라서 네 점은 중심이 (a/2, b/2), 반지름이 √(a²+b²)/2인 원 위에 있습니다.",kw:[{l:"대각선 중점 (a/2, b/2)",a:["a/2","중점"]},{l:"네 꼭짓점까지 거리가 같음",a:["거리가 같","같습니다"]},{l:"반지름 √(a²+b²)/2",a:["√(a²+b²)"]}]},
    follow:{id:"WG1F",cat:"기하",grade:"중3",q:"같은 직사각형에서 ∠AOC=90°임을 이용하여 원주각의 관점에서 AC가 지름이라는 사실을 설명하시오.",a:"∠AOC=90°이고 점 O는 원 위에 있으므로, 지름에 대한 원주각이 90°이듯이 90°인 원주각에 대한 현 AC는 지름입니다. 따라서 AC의 중점 (a/2, b/2)가 원의 중심입니다. 같은 방법으로 ∠ABC=90°에서도 AC가 지름임을 알 수 있습니다.",kw:[{l:"90°의 원주각 → 지름",a:["지름","90°"]},{l:"중심이 AC의 중점",a:["중점"]},{l:"∠ABC=90°로도 확인",a:["∠ABC","90°"]}]} },
];

TOP_PAIRS.forEach(p=>{ QMAP[p.main.id]=p.main; QMAP[p.follow.id]=p.follow; }); // 오답노트/이어풀기 등에서도 id로 찾을 수 있게 등록

/* ===================== 구술 풀이 (청취형: 도형·함수를 말로 설명하고 바로 풀기, 꼬리질문 포함) ===================== */
const ORAL_PAIRS = [
  { main:{"id":"OG1","cat":"기하","grade":"중3","q":"한 변의 길이가 6인 정사각형 ABCD가 있습니다. 변 BC의 중점을 M이라 하고, 꼭짓점 A와 M을 선분으로 잇습니다. 꼭짓점 D에서 선분 AM에 수선을 내릴 때, 그 수선의 길이를 구하고 풀이 과정을 말로 설명하시오.","a":"먼저 직각삼각형 ABM을 봅니다. AB=6, BM=3이므로 AM=√(36+9)=3√5입니다. 다음으로 삼각형 ADM의 넓이를 구하면 밑변 AD=6이고 점 M에서 AD까지의 거리가 6이므로 6×6÷2=18입니다. 같은 삼각형을 AM을 밑변으로 보면 넓이가 (1/2)×3√5×h이므로 h=36/(3√5)=12/√5=12√5/5입니다. 따라서 수선의 길이는 12√5/5이고, 핵심은 같은 삼각형의 넓이를 두 가지 방법으로 나타낸 것입니다.","kw":[{"l":"AM=3√5","a":["3√5"]},{"l":"삼각형 ADM의 넓이=18","a":["18"]},{"l":"넓이를 두 가지 방법으로","a":["두 가지","밑변"]},{"l":"12√5/5","a":["12√5","12/√5"]}]},
    follow:{"id":"OG1F","cat":"기하","grade":"중3","q":"같은 방법으로 꼭짓점 B에서 선분 AM에 내린 수선의 길이를 구하고, 이 값이 직각삼각형의 어떤 성질과 같은 형태인지 말하시오.","a":"삼각형 ABM의 넓이는 (1/2)×6×3=9입니다. AM을 밑변으로 하면 (1/2)×3√5×h=9이므로 h=6/√5=6√5/5입니다. 직각삼각형에서 빗변에 내린 수선의 길이는 (직각을 낀 두 변의 곱)÷(빗변)이므로 6×3÷3√5로 같은 결과가 나옵니다.","kw":[{"l":"넓이 9","a":["9"]},{"l":"6/√5","a":["6/√5","6√5"]},{"l":"두 변의 곱 ÷ 빗변","a":["곱","빗변"]}]} },

  { main:{"id":"OG2","cat":"기하","grade":"중2","q":"직각삼각형 ABC에서 꼭짓점 B가 직각이고, AB=6, BC=8입니다. 직각의 꼭짓점 B에서 빗변 AC에 수선을 내려 그 발을 H라 할 때, 선분 BH와 AH의 길이를 구하고 풀이를 말로 설명하시오.","a":"먼저 피타고라스 정리로 빗변 AC=√(36+64)=10입니다. 다음으로 삼각형 ABC의 넓이를 두 가지로 나타냅니다. 직각을 낀 두 변으로 보면 (1/2)×6×8=24이고, 빗변을 밑변으로 보면 (1/2)×10×BH입니다. 따라서 BH=48/10=24/5입니다. 그리고 직각삼각형 ABH에서 AH=√(36−(24/5)²)=√(324/25)=18/5입니다.","kw":[{"l":"AC=10","a":["10"]},{"l":"넓이를 두 가지로","a":["두 가지","넓이"]},{"l":"BH=24/5","a":["24/5"]},{"l":"AH=18/5","a":["18/5"]}]},
    follow:{"id":"OG2F","cat":"기하","grade":"중2","q":"이 직각삼각형의 내접원의 반지름과 외접원의 반지름을 구하고 각각의 이유를 말하시오.","a":"내접원의 반지름은 r=(6+8−10)/2=2입니다. 이는 접점까지의 거리를 이용하거나 넓이 24=(1/2)×r×(6+8+10)에서 r=2로도 구할 수 있습니다. 외접원은 직각삼각형의 빗변이 지름이므로 반지름이 10÷2=5입니다. 직각의 원주각에 대한 현이 지름이기 때문입니다.","kw":[{"l":"내접원 반지름 2","a":["2"]},{"l":"넓이=(1/2)r×둘레","a":["둘레","넓이"]},{"l":"외접원 반지름 5, 빗변이 지름","a":["5","지름"]}]} },

  { main:{"id":"OG3","cat":"기하","grade":"중3","q":"정삼각형 ABC의 내부에 점 P를 아무렇게나 잡습니다. P에서 세 변에 각각 수선을 내릴 때, 그 세 수선의 길이의 합이 P의 위치와 관계없이 일정하다고 합니다. 그 까닭을 말로 설명하시오.","a":"먼저 P를 세 꼭짓점과 이어 삼각형 PAB, PBC, PCA 세 개로 나눕니다. 세 삼각형의 밑변은 모두 정삼각형의 한 변의 길이 a이고 높이는 P에서 각 변에 내린 수선의 길이 d₁, d₂, d₃입니다. 세 삼각형의 넓이의 합이 정삼각형 ABC의 넓이와 같으므로 (1/2)a(d₁+d₂+d₃)=(1/2)a·h입니다. 여기서 h는 정삼각형의 높이입니다. 따라서 d₁+d₂+d₃=h이므로 P의 위치와 관계없이 일정합니다.","kw":[{"l":"P와 꼭짓점을 이어 세 삼각형","a":["세 삼각형","나눕니다"]},{"l":"밑변이 모두 a","a":["밑변","a"]},{"l":"넓이의 합=전체 넓이","a":["넓이의 합"]},{"l":"합=높이 h","a":["h"]}]},
    follow:{"id":"OG3F","cat":"기하","grade":"중3","q":"한 변의 길이가 6인 정삼각형이라면 그 합은 얼마이고, P가 무게중심일 때 세 수선의 길이는 각각 얼마입니까?","a":"한 변이 6인 정삼각형의 높이는 (√3/2)×6=3√3이므로 세 수선의 길이의 합은 3√3입니다. P가 무게중심이면 세 변에서의 거리가 같으므로 각각 3√3÷3=√3입니다.","kw":[{"l":"합=높이 3√3","a":["3√3"]},{"l":"무게중심은 거리가 같음","a":["같","√3"]}]} },

  { main:{"id":"OG4","cat":"기하","grade":"중2","q":"반지름이 5인 원이 있습니다. 중심에서 거리가 3인 곳에 있는 현의 길이를 구하고 풀이를 말로 설명하시오.","a":"먼저 원의 중심 O에서 현에 수선을 내립니다. 현에 내린 수선은 현을 수직이등분하므로 수선의 발은 현의 중점입니다. 현의 반을 x라 하면 직각삼각형에서 반지름 5가 빗변이고 나머지 두 변이 3과 x이므로 x=√(25−9)=4입니다. 따라서 현의 길이는 2×4=8입니다.","kw":[{"l":"중심에서 현에 수선","a":["수선"]},{"l":"수선은 현을 이등분","a":["이등분","중점"]},{"l":"x=4","a":["4"]},{"l":"현의 길이 8","a":["8"]}]},
    follow:{"id":"OG4F","cat":"기하","grade":"중2","q":"같은 원에서 길이가 8인 현과 길이가 6인 현이 서로 평행할 때, 두 현 사이의 거리는 얼마입니까? 가능한 경우를 모두 말하시오.","a":"길이 8인 현은 중심에서 거리가 3이고, 길이 6인 현은 반을 3으로 보면 중심에서의 거리가 √(25−9)=4입니다. 두 현이 중심을 사이에 두고 반대쪽에 있으면 거리는 3+4=7이고, 같은 쪽에 있으면 4−3=1입니다. 따라서 두 현 사이의 거리는 7 또는 1입니다.","kw":[{"l":"6인 현의 중심 거리 4","a":["4"]},{"l":"반대쪽 3+4=7","a":["7","반대쪽"]},{"l":"같은 쪽 4−3=1","a":["1","같은 쪽"]}]} },

  { main:{"id":"OG5","cat":"기하","grade":"중3","q":"가로 4, 세로 3인 직사각형 ABCD가 있습니다. 꼭짓점 B에서 대각선 AC에 수선을 내려 그 발을 H라 할 때, BH의 길이와 AH:HC의 비를 구하고 풀이를 말로 설명하시오. (AB=3, BC=4)","a":"먼저 직각삼각형 ABC에서 AC=√(9+16)=5입니다. 다음으로 삼각형 ABC의 넓이를 두 가지로 나타내면 (1/2)×3×4=6=(1/2)×5×BH이므로 BH=12/5입니다. 또 직각삼각형 ABH에서 AH=√(9−144/25)=9/5이고, HC=5−9/5=16/5입니다. 따라서 AH:HC=9:16이고, 이는 AB²:BC²과 같습니다.","kw":[{"l":"AC=5","a":["5"]},{"l":"BH=12/5","a":["12/5"]},{"l":"AH=9/5, HC=16/5","a":["9/5","16/5"]},{"l":"비 9:16","a":["9:16"]}]},
    follow:{"id":"OG5F","cat":"기하","grade":"중3","q":"꼭짓점 B와 D에서 대각선 AC에 내린 수선의 발을 각각 H, H′이라 할 때 선분 HH′의 길이를 구하시오.","a":"직사각형은 점대칭이므로 CH′=AH=9/5입니다. 따라서 HH′=AC−AH−CH′=5−9/5−9/5=7/5입니다.","kw":[{"l":"점대칭으로 CH′=AH","a":["대칭","CH′"]},{"l":"HH′=7/5","a":["7/5"]}]} },

  { main:{"id":"OG6","cat":"기하","grade":"중3","q":"중심이 O이고 반지름이 3인 원이 있습니다. 중심 O에서 거리가 5인 원 밖의 점 P에서 원에 접선을 두 개 긋고, 접점을 A, B라 할 때 접선의 길이 PA와 현 AB의 길이를 구하고 풀이를 말로 설명하시오.","a":"먼저 접선은 접점에서 반지름과 수직이므로 삼각형 OAP는 ∠A가 직각인 직각삼각형입니다. OA=3, OP=5이므로 PA=√(25−9)=4입니다. 다음으로 OP와 AB의 교점을 M이라 하면 AB⊥OP이고 M은 AB의 중점입니다. 삼각형 OAP의 넓이를 두 가지로 나타내면 (1/2)×3×4=(1/2)×5×AM이므로 AM=12/5이고 AB=24/5입니다.","kw":[{"l":"접선⊥반지름","a":["수직","직각"]},{"l":"PA=4","a":["4"]},{"l":"OP⊥AB, M은 중점","a":["중점","OP"]},{"l":"AB=24/5","a":["24/5"]}]},
    follow:{"id":"OG6F","cat":"기하","grade":"중3","q":"삼각형 PAB의 넓이를 구하시오.","a":"PA=PB=4이고 AB=24/5입니다. 높이 PM=OP−OM인데 OM=√(9−(12/5)²)=9/5이므로 PM=5−9/5=16/5입니다. 따라서 넓이는 (1/2)×(24/5)×(16/5)=192/25입니다.","kw":[{"l":"OM=9/5","a":["9/5"]},{"l":"PM=16/5","a":["16/5"]},{"l":"넓이 192/25","a":["192/25"]}]} },

  { main:{"id":"OG7","cat":"기하","grade":"중3","q":"한 모서리의 길이가 2인 정육면체가 있습니다. 한 꼭짓점에서 그 반대편 꼭짓점까지의 거리와, 이 정육면체의 모든 꼭짓점을 지나는 구의 반지름을 구하고 풀이를 말로 설명하시오.","a":"먼저 밑면의 대각선을 구합니다. 한 모서리가 2인 정사각형의 대각선은 2√2입니다. 다음으로 이 대각선과 높이 2가 직각을 이루므로 공간대각선은 √(8+4)=2√3입니다. 모든 꼭짓점을 지나는 구의 지름은 공간대각선이므로 반지름은 √3입니다.","kw":[{"l":"밑면 대각선 2√2","a":["2√2"]},{"l":"공간대각선 2√3","a":["2√3"]},{"l":"지름이 공간대각선, 반지름 √3","a":["지름","√3"]}]},
    follow:{"id":"OG7F","cat":"기하","grade":"중3","q":"이 정육면체에 꼭 맞게 들어가는 구와 위의 구의 부피의 비를 구하시오.","a":"정육면체에 내접하는 구의 지름은 모서리의 길이 2이므로 반지름이 1입니다. 외접하는 구의 반지름은 √3이므로 부피의 비는 반지름의 세제곱의 비인 1:(√3)³=1:3√3입니다.","kw":[{"l":"내접구 반지름 1","a":["1"]},{"l":"부피비는 세제곱비","a":["세제곱"]},{"l":"1:3√3","a":["3√3"]}]} },

  { main:{"id":"OG8","cat":"기하","grade":"중1","q":"밑면의 반지름이 3이고 모선의 길이가 5인 원뿔이 있습니다. 이 원뿔의 높이, 부피, 겉넓이를 구하고 풀이를 말로 설명하시오.","a":"먼저 원뿔의 높이와 밑면 반지름, 모선이 직각삼각형을 이루므로 높이는 √(25−9)=4입니다. 부피는 (1/3)×π×3²×4=12π입니다. 옆넓이는 π×(반지름)×(모선)=π×3×5=15π이고 밑넓이는 9π이므로 겉넓이는 24π입니다.","kw":[{"l":"높이 4","a":["4"]},{"l":"부피 12π","a":["12π"]},{"l":"옆넓이 15π","a":["15π"]},{"l":"겉넓이 24π","a":["24π"]}]},
    follow:{"id":"OG8F","cat":"기하","grade":"중1","q":"이 원뿔의 옆면을 펼친 부채꼴의 중심각을 구하고 그 까닭을 말하시오.","a":"부채꼴의 반지름은 모선 5이고, 호의 길이는 밑면 원의 둘레 6π와 같습니다. 중심각은 360°×(호의 길이)/(원 전체 둘레)이므로 360°×6π/(10π)=216°입니다.","kw":[{"l":"호의 길이=밑면 둘레 6π","a":["6π","밑면"]},{"l":"반지름 5","a":["5"]},{"l":"216°","a":["216"]}]} },

  { main:{"id":"OG9","cat":"기하","grade":"중2","q":"삼각형 ABC에서 변 AB의 중점을 M, 변 AC의 중점을 N이라 합니다. 삼각형 ABC의 넓이가 24이고 BC=10일 때, 선분 MN의 길이와 사각형 MBCN의 넓이를 구하고 풀이를 말로 설명하시오.","a":"먼저 삼각형 AMN과 삼각형 ABC를 비교합니다. 각 A가 공통이고 AM:AB=AN:AC=1:2이므로 닮음이고 닮음비는 1:2입니다. 따라서 MN=BC÷2=5이고 MN∥BC입니다. 넓이의 비는 닮음비의 제곱인 1:4이므로 삼각형 AMN의 넓이는 24÷4=6이고 사각형 MBCN의 넓이는 24−6=18입니다.","kw":[{"l":"닮음비 1:2","a":["1:2"]},{"l":"MN=5","a":["5"]},{"l":"넓이비 1:4","a":["1:4","제곱"]},{"l":"사각형 18","a":["18"]}]},
    follow:{"id":"OG9F","cat":"기하","grade":"중2","q":"삼각형 ABC의 무게중심을 G라 할 때 삼각형 GBC의 넓이를 구하고 까닭을 말하시오.","a":"무게중심 G는 중선을 꼭짓점에서 2:1로 나누므로 G에서 BC까지의 거리는 A에서 BC까지의 높이의 1/3입니다. 밑변 BC가 같으므로 삼각형 GBC의 넓이는 24의 1/3인 8입니다.","kw":[{"l":"중선을 2:1로","a":["2:1"]},{"l":"높이가 1/3","a":["1/3"]},{"l":"8","a":["8"]}]} },

  { main:{"id":"OG10","cat":"기하","grade":"중3","q":"좌표평면에서 원점 O, x축 위의 점 B(6, 0), y축 위의 점 A(0, 8)을 꼭짓점으로 하는 삼각형 OBA가 있습니다. 이 삼각형의 외접원의 중심의 좌표와 반지름을 구하고 풀이를 말로 설명하시오.","a":"먼저 점 O에서 각이 직각이므로 삼각형 OBA는 직각삼각형이고 빗변은 AB입니다. 직각삼각형의 외심은 빗변의 중점이므로 A(0, 8)과 B(6, 0)의 중점인 (3, 4)입니다. 빗변의 길이는 √(36+64)=10이므로 외접원의 반지름은 5입니다.","kw":[{"l":"O에서 직각, 빗변 AB","a":["직각","빗변"]},{"l":"외심은 빗변의 중점 (3,4)","a":["(3, 4)","(3,4)"]},{"l":"반지름 5","a":["5"]}]},
    follow:{"id":"OG10F","cat":"기하","grade":"중3","q":"이 삼각형의 내접원의 중심의 좌표와 반지름을 구하고, 외심과 내심 사이의 거리를 구하시오.","a":"내접원의 반지름은 r=(6+8−10)/2=2입니다. 내접원은 x축과 y축에 모두 접하므로 중심은 (2, 2)입니다. 외심 (3, 4)와의 거리는 √(1+4)=√5입니다.","kw":[{"l":"내접원 반지름 2","a":["2"]},{"l":"중심 (2,2)","a":["(2, 2)","(2,2)"]},{"l":"거리 √5","a":["√5"]}]} },

  { main:{"id":"OF1","cat":"함수","grade":"중3","q":"(말로 설명하는 문제) 이차함수 y=x²−4x+3의 그래프와 직선 y=m이 만나는 점의 개수가 m의 값에 따라 어떻게 변하는지 그래프를 그리지 않고 말로 설명하고, 이것을 방정식 x²−4x+3=m의 해의 개수와 연결하시오.","a":"y=x²−4x+3=(x−2)²−1이므로 그래프는 꼭짓점이 (2, −1)이고 아래로 볼록한 포물선입니다. 수평선 y=m이 꼭짓점 아래(m<−1)에 있으면 만나지 않고, m=−1이면 꼭짓점에서 한 점에서 접하며, m>−1이면 서로 다른 두 점에서 만납니다. 만나는 점의 x좌표가 방정식 x²−4x+3=m의 해이므로 해의 개수는 각각 0개, 1개(중근), 2개입니다.","kw":[{"l":"꼭짓점 (2,−1)","a":["(2, −1)","(2,−1)"]},{"l":"m<−1 없음, m=−1 한 점, m>−1 두 점","a":["m<−1","m>−1"]},{"l":"교점의 x좌표가 방정식의 해","a":["x좌표","해"]}]},
    follow:{"id":"OF1F","cat":"함수","grade":"중3","q":"m=3일 때 두 교점 사이의 거리를 구하고, 그 값이 이차방정식의 근과 계수의 관계로 어떻게 얻어지는지 말하시오.","a":"x²−4x+3=3에서 x(x−4)=0이므로 x=0, 4이고 교점 사이의 거리는 4입니다. 두 근을 α, β라 하면 α+β=4, αβ=0이고 거리 |α−β|는 (α−β)²=(α+β)²−4αβ=16에서 4입니다. 즉 근의 합과 곱만으로도 두 교점 사이의 거리를 구할 수 있습니다.","kw":[{"l":"x=0, 4, 거리 4","a":["4"]},{"l":"(α−β)²=(α+β)²−4αβ","a":["(α+β)²","합과 곱"]}]} },

  { main:{"id":"OF2","cat":"함수","grade":"중2","q":"기울기가 2이고 점 (1, 3)을 지나는 직선이 있습니다. 이 직선의 식과 x절편, y절편을 구하고, 이 직선과 두 좌표축으로 둘러싸인 삼각형의 넓이를 말로 설명하며 구하시오.","a":"먼저 직선을 y=2x+b로 놓고 (1, 3)을 대입하면 3=2+b이므로 b=1이고 식은 y=2x+1입니다. y절편은 1이고, y=0을 대입하면 x=−1/2이므로 x절편은 −1/2입니다. 두 좌표축과 이루는 삼각형은 직각삼각형이고, 밑변이 1/2, 높이가 1이므로 넓이는 (1/2)×(1/2)×1=1/4입니다.","kw":[{"l":"y=2x+1","a":["y=2x+1"]},{"l":"y절편 1, x절편 −1/2","a":["−1/2"]},{"l":"넓이 1/4","a":["1/4"]}]},
    follow:{"id":"OF2F","cat":"함수","grade":"중2","q":"이 직선을 y축의 방향으로 2만큼 평행이동한 직선과 두 좌표축으로 둘러싸인 삼각형의 넓이를 구하시오.","a":"평행이동한 직선은 y=2x+3입니다. y절편은 3이고 x절편은 −3/2이므로 넓이는 (1/2)×(3/2)×3=9/4입니다.","kw":[{"l":"y=2x+3","a":["y=2x+3"]},{"l":"x절편 −3/2","a":["−3/2"]},{"l":"9/4","a":["9/4"]}]} },

  { main:{"id":"OF3","cat":"함수","grade":"중2","q":"반비례 관계 y=12/x의 그래프 위에서 제1사분면에 있는 점 P를 아무렇게나 잡습니다. P에서 x축과 y축에 각각 수선을 내릴 때, 두 좌표축과 두 수선으로 만들어지는 직사각형의 넓이가 P의 위치와 관계없이 일정한 까닭을 말로 설명하시오.","a":"먼저 P의 좌표를 (a, b)라 하면 a>0, b>0입니다. P에서 x축에 내린 수선의 발은 (a, 0), y축에 내린 수선의 발은 (0, b)이므로 직사각형의 가로는 a, 세로는 b입니다. 그래프 위의 점이므로 b=12/a이고 따라서 ab=12입니다. 넓이가 ab=12로 항상 같으므로 점의 위치와 관계없이 일정합니다.","kw":[{"l":"P(a,b)로 놓음","a":["(a, b)","(a,b)"]},{"l":"가로 a, 세로 b","a":["가로","세로"]},{"l":"ab=12","a":["12"]}]},
    follow:{"id":"OF3F","cat":"함수","grade":"중2","q":"이 그래프와 직선 y=x가 제1사분면에서 만나는 점의 좌표와 그 점에서 원점까지의 거리를 구하시오.","a":"y=x를 y=12/x에 대입하면 x²=12이므로 x=2√3이고 교점은 (2√3, 2√3)입니다. 원점까지의 거리는 √(12+12)=√24=2√6입니다.","kw":[{"l":"x²=12","a":["12"]},{"l":"(2√3, 2√3)","a":["2√3"]},{"l":"거리 2√6","a":["2√6"]}]} },

  { main:{"id":"OF4","cat":"함수","grade":"중3","q":"이차함수 y=−x²+4x의 그래프에 대해 꼭짓점의 좌표, 축의 방정식, x축과 만나는 점의 좌표를 구하고 그래프의 모양을 말로 설명하시오.","a":"먼저 완전제곱식으로 고치면 y=−(x−2)²+4입니다. 따라서 꼭짓점은 (2, 4)이고 축은 x=2입니다. x²의 계수가 음수이므로 위로 볼록한 포물선입니다. y=0이면 −x(x−4)=0이므로 x=0 또는 x=4이고 x축과 (0, 0), (4, 0)에서 만납니다.","kw":[{"l":"완전제곱식 −(x−2)²+4","a":["(x−2)²"]},{"l":"꼭짓점 (2,4), 축 x=2","a":["(2, 4)","x=2"]},{"l":"위로 볼록","a":["위로 볼록"]},{"l":"x절편 0, 4","a":["0","4"]}]},
    follow:{"id":"OF4F","cat":"함수","grade":"중3","q":"이 그래프와 직선 y=3이 만나는 두 점 사이의 거리를 구하고, 두 점의 중점이 축 위에 있음을 확인하시오.","a":"−x²+4x=3에서 x²−4x+3=0이므로 (x−1)(x−3)=0이고 x=1, 3입니다. 두 점은 (1, 3), (3, 3)이고 거리는 2입니다. 중점은 (2, 3)으로 x좌표가 2이므로 대칭축 x=2 위에 있습니다.","kw":[{"l":"x=1, 3","a":["1","3"]},{"l":"거리 2","a":["2"]},{"l":"중점 x=2, 축 위","a":["대칭축","x=2"]}]} },

  { main:{"id":"OF5","cat":"함수","grade":"중3","q":"이차함수 y=x²−6x+5의 그래프의 꼭짓점, x절편, y절편을 구하고, 꼭짓점과 x축 위의 두 교점을 꼭짓점으로 하는 삼각형의 넓이를 말로 설명하며 구하시오.","a":"먼저 완전제곱식으로 고치면 y=(x−3)²−4이므로 꼭짓점은 (3, −4)입니다. y절편은 x=0을 대입한 5입니다. x절편은 (x−1)(x−5)=0에서 1과 5입니다. 삼각형의 밑변은 두 x절편 사이의 거리 4이고 높이는 꼭짓점의 y좌표의 절댓값 4이므로 넓이는 (1/2)×4×4=8입니다.","kw":[{"l":"꼭짓점 (3,−4)","a":["(3, −4)","(3,−4)"]},{"l":"y절편 5","a":["5"]},{"l":"x절편 1, 5","a":["1"]},{"l":"넓이 8","a":["8"]}]},
    follow:{"id":"OF5F","cat":"함수","grade":"중3","q":"이 그래프를 x축의 방향으로 −3만큼 평행이동한 그래프의 식과 꼭짓점을 구하시오.","a":"x 대신 x+3을 대입하면 y=(x+3−3)²−4=x²−4입니다. 꼭짓점은 (0, −4)입니다.","kw":[{"l":"y=x²−4","a":["x²−4"]},{"l":"꼭짓점 (0,−4)","a":["(0, −4)","(0,−4)"]}]} },

  { main:{"id":"OF6","cat":"함수","grade":"중3","q":"좌표평면 위에 두 점 A(1, 2), B(5, 4)가 있습니다. 직선 AB의 방정식과 선분 AB의 중점, 길이를 구하고 풀이를 말로 설명하시오.","a":"먼저 기울기는 (4−2)/(5−1)=1/2입니다. 점 A를 지나므로 y−2=(1/2)(x−1)이고 y=x/2+3/2입니다. 중점은 두 점의 좌표의 평균이므로 (3, 3)입니다. 길이는 가로 방향 4, 세로 방향 2의 직각삼각형의 빗변이므로 √(16+4)=2√5입니다.","kw":[{"l":"기울기 1/2","a":["1/2"]},{"l":"y=x/2+3/2","a":["3/2"]},{"l":"중점 (3,3)","a":["(3, 3)","(3,3)"]},{"l":"길이 2√5","a":["2√5"]}]},
    follow:{"id":"OF6F","cat":"함수","grade":"중3","q":"x축 위의 점 P를 잡아 AP+PB가 가장 작도록 할 때 P의 좌표와 그 최솟값을 구하고 까닭을 설명하시오.","a":"먼저 A를 x축에 대해 대칭이동한 점 A′(1, −2)를 잡습니다. x축 위의 모든 P에 대해 AP=A′P이므로 AP+PB=A′P+PB이고 이는 A′, P, B가 한 직선 위에 있을 때 최소입니다. 직선 A′B는 기울기 (4+2)/(5−1)=3/2이고 y+2=(3/2)(x−1)에서 y=0이면 x=7/3이므로 P(7/3, 0)입니다. 최솟값은 A′B=√(16+36)=2√13입니다.","kw":[{"l":"A′(1,−2)","a":["A′","대칭"]},{"l":"A′, P, B가 한 직선","a":["한 직선"]},{"l":"P(7/3, 0)","a":["7/3"]},{"l":"최솟값 2√13","a":["2√13"]}]} },

  { main:{"id":"OF7","cat":"함수","grade":"중3","q":"이차방정식 x²+kx+9=0이 중근을 가질 때 k의 값을 구하고, 이것을 이차함수 y=x²+kx+9의 그래프가 x축에 접하는 것으로 말로 설명하시오.","a":"먼저 중근을 가지려면 판별식이 0이어야 하므로 k²−4×1×9=0이고 k²=36, 즉 k=6 또는 k=−6입니다. k=6이면 x²+6x+9=(x+3)²이므로 그래프의 꼭짓점이 (−3, 0)이고, k=−6이면 (x−3)²이므로 꼭짓점이 (3, 0)입니다. 중근은 그래프의 꼭짓점이 x축 위에 있어서 x축과 한 점에서만 만난다는 뜻입니다.","kw":[{"l":"판별식 =0","a":["판별식"]},{"l":"k=6 또는 −6","a":["6","−6"]},{"l":"꼭짓점이 x축 위, 접함","a":["접하","꼭짓점"]}]},
    follow:{"id":"OF7F","cat":"함수","grade":"중3","q":"x²+kx+9=0이 서로 다른 두 실근을 가질 k의 범위와, k=0일 때 그래프의 모습을 말하시오.","a":"판별식 k²−36>0이므로 k<−6 또는 k>6입니다. k=0이면 y=x²+9로 꼭짓점이 (0, 9)이고 그래프가 x축보다 위에 있어 만나지 않으므로 실근이 없습니다.","kw":[{"l":"k<−6 또는 k>6","a":["−6","6"]},{"l":"k=0은 x축과 만나지 않음","a":["만나지 않","(0, 9)"]}]} },

  { main:{"id":"OF8","cat":"함수","grade":"중3","q":"함수 y=|x−2|의 그래프의 모양을 말로 설명하고, 직선 y=1과 만나는 두 점의 좌표를 구하시오.","a":"먼저 x≥2일 때는 y=x−2, x<2일 때는 y=−(x−2)이므로 꼭짓점이 (2, 0)인 V자 모양입니다. y=1과 만나려면 |x−2|=1이므로 x−2=1 또는 x−2=−1, 즉 x=3 또는 x=1입니다. 따라서 두 점은 (1, 1), (3, 1)입니다.","kw":[{"l":"구간을 나눔","a":["x≥2","x<2"]},{"l":"꼭짓점 (2,0)의 V자","a":["V자","(2, 0)"]},{"l":"(1,1), (3,1)","a":["(1, 1)","(3, 1)"]}]},
    follow:{"id":"OF8F","cat":"함수","grade":"중3","q":"이 그래프와 직선 y=4로 둘러싸인 삼각형의 넓이를 구하시오.","a":"y=4와 만나는 점은 |x−2|=4에서 x=−2, 6이므로 밑변은 8입니다. 높이는 꼭짓점 (2, 0)에서 y=4까지의 거리 4이므로 넓이는 (1/2)×8×4=16입니다.","kw":[{"l":"x=−2, 6, 밑변 8","a":["8"]},{"l":"높이 4","a":["4"]},{"l":"넓이 16","a":["16"]}]} },

  { main:{"id":"OF9","cat":"함수","grade":"중2","q":"두 직선 y=x+1과 y=−2x+7이 있습니다. 두 직선의 교점의 좌표와, 두 직선과 x축으로 둘러싸인 삼각형의 넓이를 말로 설명하며 구하시오.","a":"먼저 두 식을 연립하면 x+1=−2x+7에서 3x=6이므로 x=2이고 y=3, 교점은 (2, 3)입니다. 두 직선의 x절편은 각각 −1과 7/2이므로 x축 위의 밑변은 7/2−(−1)=9/2입니다. 높이는 교점의 y좌표 3이므로 넓이는 (1/2)×(9/2)×3=27/4입니다.","kw":[{"l":"연립, 교점 (2,3)","a":["(2, 3)","(2,3)"]},{"l":"x절편 −1, 7/2","a":["7/2"]},{"l":"밑변 9/2","a":["9/2"]},{"l":"넓이 27/4","a":["27/4"]}]},
    follow:{"id":"OF9F","cat":"함수","grade":"중2","q":"같은 두 직선과 y축으로 둘러싸인 삼각형의 넓이를 구하시오.","a":"y절편이 각각 1과 7이므로 y축 위의 밑변은 6입니다. 높이는 교점의 x좌표 2이므로 넓이는 (1/2)×6×2=6입니다.","kw":[{"l":"y절편 1, 7, 밑변 6","a":["6"]},{"l":"높이 2","a":["2"]},{"l":"넓이 6","a":["6"]}]} },

  { main:{"id":"OF10","cat":"함수","grade":"중2","q":"처음에 물이 10리터 들어 있는 통에서 매분 2리터씩 물이 빠져나갑니다. x분 후 남은 물의 양을 y리터라 할 때, y를 x의 식으로 나타내고, 그래프의 x절편과 y절편의 의미와 x의 범위를 말로 설명하시오.","a":"먼저 처음 양이 10이고 매분 2씩 줄어드므로 y=10−2x입니다. y절편 10은 처음 물의 양이고, x절편은 y=0일 때 x=5이므로 물이 모두 빠지는 시각이 5분 후입니다. 물의 양은 0 이상이어야 하고 시간은 0 이상이므로 x의 범위는 0≤x≤5입니다.","kw":[{"l":"y=10−2x","a":["10−2x"]},{"l":"y절편 10=처음 양","a":["처음"]},{"l":"x절편 5분","a":["5"]},{"l":"0≤x≤5","a":["0≤x≤5","범위"]}]},
    follow:{"id":"OF10F","cat":"함수","grade":"중2","q":"다른 통에는 처음에 4리터가 있고 매분 1리터씩 물이 채워집니다. 두 통의 물의 양이 같아지는 때와 그때의 물의 양을 구하시오.","a":"두 번째 통은 y=4+x입니다. 10−2x=4+x에서 3x=6이므로 x=2이고 y=6입니다. 따라서 2분 후에 두 통 모두 6리터가 됩니다.","kw":[{"l":"y=4+x","a":["4+x"]},{"l":"x=2","a":["2"]},{"l":"6리터","a":["6"]}]} },

  { main:{"id":"OG11","cat":"기하","grade":"중3","q":"AB와 AC의 길이가 모두 13이고 BC의 길이가 10인 이등변삼각형 ABC가 있습니다. 꼭짓점 A에서 BC에 내린 높이와 삼각형의 넓이, 내접원의 반지름을 구하고 풀이를 말로 설명하시오.","a":"먼저 꼭짓점 A에서 BC에 수선을 내리면 이등변삼각형이므로 그 발 H는 BC의 중점이고 BH=5입니다. 직각삼각형 ABH에서 높이 AH=√(169−25)=12입니다. 넓이는 (1/2)×10×12=60입니다. 내접원의 반지름은 넓이=(1/2)×r×(세 변의 길이의 합)에서 60=(1/2)×r×36이므로 r=10/3입니다.","kw":[{"l":"수선의 발은 BC의 중점, BH=5","a":["중점","5"]},{"l":"높이 12","a":["12"]},{"l":"넓이 60","a":["60"]},{"l":"내접원 r=10/3","a":["10/3"]}]},
    follow:{"id":"OG11F","cat":"기하","grade":"중3","q":"이 삼각형의 외접원의 반지름을 구하시오.","a":"외접원의 중심 O는 높이 AH 위에 있습니다. 반지름을 R이라 하면 OA=OB=R이고 OH=12−R입니다. 직각삼각형 OBH에서 R²=5²+(12−R)²이므로 24R=169이고 R=169/24입니다.","kw":[{"l":"중심이 높이 위","a":["높이"]},{"l":"R²=25+(12−R)²","a":["(12−R)²"]},{"l":"R=169/24","a":["169/24"]}]} },

  { main:{"id":"OG12","cat":"기하","grade":"중2","q":"대각선의 길이가 6과 8인 마름모가 있습니다. 마름모의 한 변의 길이와 넓이, 서로 마주 보는 두 변 사이의 거리를 구하고 풀이를 말로 설명하시오.","a":"먼저 마름모의 두 대각선은 서로 수직으로 이등분하므로 직각삼각형이 생기고, 두 직각변은 3과 4이므로 한 변은 5입니다. 넓이는 (대각선의 곱)÷2=6×8÷2=24입니다. 마름모는 평행사변형이므로 넓이=밑변×높이이고 24=5×h에서 두 변 사이의 거리 h=24/5입니다.","kw":[{"l":"대각선은 수직이등분, 한 변 5","a":["수직","5"]},{"l":"넓이 24","a":["24"]},{"l":"넓이=밑변×높이","a":["밑변","높이"]},{"l":"거리 24/5","a":["24/5"]}]},
    follow:{"id":"OG12F","cat":"기하","grade":"중2","q":"이 마름모에 꼭 맞게 들어가는 원(네 변에 모두 접하는 원)의 반지름을 구하시오.","a":"마름모의 중심에서 각 변까지의 거리가 같고, 그 거리는 두 변 사이의 거리의 절반입니다. 따라서 반지름은 (24/5)÷2=12/5입니다.","kw":[{"l":"중심에서 각 변까지 같은 거리","a":["같"]},{"l":"반지름 12/5","a":["12/5"]}]} },

  { main:{"id":"OG13","cat":"기하","grade":"중2","q":"넓이가 40인 평행사변형 ABCD가 있습니다. 변 BC의 중점을 M이라 하고, 선분 AM과 대각선 BD가 만나는 점을 P라 할 때, 삼각형 ABP의 넓이를 구하고 풀이를 말로 설명하시오.","a":"먼저 AD와 BC가 평행하므로 삼각형 PBM과 삼각형 PDA는 닮음입니다. BM이 BC의 절반이고 BC=AD이므로 닮음비는 BM:DA=1:2이고, 따라서 BP:PD=1:2입니다. 삼각형 ABD의 넓이는 평행사변형의 절반인 20입니다. 삼각형 ABP와 삼각형 ABD는 높이가 같고 밑변의 비가 BP:BD=1:3이므로 삼각형 ABP의 넓이는 20×1/3=20/3입니다.","kw":[{"l":"삼각형 PBM ∽ PDA","a":["닮음"]},{"l":"BP:PD=1:2","a":["1:2"]},{"l":"삼각형 ABD=20","a":["20"]},{"l":"ABP=20/3","a":["20/3"]}]},
    follow:{"id":"OG13F","cat":"기하","grade":"중2","q":"사각형 PMCD의 넓이를 구하시오.","a":"삼각형 BCD의 넓이는 20입니다. 삼각형 PBM은 삼각형 ABM의 넓이에서 삼각형 ABP를 뺀 것인데, 삼각형 ABM의 넓이는 평행사변형의 1/4인 10이므로 삼각형 PBM의 넓이는 10−20/3=10/3입니다. 따라서 사각형 PMCD의 넓이는 20−10/3=50/3입니다.","kw":[{"l":"삼각형 BCD=20","a":["20"]},{"l":"삼각형 ABM=10","a":["10"]},{"l":"PBM=10/3","a":["10/3"]},{"l":"50/3","a":["50/3"]}]} },

  { main:{"id":"OG14","cat":"기하","grade":"중2","q":"원에 내접하는 사각형 ABCD가 있습니다. 각 A의 크기가 70°이고 각 B의 크기가 95°일 때, 각 C와 각 D의 크기를 구하고 그 까닭을 말로 설명하시오.","a":"원에 내접하는 사각형에서는 마주 보는 두 각의 크기의 합이 180°입니다. 각 C는 각 A의 맞은편 각이므로 180°−70°=110°이고, 각 D는 각 B의 맞은편 각이므로 180°−95°=85°입니다. 이는 마주 보는 두 각이 각각 같은 두 점을 잇는 호에 대한 원주각의 합으로 호 전체인 360°의 절반이 되기 때문입니다.","kw":[{"l":"마주 보는 각의 합 180°","a":["180"]},{"l":"∠C=110°","a":["110"]},{"l":"∠D=85°","a":["85"]},{"l":"원주각, 호 360°의 절반","a":["원주각","360"]}]},
    follow:{"id":"OG14F","cat":"기하","grade":"중2","q":"변 BC를 점 C 쪽으로 연장한 점을 E라 할 때, 각 DCE의 크기를 구하고 이것이 어떤 각과 같은지 말하시오.","a":"각 DCE는 각 C의 외각이므로 180°−110°=70°입니다. 이 값은 각 C의 맞은편 각인 각 A와 같습니다. 즉 내접사각형의 한 외각은 그 이웃한 내각의 맞은편 내각과 같습니다.","kw":[{"l":"외각 70°","a":["70"]},{"l":"맞은편 내각 A와 같음","a":["각 A","같"]}]} },

  { main:{"id":"OG15","cat":"기하","grade":"중2","q":"키가 1.6미터인 사람의 그림자 길이가 2.4미터일 때, 같은 시각에 그림자 길이가 9미터인 나무의 높이를 구하고 풀이를 말로 설명하시오.","a":"먼저 같은 시각에는 햇빛이 비치는 각도가 같으므로 사람과 그림자가 이루는 직각삼각형과 나무와 그림자가 이루는 직각삼각형은 두 각이 같아 닮음입니다. 닮음비는 그림자의 비인 2.4:9입니다. 높이를 h라 하면 1.6:h=2.4:9이므로 h=1.6×9÷2.4=6입니다. 따라서 나무의 높이는 6미터입니다.","kw":[{"l":"햇빛 각도가 같아 닮음","a":["닮음"]},{"l":"그림자의 비로 닮음비","a":["그림자"]},{"l":"높이 6미터","a":["6"]}]},
    follow:{"id":"OG15F","cat":"기하","grade":"중2","q":"나무의 꼭대기에서 그림자의 끝까지의 거리를 구하시오.","a":"나무의 높이 6과 그림자 9가 직각을 낀 두 변이므로 거리는 피타고라스 정리에 의해 √(36+81)=√117=3√13미터입니다.","kw":[{"l":"피타고라스 정리","a":["피타고라스"]},{"l":"3√13","a":["3√13"]}]} },

  { main:{"id":"OG16","cat":"기하","grade":"중3","q":"반지름이 6이고 중심각이 120°인 부채꼴이 있습니다. 이 부채꼴의 호의 길이와 넓이를 구하고, 이 부채꼴을 말아서 원뿔을 만들 때 밑면의 반지름을 구하시오.","a":"먼저 호의 길이는 원 둘레 12π의 120/360인 1/3이므로 4π입니다. 넓이도 원의 넓이 36π의 1/3이므로 12π입니다. 원뿔로 말면 부채꼴의 호가 밑면 원의 둘레가 되므로 2πr=4π에서 밑면의 반지름 r=2입니다.","kw":[{"l":"호의 길이 4π","a":["4π"]},{"l":"넓이 12π","a":["12π"]},{"l":"호=밑면 둘레","a":["밑면"]},{"l":"r=2","a":["2"]}]},
    follow:{"id":"OG16F","cat":"기하","grade":"중3","q":"이 원뿔의 높이와 부피를 구하시오.","a":"모선은 부채꼴의 반지름 6이고 밑면의 반지름이 2이므로 높이는 √(36−4)=√32=4√2입니다. 부피는 (1/3)×π×2²×4√2=16√2π/3입니다.","kw":[{"l":"모선 6, 높이 4√2","a":["4√2"]},{"l":"부피 16√2π/3","a":["16√2"]}]} },

  { main:{"id":"OG17","cat":"기하","grade":"중3","q":"∠C가 직각인 직각삼각형 ABC에서 꼭짓점 C에서 빗변 AB에 내린 수선의 발을 H라 하고, AH=4, HB=9라 합니다. CH의 길이와 AC, BC의 길이를 구하고 풀이를 말로 설명하시오.","a":"먼저 삼각형 AHC와 삼각형 CHB는 각이 같아 닮음입니다. 그래서 AH:CH=CH:HB이므로 CH²=AH×HB=4×9=36이고 CH=6입니다. 다음으로 직각삼각형 AHC에서 AC=√(16+36)=2√13이고, 직각삼각형 CHB에서 BC=√(81+36)=3√13입니다.","kw":[{"l":"삼각형 AHC ∽ CHB","a":["닮음"]},{"l":"CH²=AH×HB","a":["AH×HB","곱"]},{"l":"CH=6","a":["6"]},{"l":"AC=2√13, BC=3√13","a":["2√13","3√13"]}]},
    follow:{"id":"OG17F","cat":"기하","grade":"중3","q":"삼각형 ABC의 넓이를 두 가지 방법으로 구하고 서로 같음을 확인하시오.","a":"빗변 AB=13을 밑변으로 하고 높이를 CH=6으로 하면 (1/2)×13×6=39입니다. 직각을 낀 두 변으로 하면 (1/2)×2√13×3√13=(1/2)×6×13=39입니다. 두 값이 같습니다.","kw":[{"l":"(1/2)×13×6=39","a":["39"]},{"l":"직각을 낀 두 변으로도 39","a":["2√13","같"]}]} },

  { main:{"id":"OG18","cat":"기하","grade":"중3","q":"좌표평면 위에 세 점 A(1, 1), B(7, 1), C(4, 5)가 있습니다. 삼각형 ABC가 어떤 삼각형인지 변의 길이로 판단하고 넓이를 구하시오. 풀이를 말로 설명하시오.","a":"먼저 변의 길이를 구합니다. AB는 y좌표가 같으므로 7−1=6입니다. AC는 가로 3, 세로 4이므로 √(9+16)=5이고, BC도 가로 3, 세로 4이므로 5입니다. AC=BC이므로 이등변삼각형입니다. 밑변 AB가 x축에 평행하므로 높이는 C의 y좌표에서 1을 뺀 4이고 넓이는 (1/2)×6×4=12입니다.","kw":[{"l":"AB=6","a":["6"]},{"l":"AC=BC=5","a":["5"]},{"l":"이등변삼각형","a":["이등변"]},{"l":"넓이 12","a":["12"]}]},
    follow:{"id":"OG18F","cat":"기하","grade":"중3","q":"삼각형 ABC의 무게중심의 좌표를 구하고, 무게중심이 밑변 AB에서 얼마나 떨어져 있는지 확인하시오.","a":"무게중심의 좌표는 세 꼭짓점의 좌표의 평균이므로 x=(1+7+4)/3=4, y=(1+1+5)/3=7/3으로 (4, 7/3)입니다. AB는 y=1이므로 무게중심에서 AB까지의 거리는 7/3−1=4/3이고, 이는 높이 4의 1/3입니다.","kw":[{"l":"좌표의 평균","a":["평균"]},{"l":"(4, 7/3)","a":["7/3"]},{"l":"높이의 1/3","a":["1/3"]}]} },

  { main:{"id":"OG19","cat":"기하","grade":"중3","q":"가로 8, 세로 6인 직사각형 종이 ABCD를 꼭짓점 A가 꼭짓점 C에 겹쳐지도록 접습니다. 접힌 선의 길이를 구하고 풀이를 말로 설명하시오. (AB=8, BC=6이고 접는 선은 AB와 CD 위의 점 E, F를 잇습니다.)","a":"먼저 대각선 AC=√(64+36)=10입니다. A가 C에 겹치도록 접으므로 접는 선은 AC를 수직이등분합니다. 접는 선과 AC의 교점을 O라 하면 AO=5입니다. 좌표로 A(0, 0), C(8, 6)를 놓으면 접는 선은 4x+3y=25이고 AB 위의 점 E는 (25/4, 0), CD 위의 점 F는 (7/4, 6)입니다. 따라서 EF=√((9/2)²+6²)=15/2입니다.","kw":[{"l":"AC=10","a":["10"]},{"l":"AC의 수직이등분선","a":["수직이등분"]},{"l":"E(25/4, 0)","a":["25/4"]},{"l":"EF=15/2","a":["15/2"]}]},
    follow:{"id":"OG19F","cat":"기하","grade":"중3","q":"사각형 AECF가 어떤 사각형인지 말하고 넓이를 구하시오.","a":"AE=25/4이고 EC=√((7/4)²+36)=25/4로 같습니다. 대각선 AC와 EF가 서로 수직으로 이등분하므로 마름모입니다. 넓이는 (두 대각선의 곱)÷2=10×(15/2)÷2=75/2입니다.","kw":[{"l":"마름모","a":["마름모"]},{"l":"AE=EC=25/4","a":["25/4"]},{"l":"넓이 75/2","a":["75/2"]}]} },

  { main:{"id":"OG20","cat":"기하","grade":"중3","q":"한 모서리의 길이가 6인 정사면체가 있습니다. 이 정사면체의 높이와 부피를 구하고 풀이를 말로 설명하시오.","a":"먼저 밑면은 한 변이 6인 정삼각형이고 높이가 3√3이므로 넓이는 (1/2)×6×3√3=9√3입니다. 꼭짓점에서 내린 수선의 발은 밑면의 무게중심이고 무게중심에서 꼭짓점까지의 거리는 정삼각형 높이의 2/3인 2√3입니다. 직각삼각형에서 모서리 6이 빗변이므로 정사면체의 높이는 √(36−12)=2√6입니다. 부피는 (1/3)×9√3×2√6=6√18=18√2입니다.","kw":[{"l":"밑면 넓이 9√3","a":["9√3"]},{"l":"발은 무게중심, 2√3","a":["무게중심","2√3"]},{"l":"높이 2√6","a":["2√6"]},{"l":"부피 18√2","a":["18√2"]}]},
    follow:{"id":"OG20F","cat":"기하","grade":"중3","q":"이 정사면체의 겉넓이를 구하시오.","a":"네 면이 모두 한 변이 6인 정삼각형이고 한 면의 넓이는 9√3이므로 겉넓이는 4×9√3=36√3입니다.","kw":[{"l":"네 면이 합동인 정삼각형","a":["네 면","정삼각형"]},{"l":"36√3","a":["36√3"]}]} },

  { main:{"id":"OF11","cat":"함수","grade":"중2","q":"일차함수의 그래프가 두 점 (−2, 5)와 (4, −1)을 지납니다. 이 직선의 식과 x절편, y절편을 구하고, 이 직선과 두 좌표축으로 둘러싸인 삼각형의 넓이를 말로 설명하며 구하시오.","a":"먼저 기울기는 (−1−5)/(4−(−2))=−1입니다. y=−x+b에 (4, −1)을 대입하면 −1=−4+b이므로 b=3이고 식은 y=−x+3입니다. y절편은 3, x절편은 y=0일 때 x=3입니다. 삼각형의 밑변과 높이가 모두 3이므로 넓이는 (1/2)×3×3=9/2입니다.","kw":[{"l":"기울기 −1","a":["−1"]},{"l":"y=−x+3","a":["−x+3"]},{"l":"절편 3, 3","a":["3"]},{"l":"넓이 9/2","a":["9/2"]}]},
    follow:{"id":"OF11F","cat":"함수","grade":"중2","q":"이 직선 위의 점 중 x좌표와 y좌표가 같은 점의 좌표를 구하시오.","a":"y=x를 대입하면 x=−x+3이므로 x=3/2이고 점은 (3/2, 3/2)입니다. 이는 직선 y=−x+3과 직선 y=x의 교점입니다.","kw":[{"l":"x=−x+3","a":["3/2"]},{"l":"교점","a":["교점"]}]} },

  { main:{"id":"OF12","cat":"함수","grade":"중3","q":"꼭짓점의 좌표가 (1, −2)이고 점 (3, 6)을 지나는 이차함수의 식을 구하고, 이 그래프의 x절편을 구하시오. 풀이를 말로 설명하시오.","a":"먼저 꼭짓점이 (1, −2)이므로 y=a(x−1)²−2로 놓습니다. 점 (3, 6)을 대입하면 6=4a−2이므로 a=2이고 식은 y=2(x−1)²−2=2x²−4x입니다. y=0이면 2x(x−2)=0이므로 x절편은 0과 2입니다.","kw":[{"l":"y=a(x−1)²−2로 놓음","a":["a(x−1)²"]},{"l":"a=2","a":["a=2","2"]},{"l":"y=2x²−4x","a":["2x²−4x"]},{"l":"x절편 0, 2","a":["0","2"]}]},
    follow:{"id":"OF12F","cat":"함수","grade":"중3","q":"이 그래프와 직선 y=6이 만나는 두 점 사이의 거리를 구하시오.","a":"2(x−1)²−2=6에서 (x−1)²=4이므로 x=3 또는 x=−1입니다. 두 점은 (−1, 6), (3, 6)이고 거리는 4입니다. 두 점의 중점의 x좌표 1은 축 x=1 위에 있습니다.","kw":[{"l":"(x−1)²=4","a":["4"]},{"l":"x=3, −1","a":["3","−1"]},{"l":"거리 4","a":["4"]}]} },

  { main:{"id":"OF13","cat":"함수","grade":"중3","q":"이차함수 y=x²−4x+k의 그래프가 x축과 만나지 않도록 하는 k의 범위와, x축에 접할 때의 k의 값을 구하고 그래프의 꼭짓점의 위치로 말로 설명하시오.","a":"먼저 완전제곱식으로 고치면 y=(x−2)²+k−4이므로 꼭짓점은 (2, k−4)이고 아래로 볼록합니다. x축에 접하려면 꼭짓점의 y좌표가 0이어야 하므로 k=4입니다. 만나지 않으려면 꼭짓점이 x축 위쪽에 있어야 하므로 k−4>0, 즉 k>4입니다. 판별식 16−4k<0과도 같은 결과입니다.","kw":[{"l":"꼭짓점 (2, k−4)","a":["k−4"]},{"l":"접하면 k=4","a":["k=4","4"]},{"l":"k>4","a":["k>4"]},{"l":"판별식","a":["판별식"]}]},
    follow:{"id":"OF13F","cat":"함수","grade":"중3","q":"k=1일 때 그래프가 x축과 만나는 두 점 사이의 거리를 구하시오.","a":"x²−4x+1=0의 근은 근의 공식으로 x=2±√3이므로 두 점 사이의 거리는 2√3입니다.","kw":[{"l":"근 2±√3","a":["2±√3","√3"]},{"l":"거리 2√3","a":["2√3"]}]} },

  { main:{"id":"OF14","cat":"함수","grade":"중3","q":"이차함수 y=x²의 그래프와 직선 y=−x+6이 만나는 두 점의 좌표를 구하고, 두 교점 사이의 거리를 말로 설명하며 구하시오.","a":"먼저 두 식을 연립하면 x²=−x+6이므로 x²+x−6=0이고 (x+3)(x−2)=0입니다. x=2 또는 x=−3이고 교점은 (2, 4), (−3, 9)입니다. 두 점의 가로 방향 차가 5, 세로 방향 차가 5이므로 거리는 √(25+25)=5√2입니다.","kw":[{"l":"연립 x²+x−6=0","a":["x²+x−6"]},{"l":"x=2, −3","a":["2","−3"]},{"l":"(2,4), (−3,9)","a":["(2, 4)","(−3, 9)"]},{"l":"거리 5√2","a":["5√2"]}]},
    follow:{"id":"OF14F","cat":"함수","grade":"중3","q":"원점 O와 두 교점을 꼭짓점으로 하는 삼각형의 넓이를 구하시오. (직선이 y축과 만나는 점을 이용하시오.)","a":"직선과 y축의 교점을 C(0, 6)이라 하면 삼각형은 삼각형 OCP와 삼각형 OCQ로 나뉩니다. OC=6을 공통 밑변으로 보면 높이는 두 교점의 x좌표의 절댓값 2와 3입니다. 넓이는 (1/2)×6×2+(1/2)×6×3=6+9=15입니다.","kw":[{"l":"C(0,6)","a":["(0, 6)"]},{"l":"OC가 밑변, 높이 2와 3","a":["2","3"]},{"l":"넓이 15","a":["15"]}]} },

  { main:{"id":"OF15","cat":"함수","grade":"중1","q":"맞물려 돌아가는 두 톱니바퀴가 있습니다. 톱니가 24개인 톱니바퀴 A가 1분에 10바퀴 돌 때, 톱니가 x개인 톱니바퀴 B가 1분에 도는 바퀴 수 y를 x의 식으로 나타내고, 톱니가 30개이면 몇 바퀴 도는지 말로 설명하며 구하시오.","a":"먼저 맞물려 돌아가므로 같은 시간 동안 지나가는 톱니의 개수가 같습니다. A는 1분에 24×10=240개의 톱니가 지나가므로 B도 x×y=240입니다. 따라서 y=240/x로 반비례 관계입니다. 톱니가 30개이면 y=240/30=8바퀴입니다.","kw":[{"l":"지나가는 톱니 수가 같음","a":["같"]},{"l":"xy=240","a":["240"]},{"l":"y=240/x, 반비례","a":["반비례"]},{"l":"8바퀴","a":["8"]}]},
    follow:{"id":"OF15F","cat":"함수","grade":"중1","q":"B가 1분에 12바퀴 이상 돌게 하려면 톱니의 개수는 몇 개 이하이어야 합니까?","a":"240/x≥12이므로 x≤20입니다. 따라서 톱니는 20개 이하이어야 합니다. 톱니가 적을수록 더 빨리 도는 반비례 관계입니다.","kw":[{"l":"240/x≥12","a":["12"]},{"l":"x≤20","a":["20"]}]} },

  { main:{"id":"OF16","cat":"함수","grade":"중2","q":"연립방정식 x+y=5, 2x−y=1의 해를 두 일차방정식의 그래프를 이용하여 말로 설명하시오.","a":"먼저 각 방정식을 y에 대하여 풀면 y=−x+5, y=2x−1이고 각각 직선의 그래프입니다. 연립방정식의 해는 두 식을 동시에 만족하는 x, y의 값이므로 두 직선의 교점의 좌표입니다. 두 식을 더하면 3x=6이므로 x=2이고 y=3입니다. 따라서 두 직선은 점 (2, 3)에서 만납니다.","kw":[{"l":"y에 대하여 풀어 직선으로","a":["직선"]},{"l":"해=교점의 좌표","a":["교점"]},{"l":"x=2, y=3","a":["(2, 3)","x=2"]}]},
    follow:{"id":"OF16F","cat":"함수","grade":"중2","q":"연립방정식 x+y=5, 2x+2y=k의 해가 없을 때와 해가 무수히 많을 때의 k의 값을 각각 구하고 그래프로 설명하시오.","a":"두 번째 식은 x+y=k/2이므로 기울기가 같은 직선입니다. k/2≠5, 즉 k≠10이면 두 직선이 평행하여 만나지 않으므로 해가 없습니다. k=10이면 두 직선이 일치하므로 해가 무수히 많습니다.","kw":[{"l":"평행하면 해 없음","a":["평행"]},{"l":"k=10이면 일치, 무수히 많음","a":["일치","10"]}]} },

  { main:{"id":"OF17","cat":"함수","grade":"중3","q":"이차함수 y=−2x²+8x−6의 그래프의 꼭짓점, 최댓값, x절편, y절편을 구하고 풀이를 말로 설명하시오.","a":"먼저 완전제곱식으로 고치면 y=−2(x−2)²+2입니다. 꼭짓점은 (2, 2)이고 x²의 계수가 음수이므로 위로 볼록해서 x=2일 때 최댓값 2를 가집니다. y절편은 x=0을 대입한 −6입니다. x절편은 −2(x−1)(x−3)=0에서 1과 3입니다.","kw":[{"l":"완전제곱식 −2(x−2)²+2","a":["(x−2)²"]},{"l":"꼭짓점 (2,2), 최댓값 2","a":["(2, 2)","최댓값"]},{"l":"y절편 −6","a":["−6"]},{"l":"x절편 1, 3","a":["1","3"]}]},
    follow:{"id":"OF17F","cat":"함수","grade":"중3","q":"x의 범위가 0≤x≤3일 때 이 함수의 최댓값과 최솟값을 구하시오.","a":"꼭짓점의 x좌표 2가 범위 안에 있으므로 최댓값은 x=2에서 2입니다. 최솟값은 범위의 양 끝에서 비교하는데 x=0일 때 −6, x=3일 때 0이므로 x=0에서 최솟값 −6입니다.","kw":[{"l":"x=2에서 최댓값 2","a":["2"]},{"l":"양 끝 비교","a":["양 끝","끝"]},{"l":"최솟값 −6","a":["−6"]}]} },

  { main:{"id":"OF18","cat":"함수","grade":"중3","q":"둘레의 길이가 20인 직사각형의 가로를 x라 할 때, 넓이를 x의 식으로 나타내고 넓이가 가장 클 때의 가로, 세로의 길이와 넓이를 말로 설명하며 구하시오.","a":"먼저 둘레가 20이므로 가로와 세로의 합은 10이고 세로는 10−x입니다. 넓이는 y=x(10−x)=−x²+10x이고 0<x<10입니다. 완전제곱식으로 고치면 y=−(x−5)²+25이므로 x=5일 때 최댓값 25입니다. 가로와 세로가 모두 5인 정사각형일 때 넓이가 가장 큽니다.","kw":[{"l":"세로 10−x","a":["10−x"]},{"l":"y=−x²+10x","a":["−x²+10x"]},{"l":"x=5, 최댓값 25","a":["25"]},{"l":"정사각형","a":["정사각형"]}]},
    follow:{"id":"OF18F","cat":"함수","grade":"중3","q":"길이가 20인 울타리로 한쪽이 벽인 직사각형 모양의 우리를 만들 때, 우리의 넓이의 최댓값을 구하시오. (벽 쪽은 울타리가 필요 없습니다.)","a":"벽에 수직인 변의 길이를 x라 하면 벽에 평행한 변은 20−2x입니다. 넓이는 y=x(20−2x)=−2x²+20x=−2(x−5)²+50이므로 x=5일 때 최댓값 50입니다. 이때 벽에 평행한 변은 10입니다.","kw":[{"l":"평행한 변 20−2x","a":["20−2x"]},{"l":"y=−2(x−5)²+50","a":["50"]},{"l":"x=5, 최댓값 50","a":["x=5"]}]} },

  { main:{"id":"OF19","cat":"함수","grade":"중3","q":"두 이차함수 y=x²과 y=−x²+8의 그래프가 만나는 두 점의 좌표를 구하고 풀이를 말로 설명하시오.","a":"먼저 교점에서는 y값이 같으므로 x²=−x²+8입니다. 2x²=8이므로 x²=4, x=±2입니다. y=x²에 대입하면 y=4이므로 교점은 (−2, 4)와 (2, 4)입니다. 두 점은 y축에 대하여 대칭입니다.","kw":[{"l":"x²=−x²+8","a":["−x²+8"]},{"l":"x=±2","a":["±2","2"]},{"l":"(−2,4), (2,4)","a":["(−2, 4)","(2, 4)"]}]},
    follow:{"id":"OF19F","cat":"함수","grade":"중3","q":"두 그래프의 꼭짓점 (0, 0), (0, 8)과 두 교점을 꼭짓점으로 하는 사각형이 어떤 사각형인지 말하고 넓이를 구하시오.","a":"두 대각선은 교점끼리 이은 선분 길이 4와 꼭짓점끼리 이은 선분 길이 8입니다. 두 대각선은 (0, 4)에서 수직으로 만나 서로 이등분하므로 마름모입니다. 넓이는 (1/2)×4×8=16입니다.","kw":[{"l":"대각선 4와 8","a":["4","8"]},{"l":"수직이등분, 마름모","a":["마름모"]},{"l":"넓이 16","a":["16"]}]} },

  { main:{"id":"OF20","cat":"함수","grade":"중2","q":"요금제 A는 기본요금이 10000원이고 데이터 1GB를 쓸 때마다 2000원이 더해지고, 요금제 B는 기본요금이 4000원이고 1GB마다 3000원이 더해집니다. 데이터를 x GB 쓸 때의 요금을 각각 일차함수로 나타내고, 어느 때부터 A가 유리해지는지 그래프의 교점으로 말로 설명하시오.","a":"먼저 A의 요금은 y=10000+2000x, B의 요금은 y=4000+3000x입니다. 두 그래프의 교점에서 요금이 같으므로 10000+2000x=4000+3000x에서 x=6이고 요금은 22000원입니다. B의 기울기가 더 커서 x가 6보다 커지면 B의 그래프가 A의 그래프보다 위에 있으므로 6GB보다 많이 쓰면 A가 유리합니다.","kw":[{"l":"A: 10000+2000x","a":["10000+2000x"]},{"l":"B: 4000+3000x","a":["4000+3000x"]},{"l":"교점 x=6, 22000원","a":["6","22000"]},{"l":"6GB보다 많이 쓰면 A 유리","a":["A가 유리","많이"]}]},
    follow:{"id":"OF20F","cat":"함수","grade":"중2","q":"한 달에 8GB를 쓴다면 어느 요금제가 얼마나 싼지 구하시오.","a":"A는 10000+2000×8=26000원이고 B는 4000+3000×8=28000원이므로 A가 2000원 쌉니다.","kw":[{"l":"A 26000원","a":["26000"]},{"l":"B 28000원","a":["28000"]},{"l":"2000원 차이","a":["2000"]}]} },

  { main:{"id":"OG21","cat":"기하","grade":"중2","q":"삼각형 ABC에서 AB=6, AC=4, BC=5입니다. 각 A의 이등분선이 변 BC와 만나는 점을 D라 할 때, BD와 DC의 길이를 구하고 그 까닭을 말로 설명하시오.","a":"먼저 삼각형 ABD와 삼각형 ACD의 넓이의 비를 두 가지 방법으로 봅니다. 꼭짓점 A에서 BC까지의 높이가 같으므로 넓이의 비는 밑변의 비 BD:DC입니다. 또 점 D는 각의 이등분선 위에 있어 D에서 AB와 AC까지의 거리가 같으므로 넓이의 비는 AB:AC=6:4입니다. 따라서 BD:DC=6:4=3:2이고 BC=5이므로 BD=3, DC=2입니다.","kw":[{"l":"넓이비를 두 가지로","a":["두 가지","넓이"]},{"l":"BD:DC=AB:AC","a":["AB:AC","3:2"]},{"l":"BD=3, DC=2","a":["3","2"]}]},
    follow:{"id":"OG21F","cat":"기하","grade":"중2","q":"삼각형 ABD의 넓이는 삼각형 ABC의 넓이의 몇 분의 몇인지 구하시오.","a":"두 삼각형은 꼭짓점 A에서 BC까지의 높이가 같으므로 넓이의 비는 밑변의 비 BD:BC=3:5입니다. 따라서 삼각형 ABD의 넓이는 삼각형 ABC의 3/5입니다.","kw":[{"l":"높이가 같음","a":["높이"]},{"l":"3/5","a":["3/5"]}]} },

  { main:{"id":"OG22","cat":"기하","grade":"중3","q":"한 변의 길이가 8인 정사각형 ABCD의 꼭짓점 C가 변 AD의 중점 M에 겹치도록 종이를 접습니다. 접는 선이 변 CD와 만나는 점을 E라 할 때, DE의 길이를 구하고 풀이를 말로 설명하시오.","a":"먼저 접으면 C와 M이 겹치므로 점 E는 C와 M에서 같은 거리에 있어 EC=EM입니다. DE=x라 하면 EC=8−x이므로 EM=8−x입니다. 점 M은 AD의 중점이므로 DM=4이고, 직각삼각형 EDM에서 x²+16=(8−x)²입니다. 정리하면 16x=48이므로 x=3입니다. 따라서 DE=3이고 EM=5입니다.","kw":[{"l":"EC=EM","a":["EC=EM","같은 거리"]},{"l":"DM=4, 직각삼각형 EDM","a":["DM","4"]},{"l":"x²+16=(8−x)²","a":["(8−x)²"]},{"l":"DE=3","a":["3"]}]},
    follow:{"id":"OG22F","cat":"기하","grade":"중3","q":"접는 선이 변 AB와 만나는 점을 F라 할 때, AF의 길이와 접는 선 EF의 길이를 구하시오.","a":"점 F도 C와 M에서 같은 거리에 있으므로 FC=FM입니다. AF=y라 하면 FM²=y²+16이고 FC²=(8−y)²+64이므로 y²+16=(8−y)²+64에서 y=7입니다. E에서 AB에 수선을 내린 발을 H라 하면 AH=DE=3이므로 HF=4이고 EH=8입니다. 따라서 EF=√(16+64)=4√5입니다.","kw":[{"l":"FC=FM","a":["FC=FM"]},{"l":"AF=7","a":["7"]},{"l":"가로 4, 세로 8","a":["4","8"]},{"l":"EF=4√5","a":["4√5"]}]} },

  { main:{"id":"OG23","cat":"기하","grade":"중1","q":"반지름이 3인 구의 부피와 겉넓이를 구하고, 중심에서 거리가 2인 평면으로 이 구를 자를 때 생기는 단면의 넓이를 말로 설명하며 구하시오.","a":"먼저 부피는 (4/3)π×3³=36π이고 겉넓이는 4π×3²=36π입니다. 단면은 원이고, 구의 중심에서 단면의 중심까지의 거리가 2, 구의 반지름이 3이며 단면의 반지름은 이 둘과 직각삼각형을 이룹니다. 단면의 반지름은 √(9−4)=√5이므로 넓이는 5π입니다.","kw":[{"l":"부피 36π","a":["36π"]},{"l":"겉넓이 36π","a":["36π"]},{"l":"직각삼각형, 단면의 반지름 √5","a":["√5"]},{"l":"넓이 5π","a":["5π"]}]},
    follow:{"id":"OG23F","cat":"기하","grade":"중1","q":"반지름이 3인 구가 꼭 맞게 들어가는 원기둥의 부피를 구하고, 구와 원기둥의 부피의 비를 구하시오.","a":"원기둥의 밑면의 반지름은 3, 높이는 구의 지름 6이므로 부피는 π×9×6=54π입니다. 구의 부피 36π와의 비는 36π:54π=2:3입니다.","kw":[{"l":"높이는 지름 6","a":["6"]},{"l":"54π","a":["54π"]},{"l":"2:3","a":["2:3"]}]} },

  { main:{"id":"OG24","cat":"기하","grade":"중3","q":"중심이 O인 원 위의 점 A에서 그은 접선 위에 점 T를 잡고, 원 위의 다른 점 B를 잡습니다. 접선과 현 AB가 이루는 각 ∠TAB가 50°일 때 ∠OAB와 ∠AOB의 크기를 구하고 풀이를 말로 설명하시오.","a":"먼저 접선은 접점에서 반지름과 수직이므로 ∠OAT=90°입니다. ∠OAB=∠OAT−∠TAB=90°−50°=40°입니다. 삼각형 OAB는 OA=OB인 이등변삼각형이므로 ∠OBA=40°이고 ∠AOB=180°−40°−40°=100°입니다.","kw":[{"l":"접선⊥반지름, ∠OAT=90°","a":["90"]},{"l":"∠OAB=40°","a":["40"]},{"l":"이등변삼각형 OAB","a":["이등변"]},{"l":"∠AOB=100°","a":["100"]}]},
    follow:{"id":"OG24F","cat":"기하","grade":"중3","q":"호 AB의 위가 아닌 반대쪽 원 위의 점 C에서 ∠ACB의 크기를 구하고, 이 값이 ∠TAB와 어떤 관계인지 말하시오.","a":"호 AB에 대한 중심각이 100°이므로 원주각 ∠ACB는 그 절반인 50°입니다. 이는 접선과 현이 이루는 각 ∠TAB=50°와 같습니다. 즉 접선과 현이 이루는 각은 그 각 안에 있는 호에 대한 원주각과 같습니다.","kw":[{"l":"원주각은 중심각의 절반 50°","a":["절반","50"]},{"l":"∠TAB와 같음","a":["같"]}]} },

  { main:{"id":"OG25","cat":"기하","grade":"중2","q":"삼각형 ABC에서 각 B의 이등분선과 각 C의 이등분선이 만나는 점을 I라 합니다. 각 A의 크기가 60°일 때 ∠BIC의 크기를 구하고 풀이를 말로 설명하시오.","a":"먼저 삼각형의 내각의 합이 180°이므로 ∠B+∠C=120°입니다. 각 B와 각 C를 이등분했으므로 ∠IBC+∠ICB=(∠B+∠C)/2=60°입니다. 삼각형 IBC에서 ∠BIC=180°−60°=120°입니다.","kw":[{"l":"∠B+∠C=120°","a":["120"]},{"l":"이등분하므로 절반 60°","a":["절반","60"]},{"l":"∠BIC=120°","a":["120"]}]},
    follow:{"id":"OG25F","cat":"기하","grade":"중2","q":"각 A의 크기가 80°일 때 ∠BIC를 구하고, 일반적으로 ∠BIC와 ∠A 사이의 관계를 말하시오.","a":"∠B+∠C=100°이므로 ∠IBC+∠ICB=50°이고 ∠BIC=130°입니다. 일반적으로 ∠BIC=180°−(180°−∠A)/2=90°+∠A/2입니다.","kw":[{"l":"∠BIC=130°","a":["130"]},{"l":"90°+∠A/2","a":["90°","∠A/2"]}]} },

  { main:{"id":"OG26","cat":"기하","grade":"중2","q":"∠C가 직각인 직각삼각형 ABC에서 빗변 AB의 길이가 10이고 AB의 중점을 M이라 할 때, 선분 CM의 길이를 구하고 그 까닭을 말로 설명하시오.","a":"먼저 CM의 연장선 위에 CM=MD가 되도록 점 D를 잡습니다. 그러면 사각형 ACBD는 두 대각선 AB와 CD가 서로 다른 것을 이등분하므로 평행사변형입니다. ∠C가 직각이므로 직사각형이고 직사각형의 두 대각선은 길이가 같으므로 CD=AB=10입니다. 따라서 CM=CD/2=5입니다.","kw":[{"l":"CM을 연장해 CM=MD","a":["연장"]},{"l":"대각선이 서로 이등분, 평행사변형","a":["평행사변형"]},{"l":"직사각형, CD=AB","a":["직사각형"]},{"l":"CM=5","a":["5"]}]},
    follow:{"id":"OG26F","cat":"기하","grade":"중2","q":"AC=6, BC=8일 때 삼각형 ACM의 넓이를 구하시오.","a":"삼각형 ABC의 넓이는 (1/2)×6×8=24입니다. 삼각형 ACM과 삼각형 BCM은 밑변 AM=BM이고 높이가 같으므로 넓이가 같습니다. 따라서 삼각형 ACM의 넓이는 12입니다.","kw":[{"l":"ABC=24","a":["24"]},{"l":"AM=BM, 높이 같음","a":["높이"]},{"l":"12","a":["12"]}]} },

  { main:{"id":"OG27","cat":"기하","grade":"중2","q":"삼각형 ABC에서 변 AB 위의 점 D와 변 AC 위의 점 E를 DE와 BC가 평행하도록 잡습니다. AD=3, DB=2, DE=6일 때 BC의 길이를 구하고 풀이를 말로 설명하시오.","a":"먼저 DE∥BC이므로 동위각이 같아 삼각형 ADE와 삼각형 ABC는 닮음입니다. AB=AD+DB=5이므로 닮음비는 AD:AB=3:5입니다. 대응하는 변의 비 DE:BC도 3:5이므로 6:BC=3:5이고 BC=10입니다.","kw":[{"l":"동위각, 닮음","a":["동위각","닮음"]},{"l":"AB=5, 닮음비 3:5","a":["3:5"]},{"l":"BC=10","a":["10"]}]},
    follow:{"id":"OG27F","cat":"기하","grade":"중2","q":"AE:EC의 비를 구하고, 삼각형 ADE의 넓이가 18일 때 사다리꼴 DBCE의 넓이를 구하시오.","a":"닮음이므로 AE:AC=3:5이고 AE:EC=3:2입니다. 넓이의 비는 닮음비의 제곱이므로 삼각형 ADE와 삼각형 ABC는 9:25이고 삼각형 ADE와 사다리꼴 DBCE는 9:16입니다. 따라서 사다리꼴의 넓이는 18×16/9=32입니다.","kw":[{"l":"AE:EC=3:2","a":["3:2"]},{"l":"넓이비는 제곱 9:16","a":["9:16"]},{"l":"32","a":["32"]}]} },

  { main:{"id":"OG28","cat":"기하","grade":"중2","q":"반지름이 4인 원에 내접하는 정육각형이 있습니다. 이 정육각형의 둘레와 넓이를 구하고 풀이를 말로 설명하시오.","a":"먼저 정육각형의 중심과 여섯 꼭짓점을 이으면 합동인 이등변삼각형 6개가 생기고, 한 중심각이 60°이므로 정삼각형이 됩니다. 따라서 정육각형의 한 변의 길이는 반지름 4와 같고 둘레는 24입니다. 정삼각형 하나의 넓이는 (√3/4)×16=4√3이므로 정육각형의 넓이는 6×4√3=24√3입니다.","kw":[{"l":"중심각 60°, 정삼각형 6개","a":["60","정삼각형"]},{"l":"한 변=반지름 4, 둘레 24","a":["24"]},{"l":"정삼각형 넓이 4√3","a":["4√3"]},{"l":"넓이 24√3","a":["24√3"]}]},
    follow:{"id":"OG28F","cat":"기하","grade":"중2","q":"원 안에서 정육각형 바깥쪽 부분의 넓이를 구하시오.","a":"원의 넓이는 π×4²=16π입니다. 따라서 정육각형 바깥쪽 부분의 넓이는 16π−24√3입니다.","kw":[{"l":"원의 넓이 16π","a":["16π"]},{"l":"16π−24√3","a":["24√3"]}]} },

  { main:{"id":"OG29","cat":"기하","grade":"중3","q":"좌표평면 위의 두 점 A(1, 1), B(4, 5)가 정사각형 ABCD에서 이웃한 두 꼭짓점일 때, 정사각형의 한 변의 길이와 넓이를 구하고, 나머지 두 꼭짓점 C, D의 좌표를 말로 설명하며 구하시오.","a":"먼저 AB는 가로 3, 세로 4이므로 길이가 5이고 넓이는 25입니다. AB는 오른쪽으로 3, 위로 4만큼 가는 선분입니다. 이 선분에 수직이고 길이가 같은 선분은 왼쪽으로 4, 위로 3만큼 가거나, 오른쪽으로 4, 아래로 3만큼 가는 선분입니다. 첫째 경우는 A에서 왼쪽 4, 위 3만큼 간 D(−3, 4)와 B에서 같은 만큼 간 C(0, 8)이고, 둘째 경우는 A에서 오른쪽 4, 아래 3만큼 간 D(5, −2)와 B에서 같은 만큼 간 C(8, 2)입니다. 따라서 정사각형은 직선 AB를 기준으로 두 위치가 가능합니다.","kw":[{"l":"AB=5, 넓이 25","a":["5","25"]},{"l":"수직 방향으로 같은 길이","a":["수직"]},{"l":"D(−3,4), C(0,8)","a":["(−3, 4)","(0, 8)"]},{"l":"D(5,−2), C(8,2)","a":["(5, −2)","(8, 2)"]}]},
    follow:{"id":"OG29F","cat":"기하","grade":"중3","q":"두 경우의 정사각형의 중심의 좌표를 각각 구하시오.","a":"중심은 대각선 AC의 중점입니다. 첫째 경우는 A(1, 1), C(0, 8)의 중점인 (1/2, 9/2)입니다. 둘째 경우는 A(1, 1), C(8, 2)의 중점인 (9/2, 3/2)입니다.","kw":[{"l":"대각선의 중점","a":["중점"]},{"l":"(1/2, 9/2)","a":["9/2"]},{"l":"(9/2, 3/2)","a":["3/2"]}]} },

  { main:{"id":"OG30","cat":"기하","grade":"중3","q":"높이가 12이고 밑면의 반지름이 6인 원뿔이 있습니다. 꼭짓점에서 높이 4가 되는 곳을 밑면에 평행한 평면으로 자를 때, 위쪽에 생기는 작은 원뿔의 부피와 처음 원뿔의 부피의 비를 구하고 그 까닭을 말로 설명하시오.","a":"먼저 작은 원뿔과 큰 원뿔은 닮은 도형이고 닮음비는 높이의 비인 4:12=1:3입니다. 부피의 비는 닮음비의 세제곱이므로 1:27입니다. 확인하면 작은 원뿔의 밑면의 반지름은 2이고 부피는 (1/3)π×4×4=16π/3, 큰 원뿔의 부피는 (1/3)π×36×12=144π로 비가 1:27입니다.","kw":[{"l":"닮음비 1:3","a":["1:3"]},{"l":"부피비는 세제곱 1:27","a":["1:27","세제곱"]},{"l":"큰 원뿔 144π","a":["144π"]}]},
    follow:{"id":"OG30F","cat":"기하","grade":"중3","q":"잘라 내고 남은 아래쪽 입체의 부피를 구하시오.","a":"남은 부분의 부피는 큰 원뿔에서 작은 원뿔을 뺀 것이므로 144π−16π/3=416π/3입니다. 또는 큰 원뿔의 26/27이므로 144π×26/27=416π/3으로도 구할 수 있습니다.","kw":[{"l":"144π−16π/3","a":["16π/3"]},{"l":"416π/3","a":["416π/3"]}]} },

  { main:{"id":"OF21","cat":"함수","grade":"중2","q":"일차함수 y=ax+b의 그래프가 점 (2, 5)를 지나고 y절편이 −1입니다. a와 b의 값을 구하고 x절편을 말로 설명하며 구하시오.","a":"먼저 y절편이 −1이므로 b=−1입니다. 점 (2, 5)를 지나므로 5=2a−1이고 a=3입니다. 식은 y=3x−1입니다. x절편은 y=0일 때이므로 0=3x−1에서 x=1/3입니다.","kw":[{"l":"b=−1","a":["−1"]},{"l":"a=3","a":["a=3","3"]},{"l":"x절편 1/3","a":["1/3"]}]},
    follow:{"id":"OF21F","cat":"함수","grade":"중2","q":"이 직선과 평행하고 점 (1, −2)를 지나는 직선의 식을 구하시오.","a":"평행한 직선은 기울기가 같으므로 y=3x+c로 놓습니다. (1, −2)를 대입하면 −2=3+c이므로 c=−5이고 식은 y=3x−5입니다.","kw":[{"l":"기울기가 같음","a":["기울기"]},{"l":"y=3x−5","a":["3x−5"]}]} },

  { main:{"id":"OF22","cat":"함수","grade":"중3","q":"이차함수의 그래프가 세 점 (0, 3), (1, 0), (3, 0)을 지납니다. 이차함수의 식을 구하고 꼭짓점의 좌표를 말로 설명하며 구하시오.","a":"먼저 x축과 만나는 점이 x=1, x=3이므로 y=a(x−1)(x−3)으로 놓습니다. 점 (0, 3)을 대입하면 3=3a이므로 a=1이고 y=x²−4x+3입니다. 완전제곱식으로 고치면 y=(x−2)²−1이므로 꼭짓점은 (2, −1)입니다. 꼭짓점은 두 x절편의 한가운데 x=2에 있습니다.","kw":[{"l":"y=a(x−1)(x−3)","a":["a(x−1)(x−3)"]},{"l":"a=1","a":["a=1","1"]},{"l":"y=x²−4x+3","a":["x²−4x+3"]},{"l":"꼭짓점 (2,−1)","a":["(2, −1)"]}]},
    follow:{"id":"OF22F","cat":"함수","grade":"중3","q":"이 그래프와 직선 y=x−1이 만나는 점의 좌표를 구하시오.","a":"x²−4x+3=x−1에서 x²−5x+4=0이고 (x−1)(x−4)=0이므로 x=1 또는 4입니다. 교점은 (1, 0), (4, 3)입니다.","kw":[{"l":"x²−5x+4=0","a":["x²−5x+4"]},{"l":"(1,0), (4,3)","a":["(1, 0)","(4, 3)"]}]} },

  { main:{"id":"OF23","cat":"함수","grade":"중3","q":"이차함수 y=ax²의 그래프가 점 (2, −8)을 지납니다. a의 값을 구하고, 이 그래프 위의 x좌표가 −1인 점 A와 x좌표가 3인 점 B를 잇는 직선의 기울기를 말로 설명하며 구하시오.","a":"먼저 점 (2, −8)을 대입하면 −8=4a이므로 a=−2이고 y=−2x²입니다. 점 A의 y좌표는 −2×1=−2이므로 A(−1, −2)이고, 점 B의 y좌표는 −2×9=−18이므로 B(3, −18)입니다. 기울기는 (−18−(−2))/(3−(−1))=−16/4=−4입니다.","kw":[{"l":"a=−2","a":["−2"]},{"l":"A(−1,−2), B(3,−18)","a":["(−1, −2)","(3, −18)"]},{"l":"기울기 −4","a":["−4"]}]},
    follow:{"id":"OF23F","cat":"함수","grade":"중3","q":"직선 AB의 식과 y절편을 구하시오.","a":"기울기가 −4이고 점 A(−1, −2)를 지나므로 y+2=−4(x+1)이고 y=−4x−6입니다. y절편은 −6입니다.","kw":[{"l":"y=−4x−6","a":["−4x−6"]},{"l":"y절편 −6","a":["−6"]}]} },

  { main:{"id":"OF24","cat":"함수","grade":"중3","q":"이차함수 y=x²−2x+3의 그래프를 x축의 방향으로 2만큼, y축의 방향으로 −1만큼 평행이동한 그래프의 식과 꼭짓점의 좌표를 말로 설명하며 구하시오.","a":"먼저 처음 식을 고치면 y=(x−1)²+2이고 꼭짓점은 (1, 2)입니다. x축의 방향으로 2만큼 이동하면 x 대신 x−2를 넣어 y=(x−3)²+2이고, y축의 방향으로 −1만큼 이동하면 y=(x−3)²+1입니다. 따라서 꼭짓점은 (3, 1)이고 이는 처음 꼭짓점 (1, 2)를 같은 만큼 옮긴 점입니다.","kw":[{"l":"처음 꼭짓점 (1,2)","a":["(1, 2)"]},{"l":"x 대신 x−2","a":["x−2"]},{"l":"y=(x−3)²+1","a":["(x−3)²+1"]},{"l":"꼭짓점 (3,1)","a":["(3, 1)"]}]},

  { main:{"id":"OF26","cat":"함수","grade":"중3","q":"m이 실수일 때 이차함수 y=x²−2mx+m²+m−1의 그래프의 꼭짓점의 좌표를 m으로 나타내고, m이 변할 때 꼭짓점이 어떤 도형 위를 움직이는지 말로 설명하시오.","a":"먼저 완전제곱식으로 고치면 y=(x−m)²+m−1이므로 꼭짓점은 (m, m−1)입니다. 꼭짓점의 x좌표를 x, y좌표를 y라 하면 x=m, y=m−1이므로 y=x−1이 성립합니다. 따라서 m이 변하면 꼭짓점은 직선 y=x−1 위를 움직입니다.","kw":[{"l":"완전제곱식 (x−m)²+m−1","a":["(x−m)²"]},{"l":"꼭짓점 (m, m−1)","a":["(m, m−1)"]},{"l":"직선 y=x−1 위","a":["y=x−1"]}]},

/* ===================== 로그인 설정 =====================
   Code.gs는 건드리지 않고 비밀번호를 로컬에서만 관리해요.
   강사용 대시보드에서 비밀번호를 바꾸면 localStorage에 저장돼서
   같은 기기에서는 유지되고, 학생들은 선생님이 알려준 번호를 입력해요. */
let loginConfigCache = null;
async function getLoginConfig(){
  if(loginConfigCache) return loginConfigCache;
  let password = DEFAULT_STUDENT_PW, loginEnabled = true;
  try{
    const cp = localStorage.getItem('login_pw_'+APP_KEY); if(cp) password = cp;
    const ce = localStorage.getItem('login_en_'+APP_KEY); if(ce) loginEnabled = (ce==='Y');
  }catch(e){}
  loginConfigCache = {password, loginEnabled};
  return loginConfigCache;
}
function saveLoginConfig(password, loginEnabled){
  loginConfigCache = {password, loginEnabled};
  try{
    localStorage.setItem('login_pw_'+APP_KEY, password);
    localStorage.setItem('login_en_'+APP_KEY, loginEnabled?'Y':'N');
  }catch(e){}
}

/* ===================== 서버 이어풀기 스냅샷 ===================== */
let serverResumeCache = {normal: null, wrong: null};
function resumeGroup(mode){ return mode==='wrong'||mode==='cumwrong' ? 'wrong' : 'normal'; }
function resumeKey(name, mode){ return 'resume_'+APP_KEY+'_'+safeName(name)+'_'+resumeGroup(mode); }
function safeName(n){ return (n||'').replace(/[^a-zA-Z0-9가-힣]/g,'_').slice(0,40); }
function pickNewerSnapshot(a, b){
  if(a && b) return (b.ts||0) > (a.ts||0) ? b : a;
  return a || b || null;
}

// 스킬 방식: 로그인 후 기존 Code.gs(?name=이름)로 시트에서 이 학생 전체 기록 가져와서
// "진행중" 세션의 이어풀기 스냅샷과 오답 목록을 미리 캐싱
async function fetchServerResumeSnapshots(name){
  const empty = {normal: null, wrong: null};
  if(!SHEET_WEBHOOK_URL || !name) return empty;
  try{
    const rows = await fetchStudentFromSheet(name);
    if(!rows || !rows.length) return empty;
    // 일반 모드와 오답 모드 이어풀기 스냅샷 분리
    const normalRows = rows.filter(r=>!(r.modeLabel||'').includes('오답'));
    const wrongRows = rows.filter(r=>(r.modeLabel||'').includes('오답'));
    const normalSnap = buildServerResumeFromRows(normalRows) || buildApproxResumeFromRows(normalRows);
    const wrongSnap = buildServerResumeFromRows(wrongRows) || buildApproxResumeFromRows(wrongRows);
    return {normal: normalSnap, wrong: wrongSnap};
  }catch(e){ return empty; }
}
async function fetchStudentSessions(name){
  // 기존 Code.gs: ?name=이름 → 배열 반환
  if(!SHEET_WEBHOOK_URL || !name) return {ok:false, sessions:[]};
  try{
    const rows = await fetchStudentFromSheet(name);
    return {ok:true, sessions: rows};
  }catch(e){ return {ok:false, sessions:[]}; }
}

/* ===================== 로컬 저장소 (학생별) ===================== */
function studentKey(name){ return APP_KEY+'_student_'+encodeURIComponent((name||'').trim()); }
function getStudent(name){
  try{
    const raw=localStorage.getItem(studentKey(name));
    if(raw){
      const d=JSON.parse(raw);
      if(!d.wrong)d.wrong={};
      if(!d.examLogs)d.examLogs=[];
      if(!d.everWrong){
        // 기존 데이터 마이그레이션: 누적 오답 기록이 없던 학생은 현재 오답을 초기값으로 사용
        d.everWrong = Object.assign({}, d.wrong);
      }
      return d;
    }
  }catch(e){}
  return {wrong:{}, everWrong:{}, examLogs:[]};
}
function setStudent(name, data){
  try{ localStorage.setItem(studentKey(name), JSON.stringify(data)); return true; }catch(e){ return false; }
}
function getAllStudents(){

// 두 문자열 간 편집거리(레벤슈타인 거리) 계산 - 음성인식 오인식 허용 매칭에 사용
function editDistance(a, b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
// 키워드가 텍스트 안에 "충분히 비슷하게" 포함되어 있는지 확인
// 음절 수의 30% 이내 오차(삽입/삭제/대체)이면 인정
function fuzzyIncludes(text, keyword){
  if(!keyword || keyword.length===0) return false;
  if(text.includes(keyword)) return true;
  if(keyword.length < 2) return text.includes(keyword);
  const maxDist = Math.max(1, Math.floor(keyword.length * 0.3));
  // 키워드 길이 윈도우로 슬라이딩하며 편집거리 검사
  for(let i=0;i<=text.length-keyword.length+maxDist;i++){
    const window = text.slice(Math.max(0,i), Math.min(text.length, i+keyword.length+maxDist));
    if(editDistance(window, keyword) <= maxDist) return true;
  }
  return false;
}
function fixSoundErrors(text){
  let t = text || '';
  SOUND_FIXES.forEach(([pat, rep])=>{ t = t.replace(pat, rep); });
  return t;
}

// 조사/어미 제거 후 어간만 남기는 가벼운 정규화
function normDeep(s){
  return (s||'')
    .replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g,' ') // 특수문자→공백
    .replace(/\s+/g,'')
    .toLowerCase();
}

function scoreAnswer(q, text){
  if(!text || text.trim().length < 2){
    return {matched:[], missed:q.kw, score:0, aiGraded:false};
  }
  // 음성인식 오류 교정 후 정규화
  const fixed = fixSoundErrors(text);
  const n = normDeep(fixed);
  const nOrig = norm(text); // 원본도 함께 체크

  const matched=[], missed=[];
  q.kw.forEach(k=>{
    const hit = k.a.some(alt=>{
      const na = normDeep(fixSoundErrors(alt));
      const na2 = norm(alt);
      // 1. 완전 포함
      if(n.includes(na) || nOrig.includes(na2)) return true;
      // 2. 퍼지 매칭: 편집거리 기반으로 비슷하면 인정 (음성인식 오인식 대응)
      if(na.length >= 2 && fuzzyIncludes(n, na)) return true;
      // 3. 부분 매칭: alt 글자의 80% 이상 순서대로 포함되면 인정
      if(na.length >= 2){
        let pos=0, matched2=0;
        for(let ch of na){ const idx=n.indexOf(ch,pos); if(idx>=0){matched2++;pos=idx+1;} }
        if(matched2/na.length >= 0.8) return true;
      }
      return false;
    });
    if(hit) matched.push(k); else missed.push(k);
  });

  const total = q.kw.length || 1;
  const ratio = matched.length / total;

  // 기본 점수 50점 + 키워드 비율로 50점 추가 (답변이 있는 경우)
  // 키워드 1개만 맞아도 의미 있는 점수, 전체 맞으면 100점 가능
  let score;
  const hasAnswer = text.trim().length >= 4;
  if(!hasAnswer){
    score = 0;
  } else if(total === 0){
    score = 70; // 키워드 없는 문항은 답변 있으면 기본
  } else {
    // 기본 50 + 키워드 비율 * 50
    score = Math.round(50 + ratio * 50);
    // 키워드 전부 맞으면 100점
    if(ratio >= 1) score = 100;
    // 키워드 절반 이상이면 최소 75점 보장
    if(ratio >= 0.5 && score < 75) score = 75;
    // 키워드 1개 이상 맞으면 최소 60점 보장
    if(matched.length >= 1 && score < 60) score = 60;
  }
  score = Math.max(0, Math.min(100, score));
  return {matched, missed, score, aiGraded:false};
}
/* 최종 점수를 한 번 더 후하게 보정. 80점 정도 받은 답변은 100점에 가깝게,
   낮은 점수는 상대적으로 덜 보정되어 변별력은 유지되도록 함. */
function boostScore(raw){
  const boosted = Math.round(raw * 1.25);
  return Math.max(0, Math.min(100, boosted));
}
/* AI(Claude)로 의미 기반 채점을 시도. 실패하면 null을 반환해 키워드 채점으로 대체함.
   음성인식 결과는 표현이 모범답안과 달라도 의미가 같으면 인정해야 하므로,
   단순 문자열 포함 여부가 아니라 모델이 각 핵심 개념의 '의미상 포함 여부'를 판단하게 함.
   중학생 구술면접 상황이므로 채점은 관대하게: 핵심 수학 개념이 맞으면 부수적인 세부 표현
   (예: 위치, 정확한 수치, 부연 설명 등)을 빠뜨려도 감점하지 않음. */
async function aiGradeAnswer(q, text){
  if(!text || norm(text).length < 4) return null;
  const labels = q.kw.map(k=>k.l);
  const sys = `너는 중학교 수학 구술면접을 채점하는 친절하고 관대한 채점관이야. 학생의 음성인식 답변(오타나 띄어쓰기 오류가 있을 수 있음)을 모범답안과 비교해서 채점해.

채점 원칙 (중요, 반드시 지킬 것):
1. 표현이 달라도 의미가 같거나 같은 내용을 자기 말로 풀어서 설명했으면 해당 핵심 개념을 "포함됨"으로 인정해. 단어가 똑같이 나왔는지가 아니라 수학적으로 핵심 의미가 맞는지로 판단해.
2. 중학생 수준의 구술 답변임을 감안해서 관대하게 채점해. 핵심 개념 라벨이 "OO는 XX이다"처럼 여러 요소를 담고 있어도, 학생이 그 개념의 핵심 아이디어만 정확히 말했다면 부수적인 수식어, 위치 표현(예: "지하 깊은 곳", "표면 부근" 같은 세부 조건), 정확한 수치나 예시를 굳이 언급하지 않아도 그 개념은 포함된 것으로 인정해.
3. 학생 답변에 수학적으로 명백히 틀린 내용이 없다면, 사소한 설명 누락만으로 감점하지 마. 오직 핵심 개념 자체를 언급하지 않았거나, 수학적으로 틀리게 설명한 경우에만 그 개념을 "포함되지 않음"으로 처리해.
4. 오타, 띄어쓰기 오류, 음성인식 과정에서 생긴 비슷한 발음의 단어 오변환(예: "광합성"이 "광압성"으로 잘못 인식된 경우 등)은 절대 감점 사유로 삼지 마. 문맥상 학생이 어떤 단어나 개념을 말하려 한 것인지 명확히 유추할 수 있다면, 정확한 표기가 아니어도 원래 의도한 단어를 말한 것으로 인정하고 채점해.
5. 점수는 후하게 매겨. 핵심 개념을 대부분(예: 전체의 80% 이상) 의미상 정확히 짚었다면 90~100점을 줘. 몇 가지 핵심 개념만 빠졌다면 70~89점, 절반 정도만 맞았다면 45~69점, 핵심을 거의 말하지 못했거나 답변이 없으면 그 이하로 줘. 완벽하게 토씨 하나까지 똑같아야만 100점을 주는 방식이 아니라, 수학적으로 충분히 이해하고 설명했다고 판단되면 100점도 흔쾌히 줘.

반드시 아래 JSON 형식으로만 답해. 다른 텍스트나 코드블록 표시(백틱) 없이 순수 JSON만 출력해.
{"matched":["핵심개념 라벨 중 학생이 의미상 포함한 것들"],"missed":["포함하지 않은 것들"],"score":0~100 사이 정수,"feedback":"학생을 격려하는 한두 문장의 한국어 피드백"}
matched와 missed의 문자열은 반드시 주어진 핵심개념 라벨 목록의 것을 그대로 사용해야 하고, 모든 라벨이 둘 중 하나에 정확히 한 번씩만 들어가야 해.`;
  const userMsg = `[질문]\n${q.q}\n\n[모범답안]\n${q.a}\n\n[핵심개념 라벨 목록]\n${JSON.stringify(labels)}\n\n[학생 답변]\n${text}`;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: sys,
        messages:[{role:'user', content:userMsg}]
      })
    });
    if(!res.ok) return null;
    const data = await res.json();
    const outText = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    const clean = outText.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!parsed || typeof parsed.score!=='number') return null;
    const matchedLabels = Array.isArray(parsed.matched)? parsed.matched : [];
    const missedLabelsRaw = Array.isArray(parsed.missed)? parsed.missed : [];
    const matched = q.kw.filter(k=>matchedLabels.includes(k.l));
    const missed = q.kw.filter(k=>!matchedLabels.includes(k.l));
    let score = Math.round(parsed.score);
    if(score<0) score=0; if(score>100) score=100;
    return {matched, missed, score, feedback: typeof parsed.feedback==='string'? parsed.feedback : null, aiGraded:true};
  }catch(e){
    return null;
  }
}

function tierOf(score){
  if(score>=90) return {cls:'tier-perfect', label:'완벽해요! 핵심 개념을 정확히 설명했어요.'};
  if(score>=70) return {cls:'tier-good', label:'우수해요! 핵심은 잘 짚었어요. 몇 가지만 보완해봐요.'};
  if(score>=45) return {cls:'tier-mid', label:'조금 더 다듬어볼까요? 절반 정도의 핵심 개념이 빠졌어요.'};
  return {cls:'tier-low', label:'개념을 다시 학습해보는 게 좋겠어요. 모범답안을 참고해서 다시 연습해봐요.'};
}
function ringStyle(score){
  const color = score>=90?'#c9a227':score>=70?'#2f7d5b':score>=45?'#e0862b':'#b3432b';
  return `background:conic-gradient(${color} ${score*3.6}deg, #e9e4d5 0deg); `;

    if(el){ el.textContent=msg; }

/* ===================== 음성 인식 ===================== */
function setupRecognition(){
  if(!SR) return;
  recognition = new SR();
  recognition.lang='ko-KR';
  // continuous=false: 한 번 누르면 말이 끝날 때(또는 침묵)까지 쭉 듣고 자동으로 멈춤.
  // (continuous=true는 모바일에서 내부적으로 재시작되며 텍스트가 중복 누적되는 문제가 있었고,
  //  자동 재시작 방식은 재시작 자체가 실패해 아예 인식이 안 되는 문제가 있어 가장 단순하고 안정적인 방식으로 되돌림)
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.onresult=(e)=>{
    let sessionFinal='';
    let interim='';
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) sessionFinal += t;
      else interim += t;
    }
    lastBurstFinal = sessionFinal;
    state.answerText = (recFinalBase + sessionFinal + interim).trim();
    updateAnswerBoxLive();
  };
  recognition.onerror=(e)=>{
    let msg='음성 인식 중 오류가 발생했어요.';
    let fatal=false;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      msg='마이크 권한이 필요해요.\n① 브라우저 주소창의 자물쇠 아이콘에서 마이크 허용 여부를 확인하세요.\n② 그래도 안 되면 이 화면이 대화창 안 미리보기일 수 있어요 — 아티팩트를 게시/공유한 링크를 새 탭에서 열거나 HTML을 다운로드해 직접 열어보세요.';
      fatal=true;
    } else if(e.error==='no-speech'){
      msg='음성이 감지되지 않았어요. 계속 듣고 있어요.';
    } else if(e.error==='network'){
      msg='네트워크 오류로 음성 인식에 실패했어요. 인터넷 연결을 확인해주세요.';
      fatal=true;
    } else if(e.error==='aborted'){
      return; // 사용자가 직접 멈춰서 발생하는 정상적인 중단
    }
    if(fatal) micWanted=false;
    const st=document.getElementById('recStatus'); if(st){st.textContent=msg; st.classList.remove('on'); st.classList.add('err');}
  };
  recognition.onend=()=>{
    if(lastBurstFinal){
      recFinalBase = (recFinalBase + lastBurstFinal + ' ').replace(/\s+/g,' ');
      state.answerText = recFinalBase.trim();
      updateAnswerBoxLive();
    }
    lastBurstFinal='';
    if(micWanted){
      // 사용자가 아직 마이크를 끄지 않았으면, 짧은 텀을 두고 자동으로 다시 듣기 시작
      // (재시작을 너무 빨리 하면 브라우저가 오류를 내는 경우가 있어 약간의 지연을 둠)
      isRecording=true;
      renderQuizControls();
      if(recRestartTimer) clearTimeout(recRestartTimer);
      recRestartTimer = setTimeout(()=>{
        if(!micWanted) return;
        try{ recognition.start(); }
        catch(err){ isRecording=false; micWanted=false; renderQuizControls(); }
      }, 350);
    } else {
      isRecording=false;
      renderQuizControls();
    }
  };
}
function toggleRecording(){
  if(!SR) return;
  if(!recognition) setupRecognition();
  if(isRecording || micWanted){
    micWanted=false;
    if(recRestartTimer){ clearTimeout(recRestartTimer); recRestartTimer=null; }
    try{ recognition.stop(); }catch(e){}
    isRecording=false;
  } else {
    stopAnswerTimer();
    recFinalBase = state.answerText ? state.answerText+' ' : '';
    lastBurstFinal='';
    micWanted=true;
    try{ recognition.start(); isRecording=true; }catch(e){ micWanted=false; }
  }
  renderQuizControls();
}

/* ===================== 질문 음성(TTS) + 답변 준비 카운트다운 ===================== */
let lastTTSQuestionId = null;
let prepTimerId = null;
let ttsVoicesCache = null;
function pickKoreanVoice(){
  if(!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  ttsVoicesCache = voices;
  const koVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
  if(!koVoices.length) return null;
  // 남성으로 추정되는 이름 패턴 우선 탐색 (플랫폼마다 표기가 달라 폭넓게 매칭)
  const maleNamePattern = /male|man|injoon|인준|민수|minsu|준호|junho|철수|형준|승우|성진/i;
  const femaleNamePattern = /female|woman|heami|해ami|유나|yuna|sunhi|선희|지민|jimin/i;
  let pick = koVoices.find(v=>maleNamePattern.test(v.name));
  if(!pick) pick = koVoices.find(v=>!femaleNamePattern.test(v.name) && koVoices.length>1) || null;
  return pick || koVoices[0];
}
function isIOSDevice(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}
function speakQuestion(text){
  const ttsTargetId = lastTTSQuestionId; // 이 발화가 어떤 문제를 위한 것인지 기억해둠
  if(!window.speechSynthesis){ startPrepCountdown(); return; } // TTS 미지원이면 바로 카운트다운으로
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    // 아이폰(iOS) 음성 엔진은 피치를 조금만 낮춰도 소리가 심하게 왜곡되는 경우가 많아
    // 아예 기본 피치(자연스러운 목소리)를 그대로 사용
    if(isIOSDevice()){
      utter.pitch = 1.0;
      utter.rate = 0.95;
    } else {
      utter.pitch = 0.68; // 낮은 피치로 딱딱하고 무게감 있는 남성 아나운서 톤
      utter.rate = 0.92;
    }
    utter.volume = 1;
    const voice = pickKoreanVoice();
    if(voice) utter.voice = voice;
    utter.onstart = ()=>{ const el=document.getElementById('qtext'); if(el) el.classList.add('reading'); };
    const finish = ()=>{
      const el=document.getElementById('qtext'); if(el) el.classList.remove('reading');
      // 이 음성 재생이 끝나기 전에 이미 다음 문제로 넘어갔거나 면접이 끝났다면
      // (=lastTTSQuestionId가 바뀌었거나 더 이상 quiz 화면이 아니라면) 뒤늦게 도착한
      // 이 종료 이벤트로 불필요한 새 카운트다운(비프음)을 시작하지 않음
      if(lastTTSQuestionId !== ttsTargetId || screen !== 'quiz') return;
      startPrepCountdown();
    };
    utter.onend = finish;
    utter.onerror = finish;
    window.speechSynthesis.speak(utter);
  }catch(e){ startPrepCountdown(); }
}
function playTone(freq, duration, vol){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type='sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime+0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
    osc.start(); osc.stop(ctx.currentTime+duration+0.05);
  }catch(e){}
}
function playTick(){ playTone(1100, 0.09, 0.14); } // 카운트다운 매 초마다 나는 짧은 비프음
function playBeep(){ playTone(880, 0.35, 0.28); } // 카운트다운 종료(0초) 시 울리는 신호음
function startPrepCountdown(){
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  state._prepActive = true;
  state._prepTimeLeft = 10;
  render();
  prepTimerId = setInterval(()=>{
    state._prepTimeLeft -= 1;
    const el = document.getElementById('prepCountdownNum');
    if(el) el.textContent = state._prepTimeLeft+'초';
    if(state._prepTimeLeft<=0){
      clearInterval(prepTimerId); prepTimerId=null;
      finishPrepCountdown(true);
    } else {
      playTick();
    }
  },1000);
}
function finishPrepCountdown(autoStart){
  state._prepActive = false;
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  render();
  if(autoStart){
    playBeep();
    if(SR && !isRecording){ try{ toggleRecording(); }catch(e){} }
  }
}
function cancelQuestionAudio(){
  if(window.speechSynthesis) try{ window.speechSynthesis.cancel(); }catch(e){}
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  state._prepActive = false;
}

  <div class="card" style="border:2px solid #7a1f2b;">

  <div class="card">

    <div class="mode-card ${state.mode==='all'?'active':''}" data-mode="all">

    <label class="field-label">🔢 문항 수</label>
    <div class="opt-row">${countChips}</div>

function renderQuiz(){
  const q = state.queue[state.idx];
  const total = state.queue.length;
  const pct = Math.round((state.idx)/total*100);
  const micSupported = !!SR;
  const prepHtml = state._prepActive ? `
  <div class="card" style="text-align:center;border:2px solid var(--gold);">
    <div style="font-size:13.5px;color:var(--sub);">🎙️ 답변을 준비할 시간이에요</div>
    <div class="prep-num" id="prepCountdownNum">${state._prepTimeLeft}초</div>
    <div class="row2">
      <button class="btn btn-primary" id="prepReadyBtn">🎤 준비 완료! 바로 말하기</button>
      <button class="btn btn-outline" id="prepExtendBtn">⏱️ 생각시간 +5초</button>
    </div>
  </div>` : '';
  return `
  <div class="progressbar"><div class="progressbar-inner" style="width:${pct}%"></div></div>
  <div class="meta-row"><span class="cat-tag">${CAT_ICON[q.cat]} ${q.cat}</span><span>${state.idx+1} / ${total} 문항</span><span class="name-tag">${escapeHtml(state.name)}</span></div>
  <div class="answer-timer" id="answerTimer">⏱ 답변 시작까지 ${ANSWER_START_LIMIT}초</div>
  <div class="qcard">
    <div class="qtext" id="qtext">${q.q}</div>
    <button class="btn btn-outline" id="replayTTSBtn" style="margin-top:10px;">🔊 문제 다시 듣기</button>
  </div>
  ${prepHtml}
  <div class="infobox" style="margin-bottom:14px;">🎤 답변 칸에 자동으로 커서가 가 있어요. 키보드가 뜨면 위쪽의 <b>마이크 아이콘</b>을 눌러 말하면 텍스트로 입력돼요. (키보드가 안 보이면 답변 칸을 한 번 탭해주세요)</div>
  <div class="answer-label"><span>내 답변</span><span class="char-count" id="charCount">${state.answerText.length}자</span></div>
  ${isMobileDevice()? `
  <button class="btn btn-primary" id="keyboardMicBtn" style="margin-bottom:4px;">키보드 마이크 버튼 누르기(구글음성입력)</button>
  <p class="small-note kb-mic-hint" id="kbMicHint" style="display:none;margin:0 0 10px;text-align:center;">구글음성인식이 더 잘 입력됩니다</p>
  ` : ''}
  <textarea class="answer-box" id="answerBox" placeholder="답변 칸을 탭한 뒤 키보드의 마이크 아이콘으로 말하거나, 직접 입력하세요...">${state.answerText}</textarea>
  ${micSupported? `
  <div class="rec-zone" style="margin-top:14px;">
    <p class="small-note" style="margin-top:0;margin-bottom:10px;">또는 앱 자체 음성인식을 시도해볼 수 있어요 (키보드 마이크보다 정확도가 낮을 수 있어요)</p>
    <button class="mic-btn" id="micBtn">🎙️</button>
    <div class="rec-status" id="recStatus">마이크 버튼을 눌러 시도해보기</div>
    <div class="waveform hidden" id="waveform"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  ` : ``}
  <div class="row2" style="margin-top:16px;">
    <button class="btn btn-ghost" id="clearBtn">지우기</button>
    <button class="btn btn-primary" id="submitBtn">답변 제출하고 채점받기</button>
  </div>
  <span class="giveup" id="skipBtn">이 문제 건너뛰기</span>
  <span class="giveup" id="pauseBtn">잠시 멈추고 나중에 이어풀기</span>
  ${state.records.length>0? `<div style="margin-top:10px;"><button class="btn btn-outline" id="finishEarlyBtn">✅ 여기까지 풀고 점수낼래요 (${state.records.length}문항)</button></div>` : ''}
  `;
}

function renderFeedback(){
  const fb = state.feedback;
  const q = state.queue[state.idx];
  const tier = tierOf(fb.score);
  const kwOk = fb.matched.map(k=>`<span class="kw-chip ok">✅ ${k.l}</span>`).join('');
  const kwMiss = fb.missed.map(k=>`<span class="kw-chip miss">➕ ${k.l}</span>`).join('');
  const isLast = state.idx === state.queue.length-1;
  const followUpHtml = fb.followUpQuestion ? `
    <div class="card" style="border:2px solid var(--gold);margin-top:14px;">
      <h3 class="card-title" style="font-size:15px;">🔁 꼬리질문</h3>
      <div class="qtext" style="font-size:15.5px;">${escapeHtml(fb.followUpQuestion)}</div>
      ${state._followUpAnswered? `
        <div class="ans-box mine" style="margin-top:10px;"><b>내 답변</b>${escapeHtml(state._followUpAnswerText)||'(답변 없음)'}</div>
        ${state._followUpComment? `<div class="infobox">🤖 ${escapeHtml(state._followUpComment)}</div>` : ''}
      ` : `
        <textarea class="answer-box" id="followUpBox" placeholder="꼬리질문에 답해보세요 (건너뛰어도 괜찮아요)" style="margin-top:10px;">${state._followUpAnswerText||''}</textarea>
        <button class="btn btn-primary" id="followUpSubmitBtn" style="margin-top:10px;">꼬리질문 답변 제출</button>
      `}
    </div>
  ` : '';
  return `
  <div class="card">
    ${fb.timedOut? `<div class="warnbox">⏱ 60초 안에 답변을 시작하지 않아 자동으로 제출됐어요.</div>` : ''}
    <div class="score-wrap">
      <div class="score-ring" style="${ringStyle(fb.score)}">
        <div style="background:#fff;width:118px;height:118px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div class="score-num" style="color:${fb.score>=90?'#b8902f':fb.score>=70?'#2f7d5b':fb.score>=45?'#e0862b':'#b3432b'}">${fb.score}</div>
          <div class="score-max">/ 100점</div>
        </div>
      </div>
    </div>
    <div class="tier-label ${tier.cls}">${tier.label}</div>
    ${fb.passMsg? `<div class="infobox" style="text-align:center;font-weight:700;">${escapeHtml(fb.passMsg)}</div>` : ''}
    ${fb.feedback? `<div class="infobox">🤖 <b>AI 채점 코멘트</b><br>${escapeHtml(fb.feedback)}</div>` : ''}
    ${fb.aiGraded===false? `<p class="small-note">📝 키워드 기반 채점으로 처리됐어요. 핵심 개념 위주로 채점했어요.</p>` : ''}
    <div class="kw-section">
      ${kwOk? `<div class="kw-title">✅ 답변에 포함된 핵심 개념</div><div class="kw-grid">${kwOk}</div>`:''}
      ${kwMiss? `<div class="kw-title">➕ 놓친 핵심 개념</div><div class="kw-grid">${kwMiss}</div>`:''}
    </div>
    <div class="ans-box mine"><b>내 답변</b>${escapeHtml(state.answerText)||'(답변 없음)'}</div>
    <div class="ans-box model"><b>모범 답안</b>${q.a}</div>
  </div>
  ${followUpHtml}
  <div class="card">
    <button class="btn btn-primary" id="nextBtn" style="margin-top:6px;">${isLast? '결과 보기' : '다음 질문'}</button>
    <button class="btn btn-outline" id="retryAnswerBtn" style="margin-top:10px;">이 문제 다시 답하기</button>
    ${!isLast? `<div style="margin-top:10px;"><span class="giveup" id="finishEarlyBtn2">✅ 여기까지 풀고 점수낼래요 (${state.records.length}문항)</span></div>` : ''}
  </div>
  `;
}

function renderResult(){
  const total = state.records.length;
  const avg = total? Math.round(state.records.reduce((s,r)=>s+r.score,0)/total) : 0;
  const items = state.records.map(r=>{
    const color = r.score>=90?'#b8902f':r.score>=70?'#2f7d5b':r.score>=45?'#e0862b':'#b3432b';
    return `<div class="result-item"><div class="ri-q">${CAT_ICON[r.cat]} ${r.q}</div><div class="ri-score" style="color:${color}">${r.score}점</div></div>`;
  }).join('');
  const deviceBtn = isMobileDevice()
    ? `<button class="btn btn-gold" id="mobileSubmitBtn" style="margin-top:12px;">📤 선생님께 오답 제출하기</button>`
    : `<button class="btn btn-gold" id="printBtn" style="margin-top:12px;">🖨️ A4로 바로 인쇄</button>`;
  return `
  <div class="card">
    <h2 class="card-title" style="text-align:center;">${escapeHtml(state.name)}님의 면접 결과</h2>
    <div class="avg-big">${avg}<span style="font-size:20px;color:var(--sub);">점</span></div>
    <div class="avg-sub">${total}문항 평균 점수 · ${state.mode==='wrong'?'오답 모드':state.mode==='cumwrong'?'누적 오답 모드':state.mode==='all'?'전체 모드':state.mode==='advanced'?'응용 모드(상)':state.mode==='random'?'랜덤 모드':state.mode==='top'?'최상위문제':state.mode==='oral'?'구술 풀이':state.mode==='myquestions'?'내 자소서 맞춤 질문':'부분 학습'}</div>
    <div class="result-list">${items}</div>
    <div class="row2" style="margin-top:16px;">
      <button class="btn btn-outline" id="wrongNoteBtn">오답노트 보기</button>
      <button class="btn btn-primary" id="retryBtn">다시 도전하기</button>
    </div>
    <div class="row2" style="margin-top:12px;">
      <button class="btn btn-outline" id="resultPrintBtn">🖨️ 인쇄하기 (전체 누적)</button>
      <button class="btn btn-gold" id="resultPdfBtn">💾 PDF로 저장 (전체 누적)</button>
    </div>
    ${deviceBtn}
    <div class="small-note" id="sheetSendStatus" style="margin-top:8px;text-align:center;">📤 선생님께 결과 전송 중...</div>
    <button class="btn btn-ghost" id="backHomeBtn" style="margin-top:10px;">처음으로</button>
  </div>
  `;
}

    return `<div class="card"><h2 class="card-title">내 기록</h2><p class="small-note">먼저 이름을 입력해주세요.</p>
