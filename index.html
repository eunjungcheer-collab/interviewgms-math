<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>수학 구술면접 마스터 · GMS학원 이은정 강사</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b0810">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#5c1420; --navy2:#2b0810; --gold:#b8902f; --gold-light:#e9d9a8;
  --paper:#f6f1e6; --paper2:#eef1f6; --card:#ffffff; --ink:#1b2230; --sub:#6b7280;
  --good:#2f7d5b; --good-bg:#e7f3ec; --bad:#b3432b; --bad-bg:#fbeae5; --line:#e6ddc8;
  --rec:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 400px at 50% -10%, #7a1f2b 0%, transparent 60%),
    linear-gradient(180deg,var(--navy2) 0%, var(--navy) 220px, var(--paper) 220px, var(--paper2) 100%);
  min-height:100vh;padding-bottom:50px;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px;}
.hero{text-align:center;padding:34px 10px 26px;color:#fff;}
.hero .eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold-light);font-weight:700;text-transform:uppercase;}
.hero h1{font-family:'Noto Serif KR',serif;font-size:26px;margin:8px 0 8px;font-weight:900;letter-spacing:-.5px;}
.hero p{font-size:13px;color:#e0c6c9;margin:0;}
.mic-badge{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a2d38,var(--navy2));
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;}
.card{background:var(--card);border-radius:18px;box-shadow:0 14px 34px rgba(50,10,16,.16);padding:22px 20px;margin-bottom:16px;border:1px solid var(--line);}
h2.card-title{font-family:'Noto Serif KR',serif;font-size:19px;margin:0 0 4px;color:var(--navy);font-weight:700;}
.card-sub{font-size:12.5px;color:var(--sub);margin:0 0 14px;}
label.field-label{display:block;font-size:13.5px;font-weight:700;margin:16px 0 8px;color:var(--ink);}
input[type=text],input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:#fffdf8;font-family:inherit;box-sizing:border-box;}
.row2{min-width:0;}
.row2 input[type=text],.row2 input[type=password]{min-width:0;}
input[type=text]:focus,input[type=password]:focus{outline:2px solid var(--navy);}
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chip{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fffdf8;transition:.15s;}
.chip b{display:block;font-size:14px;}
.chip small{color:var(--sub);font-size:11px;}
.chip.active{border-color:var(--gold);background:#fbf3df;box-shadow:0 0 0 2px rgba(184,144,47,.18) inset;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-chip{flex:1;min-width:64px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;cursor:pointer;background:#fffdf8;color:var(--sub);}
.opt-chip.active{border-color:var(--navy);background:#eef1f6;color:var(--navy);}
.toggle-row{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:13.5px;}
.toggle-row input{width:18px;height:18px;}
.mode-card{border:1.6px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#fffdf8;}
.mode-card.active{border-color:var(--navy);background:#eef1f6;box-shadow:0 0 0 2px rgba(27,42,74,.12) inset;}
.mode-card.disabled{opacity:.5;cursor:not-allowed;}
.mode-card .mt{font-weight:800;font-size:15px;}
.mode-card .md{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5;}
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;font-weight:800;font-size:15.5px;border:none;cursor:pointer;box-sizing:border-box;}
.btn-icon-del{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:8px;opacity:0.7;}
.btn-icon-del:hover{opacity:1;background:#fbeaea;}
.btn-primary{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 10px 20px rgba(60,10,16,.28);}
.btn-gold{background:linear-gradient(90deg,#c9a53c,var(--gold));color:#3a2c05;box-shadow:0 8px 16px rgba(184,144,47,.3);}
.btn-outline{background:#fff;border:1.6px solid var(--navy);color:var(--navy);}
.btn-ghost{background:#f0eee6;color:var(--ink);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.row2{display:flex;gap:10px;margin-top:10px;}
.row2 .btn{flex:1;}
.small-note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.6;}
.hidden{display:none !important;}

.progressbar{height:6px;border-radius:4px;background:#e2ddcb;overflow:hidden;margin-bottom:10px;}
.progressbar-inner{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));transition:width .3s ease;}
.meta-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:14px;}
.answer-timer{display:inline-block;background:#eef1f6;color:var(--navy);font-weight:800;font-size:13px;padding:8px 14px;border-radius:20px;margin-bottom:14px;}
.answer-timer.urgent{background:var(--bad-bg);color:var(--bad);}
.cat-tag{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:12px;padding:5px 12px;border-radius:20px;}
.name-tag{font-size:12.5px;color:var(--sub);}

.qcard{position:relative;background:linear-gradient(180deg,#fffdf8,#fff);border:1.5px solid var(--gold-light);border-radius:16px;padding:22px 20px 20px;margin-bottom:16px;}
.qtext.reading{background:linear-gradient(90deg,rgba(184,144,47,.18),rgba(184,144,47,.05));border-radius:8px;animation:ttsPulse 1.2s ease-in-out infinite;}
@keyframes ttsPulse{0%,100%{opacity:1;}50%{opacity:.72;}}
.prep-num{font-size:34px;font-weight:800;color:var(--navy);margin:6px 0 14px;}
.kb-mic-hint{display:none;text-align:center;background:linear-gradient(180deg,#fff8e6,#fff);border:2px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:10px;animation:kbHintPulse 1s ease-in-out infinite;}
.kb-mic-hint.show{display:block;}
.kb-mic-hint .arrow{font-size:26px;}
@keyframes kbHintPulse{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.qcard::before{content:"Q";position:absolute;top:-14px;left:18px;background:var(--gold);color:#3a2c05;font-family:'Noto Serif KR',serif;font-weight:900;font-size:14px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.15);}
.qtext{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;line-height:1.55;margin:10px 0 0;color:var(--navy);}

.rec-zone{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;background:#fbf9f3;margin-bottom:14px;}
.mic-btn{width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#8a2d38,var(--navy2));box-shadow:0 10px 22px rgba(60,10,16,.3);transition:.15s;}
.mic-btn.recording{background:radial-gradient(circle at 35% 30%,#e05b47,var(--rec));animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.45);}70%{box-shadow:0 0 0 18px rgba(192,57,43,0);}100%{box-shadow:0 0 0 0 rgba(192,57,43,0);}}
.rec-status{font-size:12.5px;font-weight:700;color:var(--sub);min-height:18px;white-space:pre-line;}
.rec-status.on{color:var(--rec);}
.rec-status.err{color:var(--bad);}
.waveform{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:22px;margin:8px 0 2px;}
.waveform span{width:3px;background:var(--rec);border-radius:2px;animation:wave 1s infinite ease-in-out;}
.waveform span:nth-child(1){animation-delay:0s;} .waveform span:nth-child(2){animation-delay:.1s;}
.waveform span:nth-child(3){animation-delay:.2s;} .waveform span:nth-child(4){animation-delay:.3s;}
.waveform span:nth-child(5){animation-delay:.4s;} .waveform span:nth-child(6){animation-delay:.5s;}
.waveform span:nth-child(7){animation-delay:.6s;}
@keyframes wave{0%,100%{height:5px;}50%{height:22px;}}

textarea.answer-box{width:100%;min-height:110px;padding:14px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;font-family:inherit;background:#fff;resize:vertical;line-height:1.6;}
textarea.answer-box:focus{outline:2px solid var(--navy);}
.answer-label{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;}
.answer-label span{font-size:13.5px;font-weight:700;}
.char-count{font-size:11.5px;color:var(--sub);}

.giveup{display:block;text-align:center;color:var(--sub);font-size:12.5px;margin-top:14px;text-decoration:underline;cursor:pointer;}

.score-wrap{text-align:center;margin:6px 0 4px;}
.score-ring{width:150px;height:150px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;}
.score-num{font-family:'Noto Serif KR',serif;font-size:44px;font-weight:900;line-height:1;}
.score-max{font-size:12px;color:var(--sub);margin-top:2px;}
.tier-label{text-align:center;font-weight:800;font-size:16px;border-radius:14px;padding:12px;margin:6px 0 16px;}
.tier-perfect{background:linear-gradient(135deg,#ffe9a8,#e9c65e);color:#5a4200;}
.tier-good{background:var(--good-bg);color:var(--good);}
.tier-mid{background:#fdf2e0;color:#a8631a;}
.tier-low{background:var(--bad-bg);color:var(--bad);}

.kw-section{margin-top:6px;}
.kw-title{font-size:13.5px;font-weight:700;margin:14px 0 8px;color:var(--ink);}
.kw-grid{display:flex;flex-wrap:wrap;gap:8px;}
.kw-chip{border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;}
.kw-chip.ok{background:var(--good-bg);color:var(--good);border:1px solid #bfe3cd;}
.kw-chip.miss{background:var(--bad-bg);color:var(--bad);border:1px solid #f2c9bd;}

.ans-box{border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.65;margin:10px 0;}
.ans-box.mine{background:#eef1f6;color:var(--navy);}
.ans-box.model{background:#fbf3df;color:#5a4200;}
.ans-box b{display:block;margin-bottom:6px;font-size:13px;letter-spacing:.3px;}

.result-list{margin-top:4px;}
.result-item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:#fffdf8;}
.result-item .ri-q{font-size:13px;flex:1;padding-right:10px;line-height:1.4;}
.result-item .ri-score{font-weight:900;font-size:15px;min-width:52px;text-align:right;}
.avg-big{text-align:center;font-family:'Noto Serif KR',serif;font-size:52px;font-weight:900;color:var(--navy);margin:4px 0 0;}
.avg-sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px;}

.warnbox{background:#fdf2e0;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7a5a1a;margin-bottom:14px;line-height:1.65;white-space:pre-line;}
.infobox{background:#eef1f6;border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--navy);margin-bottom:14px;line-height:1.65;white-space:pre-line;}
.footer-copy{text-align:center;color:#9aa0ac;font-size:11.5px;margin-top:22px;}
.hist-item{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;background:#fffdf8;cursor:pointer;}
.hist-top{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;}
.hist-sub{font-size:11.5px;color:var(--sub);margin-top:3px;}

.wrongitem{border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;background:#fffdf8;}
.wrongitem .wq{font-weight:700;margin-bottom:6px;font-size:14px;color:var(--navy);}
.wrongitem .wmeta{font-size:11px;color:var(--sub);margin-bottom:8px;}
.wrongitem .wa{color:var(--bad);font-size:13px;margin-bottom:4px;}
.wrongitem .wc{color:var(--good);font-size:13px;}

.tabbar{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto;}
.tabbtn{flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--navy);border-color:var(--gold);}
table{width:100%;border-collapse:collapse;font-size:13px;}
.scrollable-table{overflow-x:auto;}
.sticky-name-table th:first-child,.sticky-name-table td:first-child{position:sticky;left:0;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,.06);}
.sticky-name-table th:first-child{background:#fbf9f3;}
.sticky-name-table td:first-child{background:#fff;}
.sticky-name-table tr.clickable:active td:first-child{background:#f3f0e6;}
.scrollable-table table{width:auto;min-width:100%;}
.scrollable-table th,.scrollable-table td{white-space:nowrap;padding-left:10px;padding-right:10px;}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:700;background:#fbf9f3;}
tr.clickable{cursor:pointer;}
tr.clickable:active{background:#f4eeee;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:1200;padding:24px;}
.modal-overlay.hidden{display:none !important;}
.modal-box{background:#fff;border-radius:20px;padding:24px 20px;max-width:340px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.modal-box p{font-size:14.5px;line-height:1.6;margin:0 0 18px;text-align:center;color:var(--ink);white-space:pre-line;}@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; left:0; top:0; width:100%; padding:20px; }
  #printArea .print-item{ break-inside:avoid; page-break-inside:avoid; }
}
.print-item{ break-inside:avoid; page-break-inside:avoid; border:1px solid #ccc;border-radius:6px;padding:10px 12px;margin-bottom:8px; }
</style>
</head>
<body>
<div class="hero">
  <div class="mic-badge">🎙️</div>
  <div class="eyebrow">GMS학원 이은정 강사 · 자사·특목·과고반 대비</div>
  <h1>중등 수학 구술면접 마스터</h1>
  <p>질문을 읽고 실제 면접처럼 목소리로 답해보세요</p>
</div>
<div class="wrap" id="app"></div>
<div id="printArea" class="hidden"></div>
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <div class="row2" id="modalBtns"></div>
  </div>
</div>

<script>
/* ===================== 문제 은행 ===================== */
const QUESTIONS = [
{id:'N1',cat:'수와 연산',grade:'중1',q:'소수의 정의는 무엇인가요?',
 a:'1과 자기 자신만을 약수로 가지는 1보다 큰 자연수를 소수라고 합니다.',
 kw:[{l:'1과 자기 자신만을 약수로 가짐',a:['1과 자기 자신','자기 자신만']},{l:'1보다 큰 자연수',a:['1보다 큰']}]},
{id:'N2',cat:'수와 연산',grade:'중1',q:'합성수의 정의는 무엇인가요?',
 a:'1보다 큰 자연수 중에서 소수가 아닌 수, 즉 약수가 3개 이상인 수를 합성수라고 합니다.',
 kw:[{l:'소수가 아닌 1보다 큰 자연수',a:['소수가 아닌']},{l:'약수가 3개 이상',a:['약수가 3개','3개 이상']}]},
{id:'N3',cat:'수와 연산',grade:'중1',q:'1은 소수인가요, 합성수인가요? 그 까닭도 설명하시오.',
 a:'1은 소수도 합성수도 아닙니다. 소수는 약수가 2개인 수, 합성수는 약수가 3개 이상인 수인데, 1은 약수가 자기 자신 하나뿐이기 때문입니다.',
 kw:[{l:'소수도 합성수도 아님',a:['소수도','합성수도']},{l:'약수가 1개뿐',a:['약수가 1개','하나뿐']}]},
{id:'N4',cat:'수와 연산',grade:'중1',q:'소인수분해의 뜻과 그 결과를 표현할 때 지켜야 할 규칙을 설명하시오.',
 a:'자연수를 소인수만의 곱으로 나타내는 것을 소인수분해라고 하며, 결과를 표현할 때는 같은 소인수의 곱은 거듭제곱으로, 소인수는 작은 수부터 크기순으로 나열합니다.',
 kw:[{l:'소인수만의 곱으로 나타냄',a:['소인수','곱']},{l:'거듭제곱으로, 작은 수부터',a:['거듭제곱','작은 수']}]},
{id:'N5',cat:'수와 연산',grade:'중1',q:'두 자연수의 최대공약수와 최소공배수를 소인수분해를 이용해 구하는 방법을 설명하시오.',
 a:'두 수를 각각 소인수분해한 뒤, 최대공약수는 공통인 소인수를 지수가 작거나 같은 것끼리 곱하고, 최소공배수는 모든 소인수를 지수가 크거나 같은 것끼리 곱하여 구합니다.',
 kw:[{l:'공통 소인수 중 작은 지수(최대공약수)',a:['공통','작은 지수']},{l:'모든 소인수 중 큰 지수(최소공배수)',a:['모든 소인수','큰 지수']}]},
{id:'N6',cat:'수와 연산',grade:'중1',q:'서로소의 정의는 무엇인가요?',
 a:'두 자연수의 최대공약수가 1일 때, 이 두 수를 서로소라고 합니다.',
 kw:[{l:'최대공약수가 1',a:['최대공약수가 1']}]},
{id:'N7',cat:'수와 연산',grade:'중1',q:'정수와 유리수의 정의를 각각 설명하시오.',
 a:'정수는 양의 정수, 0, 음의 정수를 통틀어 이르는 수이고, 유리수는 분수 a/b(a, b는 정수, b는 0이 아님) 꼴로 나타낼 수 있는 수입니다.',
 kw:[{l:'정수: 양의 정수, 0, 음의 정수',a:['양의 정수','음의 정수']},{l:'유리수: 분수 꼴로 나타낼 수 있는 수',a:['분수','a/b']}]},

/* ===================== 로그인 설정 =====================
   Code.gs는 건드리지 않고 비밀번호를 로컬에서만 관리해요.
   강사용 대시보드에서 비밀번호를 바꾸면 localStorage에 저장돼서
   같은 기기에서는 유지되고, 학생들은 선생님이 알려준 번호를 입력해요. */
let loginConfigCache = null;
async function getLoginConfig(){
  if(loginConfigCache) return loginConfigCache;
  let password = DEFAULT_STUDENT_PW, loginEnabled = true;
  try{
    const cp = localStorage.getItem('login_pw_'+APP_KEY); if(cp) password = cp;
    const ce = localStorage.getItem('login_en_'+APP_KEY); if(ce) loginEnabled = (ce==='Y');
  }catch(e){}
  loginConfigCache = {password, loginEnabled};
  return loginConfigCache;
}
function saveLoginConfig(password, loginEnabled){
  loginConfigCache = {password, loginEnabled};

// 두 문자열 간 편집거리(레벤슈타인 거리) 계산 - 음성인식 오인식 허용 매칭에 사용
function editDistance(a, b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
// 키워드가 텍스트 안에 "충분히 비슷하게" 포함되어 있는지 확인
// 음절 수의 30% 이내 오차(삽입/삭제/대체)이면 인정
function fuzzyIncludes(text, keyword){
  if(!keyword || keyword.length===0) return false;
  if(text.includes(keyword)) return true;
  if(keyword.length < 2) return text.includes(keyword);
  const maxDist = Math.max(1, Math.floor(keyword.length * 0.3));
  // 키워드 길이 윈도우로 슬라이딩하며 편집거리 검사
  for(let i=0;i<=text.length-keyword.length+maxDist;i++){
    const window = text.slice(Math.max(0,i), Math.min(text.length, i+keyword.length+maxDist));
    if(editDistance(window, keyword) <= maxDist) return true;
  }
  return false;
}
function fixSoundErrors(text){
  let t = text || '';
  SOUND_FIXES.forEach(([pat, rep])=>{ t = t.replace(pat, rep); });
  return t;
}

// 조사/어미 제거 후 어간만 남기는 가벼운 정규화
function normDeep(s){
  return (s||'')
    .replace(/[^\uAC00-\uD7A3a-zA-Z0-9]/g,' ') // 특수문자→공백
    .replace(/\s+/g,'')
    .toLowerCase();
}

function scoreAnswer(q, text){
  if(!text || text.trim().length < 2){
    return {matched:[], missed:q.kw, score:0, aiGraded:false};
  }
  // 음성인식 오류 교정 후 정규화
  const fixed = fixSoundErrors(text);
  const n = normDeep(fixed);
  const nOrig = norm(text); // 원본도 함께 체크

  const matched=[], missed=[];
  q.kw.forEach(k=>{
    const hit = k.a.some(alt=>{
      const na = normDeep(fixSoundErrors(alt));
      const na2 = norm(alt);
      // 1. 완전 포함
      if(n.includes(na) || nOrig.includes(na2)) return true;
      // 2. 퍼지 매칭: 편집거리 기반으로 비슷하면 인정 (음성인식 오인식 대응)
      if(na.length >= 2 && fuzzyIncludes(n, na)) return true;
      // 3. 부분 매칭: alt 글자의 80% 이상 순서대로 포함되면 인정
      if(na.length >= 2){
        let pos=0, matched2=0;
        for(let ch of na){ const idx=n.indexOf(ch,pos); if(idx>=0){matched2++;pos=idx+1;} }
        if(matched2/na.length >= 0.8) return true;
      }
      return false;
    });
    if(hit) matched.push(k); else missed.push(k);
  });

  const total = q.kw.length || 1;
  const ratio = matched.length / total;

  // 기본 점수 50점 + 키워드 비율로 50점 추가 (답변이 있는 경우)
  // 키워드 1개만 맞아도 의미 있는 점수, 전체 맞으면 100점 가능
  let score;
  const hasAnswer = text.trim().length >= 4;
  if(!hasAnswer){
    score = 0;
  } else if(total === 0){
    score = 70; // 키워드 없는 문항은 답변 있으면 기본
  } else {
    // 기본 50 + 키워드 비율 * 50
    score = Math.round(50 + ratio * 50);
    // 키워드 전부 맞으면 100점
    if(ratio >= 1) score = 100;
    // 키워드 절반 이상이면 최소 75점 보장
    if(ratio >= 0.5 && score < 75) score = 75;
    // 키워드 1개 이상 맞으면 최소 60점 보장
    if(matched.length >= 1 && score < 60) score = 60;
  }
  score = Math.max(0, Math.min(100, score));
  return {matched, missed, score, aiGraded:false};
}
/* 최종 점수를 한 번 더 후하게 보정. 80점 정도 받은 답변은 100점에 가깝게,
   낮은 점수는 상대적으로 덜 보정되어 변별력은 유지되도록 함. */
function boostScore(raw){
  const boosted = Math.round(raw * 1.25);
  return Math.max(0, Math.min(100, boosted));
}
/* AI(Claude)로 의미 기반 채점을 시도. 실패하면 null을 반환해 키워드 채점으로 대체함.
   음성인식 결과는 표현이 모범답안과 달라도 의미가 같으면 인정해야 하므로,
   단순 문자열 포함 여부가 아니라 모델이 각 핵심 개념의 '의미상 포함 여부'를 판단하게 함.
   중학생 구술면접 상황이므로 채점은 관대하게: 핵심 수학 개념이 맞으면 부수적인 세부 표현
   (예: 위치, 정확한 수치, 부연 설명 등)을 빠뜨려도 감점하지 않음. */
async function aiGradeAnswer(q, text){
  if(!text || norm(text).length < 4) return null;
  const labels = q.kw.map(k=>k.l);
  const sys = `너는 중학교 수학 구술면접을 채점하는 친절하고 관대한 채점관이야. 학생의 음성인식 답변(오타나 띄어쓰기 오류가 있을 수 있음)을 모범답안과 비교해서 채점해.

채점 원칙 (중요, 반드시 지킬 것):
1. 표현이 달라도 의미가 같거나 같은 내용을 자기 말로 풀어서 설명했으면 해당 핵심 개념을 "포함됨"으로 인정해. 단어가 똑같이 나왔는지가 아니라 수학적으로 핵심 의미가 맞는지로 판단해.
2. 중학생 수준의 구술 답변임을 감안해서 관대하게 채점해. 핵심 개념 라벨이 "OO는 XX이다"처럼 여러 요소를 담고 있어도, 학생이 그 개념의 핵심 아이디어만 정확히 말했다면 부수적인 수식어, 위치 표현(예: "지하 깊은 곳", "표면 부근" 같은 세부 조건), 정확한 수치나 예시를 굳이 언급하지 않아도 그 개념은 포함된 것으로 인정해.
3. 학생 답변에 수학적으로 명백히 틀린 내용이 없다면, 사소한 설명 누락만으로 감점하지 마. 오직 핵심 개념 자체를 언급하지 않았거나, 수학적으로 틀리게 설명한 경우에만 그 개념을 "포함되지 않음"으로 처리해.
4. 오타, 띄어쓰기 오류, 음성인식 과정에서 생긴 비슷한 발음의 단어 오변환(예: "광합성"이 "광압성"으로 잘못 인식된 경우 등)은 절대 감점 사유로 삼지 마. 문맥상 학생이 어떤 단어나 개념을 말하려 한 것인지 명확히 유추할 수 있다면, 정확한 표기가 아니어도 원래 의도한 단어를 말한 것으로 인정하고 채점해.
5. 점수는 후하게 매겨. 핵심 개념을 대부분(예: 전체의 80% 이상) 의미상 정확히 짚었다면 90~100점을 줘. 몇 가지 핵심 개념만 빠졌다면 70~89점, 절반 정도만 맞았다면 45~69점, 핵심을 거의 말하지 못했거나 답변이 없으면 그 이하로 줘. 완벽하게 토씨 하나까지 똑같아야만 100점을 주는 방식이 아니라, 수학적으로 충분히 이해하고 설명했다고 판단되면 100점도 흔쾌히 줘.

반드시 아래 JSON 형식으로만 답해. 다른 텍스트나 코드블록 표시(백틱) 없이 순수 JSON만 출력해.
{"matched":["핵심개념 라벨 중 학생이 의미상 포함한 것들"],"missed":["포함하지 않은 것들"],"score":0~100 사이 정수,"feedback":"학생을 격려하는 한두 문장의 한국어 피드백"}
matched와 missed의 문자열은 반드시 주어진 핵심개념 라벨 목록의 것을 그대로 사용해야 하고, 모든 라벨이 둘 중 하나에 정확히 한 번씩만 들어가야 해.`;
  const userMsg = `[질문]\n${q.q}\n\n[모범답안]\n${q.a}\n\n[핵심개념 라벨 목록]\n${JSON.stringify(labels)}\n\n[학생 답변]\n${text}`;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: sys,
        messages:[{role:'user', content:userMsg}]
      })
    });
    if(!res.ok) return null;
    const data = await res.json();
    const outText = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    const clean = outText.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!parsed || typeof parsed.score!=='number') return null;
    const matchedLabels = Array.isArray(parsed.matched)? parsed.matched : [];
    const missedLabelsRaw = Array.isArray(parsed.missed)? parsed.missed : [];
    const matched = q.kw.filter(k=>matchedLabels.includes(k.l));
    const missed = q.kw.filter(k=>!matchedLabels.includes(k.l));
    let score = Math.round(parsed.score);
    if(score<0) score=0; if(score>100) score=100;
    return {matched, missed, score, feedback: typeof parsed.feedback==='string'? parsed.feedback : null, aiGraded:true};
  }catch(e){
    return null;
  }
}
async function generateFollowUp(q, studentAnswer, score, trackType){

  const sys = trackType==='advanced-probe'? sysAdvanced : sysBasic;
  const userMsg = `[원래 질문]\n${q.q}\n\n[모범답안]\n${q.a}\n\n[학생 답변]\n${studentAnswer}\n\n[학생 점수]\n${score}점`;

    if(el){ el.textContent=msg; }

/* ===================== 음성 인식 ===================== */
function setupRecognition(){
  if(!SR) return;
  recognition = new SR();
  recognition.lang='ko-KR';
  // continuous=false: 한 번 누르면 말이 끝날 때(또는 침묵)까지 쭉 듣고 자동으로 멈춤.
  // (continuous=true는 모바일에서 내부적으로 재시작되며 텍스트가 중복 누적되는 문제가 있었고,
  //  자동 재시작 방식은 재시작 자체가 실패해 아예 인식이 안 되는 문제가 있어 가장 단순하고 안정적인 방식으로 되돌림)
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.onresult=(e)=>{
    let sessionFinal='';
    let interim='';
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) sessionFinal += t;
      else interim += t;
    }
    lastBurstFinal = sessionFinal;
    state.answerText = (recFinalBase + sessionFinal + interim).trim();
    updateAnswerBoxLive();
  };
  recognition.onerror=(e)=>{
    let msg='음성 인식 중 오류가 발생했어요.';
    let fatal=false;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      msg='마이크 권한이 필요해요.\n① 브라우저 주소창의 자물쇠 아이콘에서 마이크 허용 여부를 확인하세요.\n② 그래도 안 되면 이 화면이 대화창 안 미리보기일 수 있어요 — 아티팩트를 게시/공유한 링크를 새 탭에서 열거나 HTML을 다운로드해 직접 열어보세요.';
      fatal=true;
    } else if(e.error==='no-speech'){
      msg='음성이 감지되지 않았어요. 계속 듣고 있어요.';
    } else if(e.error==='network'){
      msg='네트워크 오류로 음성 인식에 실패했어요. 인터넷 연결을 확인해주세요.';
      fatal=true;
    } else if(e.error==='aborted'){
      return; // 사용자가 직접 멈춰서 발생하는 정상적인 중단
    }
    if(fatal) micWanted=false;
    const st=document.getElementById('recStatus'); if(st){st.textContent=msg; st.classList.remove('on'); st.classList.add('err');}
  };
  recognition.onend=()=>{
    if(lastBurstFinal){
      recFinalBase = (recFinalBase + lastBurstFinal + ' ').replace(/\s+/g,' ');
      state.answerText = recFinalBase.trim();
      updateAnswerBoxLive();
    }
    lastBurstFinal='';
    if(micWanted){
      // 사용자가 아직 마이크를 끄지 않았으면, 짧은 텀을 두고 자동으로 다시 듣기 시작
      // (재시작을 너무 빨리 하면 브라우저가 오류를 내는 경우가 있어 약간의 지연을 둠)
      isRecording=true;
      renderQuizControls();
      if(recRestartTimer) clearTimeout(recRestartTimer);
      recRestartTimer = setTimeout(()=>{
        if(!micWanted) return;
        try{ recognition.start(); }
        catch(err){ isRecording=false; micWanted=false; renderQuizControls(); }
      }, 350);
    } else {
      isRecording=false;
      renderQuizControls();
    }
  };
}
function toggleRecording(){
  if(!SR) return;
  if(!recognition) setupRecognition();
  if(isRecording || micWanted){
    micWanted=false;
    if(recRestartTimer){ clearTimeout(recRestartTimer); recRestartTimer=null; }
    try{ recognition.stop(); }catch(e){}
    isRecording=false;
  } else {
    stopAnswerTimer();
    recFinalBase = state.answerText ? state.answerText+' ' : '';
    lastBurstFinal='';
    micWanted=true;
    try{ recognition.start(); isRecording=true; }catch(e){ micWanted=false; }
  }
  renderQuizControls();
}

/* ===================== 질문 음성(TTS) + 답변 준비 카운트다운 ===================== */
let lastTTSQuestionId = null;
let prepTimerId = null;
let ttsVoicesCache = null;
function pickKoreanVoice(){
  if(!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  ttsVoicesCache = voices;
  const koVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
  if(!koVoices.length) return null;
  // 남성으로 추정되는 이름 패턴 우선 탐색 (플랫폼마다 표기가 달라 폭넓게 매칭)
  const maleNamePattern = /male|man|injoon|인준|민수|minsu|준호|junho|철수|형준|승우|성진/i;
  const femaleNamePattern = /female|woman|heami|해ami|유나|yuna|sunhi|선희|지민|jimin/i;
  let pick = koVoices.find(v=>maleNamePattern.test(v.name));
  if(!pick) pick = koVoices.find(v=>!femaleNamePattern.test(v.name) && koVoices.length>1) || null;
  return pick || koVoices[0];
}
function isIOSDevice(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}
function speakQuestion(text){
  const ttsTargetId = lastTTSQuestionId; // 이 발화가 어떤 문제를 위한 것인지 기억해둠
  if(!window.speechSynthesis){ startPrepCountdown(); return; } // TTS 미지원이면 바로 카운트다운으로
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    // 아이폰(iOS) 음성 엔진은 피치를 조금만 낮춰도 소리가 심하게 왜곡되는 경우가 많아
    // 아예 기본 피치(자연스러운 목소리)를 그대로 사용
    if(isIOSDevice()){
      utter.pitch = 1.0;
      utter.rate = 0.95;
    } else {
      utter.pitch = 0.68; // 낮은 피치로 딱딱하고 무게감 있는 남성 아나운서 톤
      utter.rate = 0.92;
    }
    utter.volume = 1;
    const voice = pickKoreanVoice();
    if(voice) utter.voice = voice;
    utter.onstart = ()=>{ const el=document.getElementById('qtext'); if(el) el.classList.add('reading'); };
    const finish = ()=>{
      const el=document.getElementById('qtext'); if(el) el.classList.remove('reading');
      // 이 음성 재생이 끝나기 전에 이미 다음 문제로 넘어갔거나 면접이 끝났다면
      // (=lastTTSQuestionId가 바뀌었거나 더 이상 quiz 화면이 아니라면) 뒤늦게 도착한
      // 이 종료 이벤트로 불필요한 새 카운트다운(비프음)을 시작하지 않음
      if(lastTTSQuestionId !== ttsTargetId || screen !== 'quiz') return;
      startPrepCountdown();
    };
    utter.onend = finish;
    utter.onerror = finish;
    window.speechSynthesis.speak(utter);
  }catch(e){ startPrepCountdown(); }
}
function playTone(freq, duration, vol){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type='sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime+0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
    osc.start(); osc.stop(ctx.currentTime+duration+0.05);
  }catch(e){}
}
function playTick(){ playTone(1100, 0.09, 0.14); } // 카운트다운 매 초마다 나는 짧은 비프음
function playBeep(){ playTone(880, 0.35, 0.28); } // 카운트다운 종료(0초) 시 울리는 신호음
function startPrepCountdown(){
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  state._prepActive = true;
  state._prepTimeLeft = 10;
  render();
  prepTimerId = setInterval(()=>{
    state._prepTimeLeft -= 1;
    const el = document.getElementById('prepCountdownNum');
    if(el) el.textContent = state._prepTimeLeft+'초';
    if(state._prepTimeLeft<=0){
      clearInterval(prepTimerId); prepTimerId=null;
      finishPrepCountdown(true);
    } else {
      playTick();
    }
  },1000);
}
function finishPrepCountdown(autoStart){
  state._prepActive = false;
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  render();
  if(autoStart){
    playBeep();
    if(SR && !isRecording){ try{ toggleRecording(); }catch(e){} }
  }
}
function cancelQuestionAudio(){
  if(window.speechSynthesis) try{ window.speechSynthesis.cancel(); }catch(e){}
  if(prepTimerId){ clearInterval(prepTimerId); prepTimerId=null; }
  state._prepActive = false;
}

async function attemptLogin(){
  const nameEl = document.getElementById('loginNameInput');
  const pwEl = document.getElementById('loginPwInput');
  const nm = (nameEl ? nameEl.value : '').trim();
  if(!nm){ await showAlert('이름을 입력해 주세요!'); return; }
  const cfg = await getLoginConfig();
  if(cfg.loginEnabled !== false){
    const pw = (pwEl ? pwEl.value : '').trim();
    if(!pw){ await showAlert('비밀번호를 입력해 주세요!'); return; }
    if(pw !== cfg.password){ await showAlert('비밀번호가 틀렸어요. 선생님께 다시 확인해 주세요!'); return; }
  }
  state.name = nm;
  saveLastUsedName(nm);
  showLoadingModal('이전 기록을 확인하고 있어요...');
  serverResumeCache = await fetchServerResumeSnapshots(nm);
  hideLoadingModal();
  screen = 'setup';
  render();
}

/* ===================== PDF 오답노트 (소화/순환 퀴즈앱과 동일하게 검증된 방식) ===================== */
/* 모바일 대응(중요): pdf.save()의 자동(프로그램) 다운로드는 삼성 인터넷 등 일부
   모바일 브라우저에서 조용히 실패하는 경우가 있어요. 그래서 PDF가 준비되면
   학생/강사가 '직접 손가락으로 누르는' 진짜 링크 버튼을 보여주는 방식으로 처리해요.
   또한 캡처 대상은 화면 밖(-9999px)에 고정 너비(760px)로 별도로 만들어,
   모바일 좁은 화면 너비 때문에 글자가 과하게 커지는 문제를 피해요. */
let lastPdfBlobUrl=null;
let lastPdfFilename=null;
function showLoadingModal(msg){
  const ov=document.getElementById('modalOverlay');
  document.getElementById('modalMsg').innerHTML=msg;
  document.getElementById('modalBtns').innerHTML='';
  ov.classList.remove('hidden');
}
function hideLoadingModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
}
function printWrongNote(name, wrongList){
  if(!wrongList.length){ showAlert('오답노트가 비어 있어요.'); return; }
  const itemsHtml = wrongList.map((w,i)=>{
    const q=QMAP[w.id];
    if(!q) return '';
    return `<div class="print-item">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;line-height:1.45;color:#1b2a4a;">${i+1}. [${q.cat}] ${q.q}</div>
      <div style="font-size:11px;color:#b3432b;">내 답변: ${escapeHtml(w.lastAnswer)||'(답변 없음)'} (${w.lastScore}점)</div>
      <div style="font-size:11px;color:#2f7d5b;font-weight:700;margin-top:3px;">모범 답안: ${q.a}</div>
    </div>`;
  }).join('');
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <h1 style="font-size:18px;color:#1b2a4a;margin:0 0 4px;">${escapeHtml(name)}님의 오답노트</h1>
    <p style="font-size:11px;color:#6b7280;margin:0 0 14px;">중등 수학 구술면접 마스터 · GMS학원 이은정 강사 · ${new Date().toLocaleDateString('ko-KR')}</p>
    ${itemsHtml}
  `;
  area.classList.remove('hidden');
  const prevTitle = document.title;
  document.title = `${name}님의 오답노트`; // 인쇄 대화상자에서 "PDF로 저장" 시 이 이름이 파일명으로 제안됨
  // 모바일 브라우저는 클릭 이벤트 직후 동기적으로 호출해야 인쇄가 정상적으로 열림 (지연 호출 시 막히는 경우가 있음)
  window.print();
  document.title = prevTitle;
  area.classList.add('hidden');
  area.innerHTML='';
}
async function downloadWrongNotePDF(name, wrongList){
  if(!wrongList.length){ await showAlert('오답노트가 비어 있어요.'); return; }
  if(!window.html2canvas || !(window.jspdf && window.jspdf.jsPDF)){
    await showAlert('PDF 기능을 불러오는 중이에요. 인터넷 연결을 확인한 뒤 잠시 후 다시 시도해주세요.');
    return;
  }
  showLoadingModal('📄 PDF를 만들고 있어요...');
  const helper = document.createElement('div');
  helper.style.cssText = 'position:fixed;left:-9999px;top:0;width:700px;background:#ffffff;box-sizing:border-box;font-family:"Noto Sans KR",sans-serif;';
  document.body.appendChild(helper);
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const usableWidth = pageWidth - margin*2;
    let y = margin;

    // 제목 블록을 이미지로 렌더링해 추가
    helper.innerHTML = `<h1 style="font-size:18px;color:#1b2a4a;margin:0 0 4px;">${escapeHtml(name)}님의 오답노트</h1><p style="font-size:11px;color:#6b7280;margin:0;">중등 수학 구술면접 마스터 · GMS학원 이은정 강사 · ${new Date().toLocaleDateString('ko-KR')}</p>`;
    let canvas = await html2canvas(helper, {scale:2, backgroundColor:'#ffffff', windowWidth:700});
    let imgH = canvas.height*usableWidth/canvas.width;
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',margin,y,usableWidth,imgH);
    y += imgH + 6;

    // 문항을 하나씩 이미지로 렌더링해서, 페이지 남은 공간에 안 맞으면 통째로 다음 페이지로 넘김
    // (하나의 큰 이미지를 기계적으로 잘랐던 예전 방식과 달리 문항 중간이 잘리지 않음)
    for(let i=0;i<wrongList.length;i++){
      const w = wrongList[i];
      const q = QMAP[w.id];
      if(!q) continue;
      helper.innerHTML = `
        <div style="padding:8px 10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;">
          <div style="font-size:13px;font-weight:700;margin-bottom:4px;color:#1b2a4a;">${i+1}. [${q.cat}] ${q.q}</div>
          <div style="font-size:11px;color:#b3432b;">내 답변: ${escapeHtml(w.lastAnswer)||'(답변 없음)'} (${w.lastScore}점)</div>
          <div style="font-size:11px;color:#2f7d5b;font-weight:700;margin-top:3px;">모범 답안: ${q.a}</div>
        </div>`;
      canvas = await html2canvas(helper, {scale:2, backgroundColor:'#ffffff', windowWidth:700});
      imgH = canvas.height*usableWidth/canvas.width;
      if(y + imgH > pageHeight - margin){
        pdf.addPage();
        y = margin;
      }
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',margin,y,usableWidth,imgH);
      y += imgH + 4;
    }
    hideLoadingModal();
    lastPdfFilename = `${name||'학생'}님의 오답노트.pdf`;
    lastPdfBlobUrl = URL.createObjectURL(new File([pdf.output('blob')], lastPdfFilename, {type:'application/pdf'})); // File로 감싸야 '열어서 보기'에서 인쇄할 때도 파일명이 정확히 뜸
    showPdfReadyModal(`📄 ${escapeHtml(name||'학생')}님의 오답노트 PDF가 준비됐어요!<br>아래 버튼을 <b>직접 눌러서</b> 저장하거나 열어 주세요.`);
  }catch(e){
    hideLoadingModal();
    await showAlert('PDF를 만드는 중 문제가 발생했어요. 인터넷 연결을 확인하고 다시 시도해주세요.');
  } finally {
    if(helper.parentNode) helper.parentNode.removeChild(helper);
  }
}

async function fetchStudentFromSheet(name){
  // 기존 Code.gs: ?name=이름 → 그 학생 기록 배열 반환
  const url = SHEET_WEBHOOK_URL + '?name=' + encodeURIComponent(name.trim());
  const res = await fetch(url);
  if(!res.ok) throw new Error('네트워크 오류');
  const data = await res.json();
  if(Array.isArray(data)) return data;
  return [];
}
function buildWrongListFromSheetRows(rows){
  // 스킬 방식: 시간순(오래된→최신)으로 재생하면서
  // 틀리면 추가, 나중에 맞히면 제거 → "현재 시점 오답"만 남김
  const sorted = rows.slice().sort((a,b)=>{
    const ta = a.date ? new Date(a.date).getTime() : 0;
    const tb = b.date ? new Date(b.date).getTime() : 0;
    return ta - tb; // 오래된 것 먼저
  });
  const wrongMap = {};
  sorted.forEach(row=>{
    let records = [];
    try{ records = JSON.parse(row.records || '[]'); }catch(e){ records=[]; }
    records.forEach(r=>{
      if(!QMAP[r.id]) return;
      if(r.score < WRONG_THRESHOLD){
        wrongMap[r.id] = {id:r.id, lastAnswer:r.answer, lastScore:r.score};
      } else {
        // 나중에 맞혔으면 오답에서 제거 (스킬의 answers[qid]===true 처리와 동일)
        delete wrongMap[r.id];
      }
    });
  });
  return Object.values(wrongMap);
}
function buildWrongListForRowDate(rows, dateISO){
  // 제출 건별 기록의 특정 한 줄(세션)만 콕 집어서 그 세션의 오답만 모음
  const row = rows.find(r=>r.date===dateISO);
  if(!row) return [];
  let records = [];
  try{ records = JSON.parse(row.records || '[]'); }catch(e){ records=[]; }
  return records.filter(r=>r.score < WRONG_THRESHOLD && QMAP[r.id]).map(r=>({id:r.id, lastAnswer:r.answer, lastScore:r.score}));
}
function buildWrongListForDate(rows, dateKey){
  // 특정 날짜에 "완료된" 세션들에서만 오답을 모음 (그 날 제출한 것 기준)
  const map = {};
  rows.forEach(row=>{
    const dt = parseSheetDateTime(row.date);
    if(!dt || dt.toLocaleDateString('ko-KR')!==dateKey) return;
    if((row.modeLabel||'').includes('진행중')) return; // 완료된 저장만
    let records = [];
    try{ records = JSON.parse(row.records || '[]'); }catch(e){ records=[]; }
    records.forEach(r=>{
      if(r.score < WRONG_THRESHOLD && QMAP[r.id]){
        map[r.id] = {id:r.id, lastAnswer:r.answer, lastScore:r.score};
      }
    });
  });
  return Object.values(map);
}
function buildEverWrongListFromSheetRows(rows){
  // 누적 오답: 한 번이라도 틀렸으면 나중에 맞혀도 목록에서 빼지 않음
  const map = {};
  rows.forEach(row=>{
    let records = [];
    try{ records = JSON.parse(row.records || '[]'); }catch(e){ records=[]; }
    records.forEach(r=>{
      if(r.score < WRONG_THRESHOLD && QMAP[r.id]){
        map[r.id] = {id:r.id, lastAnswer:r.answer, lastScore:r.score};
      }
    });

  return Object.values(map);
}

// 스킬 방식: 시트에서 가져온 rows 중 "진행중"인 가장 최근 세션의 이어풀기 스냅샷 반환
function buildServerResumeFromRows(rows){
  // "진행중" 라벨을 신뢰하지 않고 판단함 — 라벨이 "완료"로 바뀐 채로도 실제로는
  // queueIds(원래 풀기로 한 문제 목록)보다 records(실제 답한 것)가 적어서 아직
  // 안 끝난 세션이 있었던 버그가 있었기 때문에, 라벨 대신 이 개수 비교로 이어풀기
  // 가능 여부를 판단함.
  const candidates = rows.filter(r=>{
    if(!r.queueIds || !r.queueIds.length) return false;
    let records = [];
    try{ records = JSON.parse(r.records || '[]'); }catch(e){ records=[]; }
    return records.length < r.queueIds.length;
  });
  if(!candidates.length) return null;
  // 가장 최근 것
  const sorted = candidates.slice().sort((a,b)=>{
    const ta = a.date ? new Date(a.date).getTime() : 0;
    const tb = b.date ? new Date(b.date).getTime() : 0;
    return tb - ta; // 최신 먼저
  });
  const latest = sorted[0];
  let records = [];
  try{ records = JSON.parse(latest.records || '[]'); }catch(e){ records=[]; }
  return {
    queueIds: latest.queueIds,
    records,
    modeLabel: (latest.modeLabel||'').replace(' (진행중)',''),
    savedAt: latest.date || '',
    ts: latest.date ? new Date(latest.date).getTime() : 0,
    sessionId: latest.sessionId || ''
  };
}
function buildApproxResumeFromRows(rows){
  // queueIds가 없는 옛날 기록(정확한 이어풀기가 불가능한 경우)이라도, records만 있으면
  // "어떤 카테고리를 풀고 있었는지 + 이미 푼 문제 id"는 알 수 있음 -> 이걸로
  // "비슷하게 이어가기"용 근사 스냅샷을 만듦. 정확한 이어풀기가 가능한 세션이 있으면 그게
  // 우선이므로, 이 함수는 buildServerResumeFromRows가 null을 반환했을 때만 호출됨.
  const candidates = rows.filter(r=>{
    if(r.queueIds && r.queueIds.length) return false;
    if(!(r.modeLabel||'').includes('진행중')) return false;
    let records = [];
    try{ records = JSON.parse(r.records || '[]'); }catch(e){ records=[]; }
    return records.length > 0;
  });
  if(!candidates.length) return null;
  const sorted = candidates.slice().sort((a,b)=>{
    const ta = a.date ? new Date(a.date).getTime() : 0;
    const tb = b.date ? new Date(b.date).getTime() : 0;
    return tb - ta;
  });
  const latest = sorted[0];
  let records = [];
  try{ records = JSON.parse(latest.records || '[]'); }catch(e){ records=[]; }
  const answeredIds = records.map(r=>r.id).filter(Boolean);
  const cats = [...new Set(records.map(r=>r.cat).filter(Boolean))];
  if(!cats.length) return null;
  return {
    approx: true,
    answeredIds,
    cats,
    modeLabel: (latest.modeLabel||'').replace(' (진행중)',''),
    savedAt: latest.date || '',
    ts: latest.date ? new Date(latest.date).getTime() : 0
  };
}
let sheetStudentsCache = null;
function parseSheetDateTime(v){
  // Code.gs가 날짜를 ISO 문자열, 타임스탬프(ms), 또는 구글시트 기본 표시형식
  // ("2026. 9. 4 오후 8:42:01") 중 무엇으로 주더라도 안전하게 Date로 변환
  if(v==null || v==='') return null;
  if(v instanceof Date) return isNaN(v.getTime())?null:v;
  if(typeof v==='number'){ const d=new Date(v); return isNaN(d.getTime())?null:d; }
  const s=String(v).trim();
  let d=new Date(s);
  if(!isNaN(d.getTime())) return d;
  const m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D*(오전|오후)?\D*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m){
    let [,y,mo,da,ap,h,mi,se]=m;
    y=+y; mo=+mo-1; da=+da; h=+h; mi=+mi; se=se?+se:0;
    if(ap==='오후' && h<12) h+=12;
    if(ap==='오전' && h===12) h=0;
    d=new Date(y,mo,da,h,mi,se);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}

const TDASH_CHECKPOINT_KEY = 'tdash_checkpoint_'+APP_KEY;
function getTDashCheckpoint(){
  try{
    const raw = localStorage.getItem(TDASH_CHECKPOINT_KEY);
    if(!raw) return null;
    const cp = JSON.parse(raw);
    if(!cp || !cp.data) return null;
    return cp;
  }catch(e){ return null; }
}
function saveTDashCheckpoint(list){
  const data = {};
  (list||[]).forEach(s=>{ data[s.name] = s.totalQuestions; });
  const cp = { savedAt: new Date().toISOString(), data };
  try{ localStorage.setItem(TDASH_CHECKPOINT_KEY, JSON.stringify(cp)); }catch(e){}
  return cp;
}
function fmtCheckpointTime(iso){
  const d = iso ? new Date(iso) : null;
  if(!d || isNaN(d.getTime())) return '';
  return d.toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

function groupSessionsFromRows(rows){
  // Code.gs와 완전히 동일한 로직: 이름+모드별로 나눠서, 문항수가 실제로 줄어들 때만
  // 새 세션으로 봄 (라벨의 "진행중" 표시는 신뢰하지 않음 - 실제 데이터에 라벨이
  // 붙은 채로도 계속 이어지는 세션이 있었기 때문). 대시보드 목록과 학생 상세보기가
  // 항상 같은 숫자를 보여주도록, 두 화면 모두 이 함수 하나만 사용함.
  const byMode = {};
  rows.forEach(r=>{
    const baseMode = (r.modeLabel||'').replace(' (진행중)','').trim();
    if(!byMode[baseMode]) byMode[baseMode] = [];
    byMode[baseMode].push(r);
  });
  const sessions = [];
  Object.keys(byMode).forEach(mode=>{
    const entries = byMode[mode].slice().sort((a,b)=>{
      const ta = a.date ? new Date(a.date).getTime() : 0;
      const tb = b.date ? new Date(b.date).getTime() : 0;
      return ta - tb;
    });
    let prevTotalCount = -1, curGroup = null, curGroupDates = [];
    for(let e=0; e<=entries.length; e++){
      const row = e<entries.length ? entries[e] : null;
      const tc = row ? Number(row.totalCount||0) : 0;
      const isBoundary = (row===null) || (curGroup===null) || (tc < prevTotalCount);
      if(isBoundary && curGroup!==null){
        const dt = parseSheetDateTime(curGroup.date);
        sessions.push({
          date: curGroup.date, dt, ts: dt?dt.getTime():0,
          totalCount: Number(curGroup.totalCount||0),
          score: Number(curGroup.score||0),
          modeLabel: curGroup.modeLabel||'',
          isCompleted: (curGroup.modeLabel||'').indexOf('진행중')===-1,
          rowDates: curGroupDates
        });
        curGroupDates = [];
      }
      if(row===null) break;
      curGroup = row;
      curGroupDates.push(row.date);
      prevTotalCount = tc;
    }
  });
  return sessions.sort((a,b)=>b.ts-a.ts);
}
function buildDailyStatsFromSheetRows(rows){
  const sessions = groupSessionsFromRows(rows).filter(s=>s.isCompleted);
  const byDate = {};
  sessions.forEach(s=>{
    const key = s.dt ? s.dt.toLocaleDateString('ko-KR') : '날짜 미상';
    if(!byDate[key]) byDate[key] = {date:key, ts:s.ts, count:0, questionCount:0, weightedScoreSum:0};
    byDate[key].count++;
    byDate[key].questionCount += s.totalCount;
    byDate[key].weightedScoreSum += s.score * s.totalCount; // 문항 수로 가중 평균 (세션별 평균을 그냥 평균내면 안 됨)
  });
  return Object.values(byDate)
    .map(d=>({date:d.date, count:d.count, questionCount:d.questionCount, avg: d.questionCount ? Math.round(d.weightedScoreSum/d.questionCount) : 0}))
    .sort((a,b)=> (byDate[b.date]?byDate[b.date].ts:0) - (byDate[a.date]?byDate[a.date].ts:0));
}
function buildSessionLogFromSheetRows(rows){
  // 날짜별 집계가 아니라, 실제 세션 하나하나를 시간까지 그대로 보여주기 위한 목록.
  // 완료된 세션뿐 아니라 "진행중"(아직 안 끝난) 세션도 함께 보여줘야, 대시보드 목록의
  // "최근 제출일"에는 최신 날짜가 뜨는데 여기서는 아무 기록도 안 보이는 혼란이 없음.
  return groupSessionsFromRows(rows)
    .map(s=>({date:s.date, dt:s.dt, ts:s.ts, count:s.totalCount, score:s.score, modeLabel:s.modeLabel, rowDates:s.rowDates, isCompleted:s.isCompleted}));
}

          <button class="btn-icon-del sessionDeleteBtn" data-date="${escapeHtml(s.date||'')}" data-label="${escapeHtml(s.dt ? s.dt.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '')} · ${s.count}문항 · ${s.isCompleted?s.score+'점':'진행중'}" title="이 세션만 삭제">🗑️</button>

        <thead><tr><th style="text-align:left;">날짜</th><th>문제수</th><th>평균 점수</th><th>오답노트</th></tr></thead>
        <tbody>${dailyRows}</tbody>
      </table>` : ''}

      <p class="small-note" style="text-align:left;margin-top:14px;margin-bottom:4px;">📋 제출 건별 기록 (최근 ${sessionLog.length}건) · 🗑 눌러서 개별 삭제 가능</p>

      <table>
        <thead><tr><th style="text-align:left;">제출 시각</th><th>문항수</th><th>점수</th><th>모드</th><th></th></tr></thead>
        <tbody>${sessionRows}</tbody>
      </table>
      </div>` : ''}
      <p class="small-note" style="text-align:left;margin-top:14px;margin-bottom:4px;">📕 현재 오답노트 (지금까지 안 틀린 것으로 고쳐진 건 빠짐, ${wrongList.length}문항)</p>
      <div class="row2" style="margin-top:2px;">
        <button class="btn btn-outline" id="sheetPrintBtn">🖨️ 인쇄하기</button>
        <button class="btn btn-gold" id="sheetPdfBtn">💾 PDF로 저장</button>
      </div>
      <p class="small-note" style="text-align:left;margin-top:14px;margin-bottom:4px;">📚 누적 오답노트 (한 번이라도 틀렸으면 나중에 맞혀도 계속 남음, ${everWrongList.length}문항)</p>
      <div class="row2" style="margin-top:2px;">
        <button class="btn btn-outline" id="sheetPrintEverBtn">🖨️ 인쇄하기</button>
        <button class="btn btn-gold" id="sheetPdfEverBtn">💾 PDF로 저장</button>
      </div>
      <button class="btn btn-outline" id="sheetDeleteBtn" style="margin-top:8px;width:auto;color:#b3261e;border-color:#b3261e;padding-left:16px;padding-right:16px;font-size:13px;">🗑️ 이 학생 기록 전체 삭제</button>
    `;
    document.getElementById('sheetPrintBtn').onclick=()=>printWrongNote(nm, wrongList);
    document.getElementById('sheetPdfBtn').onclick=()=>downloadWrongNotePDF(nm, wrongList);
    document.getElementById('sheetPrintEverBtn').onclick=()=>printWrongNote(nm+'(누적)', everWrongList);
    document.getElementById('sheetPdfEverBtn').onclick=()=>downloadWrongNotePDF(nm+'(누적)', everWrongList);
    document.querySelectorAll('.dateWrongBtn').forEach(btn=>{
      btn.onclick=async(ev)=>{
        ev.stopPropagation();
        const dateKey = btn.dataset.date;
        const dateWrongList = buildWrongListForDate(rows, dateKey);
        if(!dateWrongList.length){ await showAlert(`${dateKey}에는 오답이 없어요 (다 맞혔거나 그 날 기록이 없어요).`); return; }
        await downloadWrongNotePDF(`${nm}(${dateKey})`, dateWrongList);
      };
    });
    document.querySelectorAll('.sessionWrongBtn').forEach(btn=>{
      btn.onclick=async(ev)=>{
        ev.stopPropagation();
        const dateISO = btn.dataset.date;
        const rowWrongList = buildWrongListForRowDate(rows, dateISO);
        const timeLabel = (()=>{ const dt=parseSheetDateTime(dateISO); return dt? dt.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '이 회차'; })();
        if(!rowWrongList.length){ await showAlert(`${timeLabel} 회차에는 오답이 없어요 (다 맞혔어요).`); return; }
        await downloadWrongNotePDF(`${nm}(${timeLabel})`, rowWrongList);
      };
    });
    document.querySelectorAll('.sessionDeleteBtn').forEach(btn=>{
      btn.onclick=async(ev)=>{
        ev.stopPropagation();
        const dateVal = btn.dataset.date;
        if(!dateVal){ await showAlert('이 세션은 삭제할 날짜 정보를 찾지 못했어요.'); return; }
        const label = btn.dataset.label || '이 세션';
        const ok = await showConfirm(`다음 세션 1건만 삭제할까요?\n\n${label}\n\n(다른 세션이나 이 학생의 나머지 기록은 그대로 남아요. 이 작업은 되돌릴 수 없어요.)`);
        if(!ok) return;
        btn.disabled = true;
        await deleteSessionFromSheet(nm, dateVal);
        showSheetStudentDetail(nm, resultEl);
        const listEl2 = document.getElementById('sheetAllList');
        if(listEl2){
          try{ renderSheetAllList(await fetchAllStudentsFromSheet()); }catch(e){}
        }
      };
    });
    document.getElementById('sheetDeleteBtn').onclick=async()=>{
      const ok1 = await showConfirm(`'${nm}' 학생의 구글 시트 기록 ${rows.length}건을 정말 삭제할까요?\n이 작업은 되돌릴 수 없어요.`);
      if(!ok1) return;
      const ok2 = await showConfirm(`정말로 확실한가요?\n삭제하면 '${nm}' 학생의 모든 제출 기록·오답 기록이 사라져요.`);
      if(!ok2) return;
      resultEl.innerHTML = `<p class="small-note">🗑️ 삭제 중...</p>`;
      await deleteStudentFromSheet(nm);
      resultEl.innerHTML = `<p class="small-note">✅ '${escapeHtml(nm)}' 학생의 기록을 삭제했어요.</p>`;
      // 강사용 대시보드 목록도 새로고침
      const listEl = document.getElementById('sheetAllList');
      if(listEl){
        try{
          const freshList = await fetchAllStudentsFromSheet();
          renderSheetAllList(freshList);
        }catch(e){}
      }
    };
  }catch(e){
    resultEl.innerHTML = `<p class="small-note">⚠️ 검색에 실패했어요. 인터넷 연결을 확인해주세요.</p>`;
  }
}

/* ===================== 이벤트 ===================== */
function bindEvents(){
  if(screen==='login'){
    document.getElementById('loginBtn').onclick=()=>attemptLogin();
    const loginNameInput=document.getElementById('loginNameInput');
    if(loginNameInput) loginNameInput.onkeydown=(e)=>{ if(e.key==='Enter') attemptLogin(); };
    const loginPwInput=document.getElementById('loginPwInput');
    if(loginPwInput) loginPwInput.onkeydown=(e)=>{ if(e.key==='Enter') attemptLogin(); };
  }
  else if(screen==='setup'){
    const nameEl=document.getElementById('nameInput'); // 로그인 후엔 없음(읽기 전용)
    if(nameEl){
      nameEl.oninput=(e)=>{ state.name=e.target.value; };
      nameEl.onblur=()=>{ saveLastUsedName(state.name.trim()); render(); };
    }
    document.querySelectorAll('.chip').forEach(c=>{
      c.onclick=()=>{
        if(c.dataset.cat){
          const cat=c.dataset.cat;
          if(state.cats.includes(cat)){
            if(state.cats.length>1) state.cats=state.cats.filter(x=>x!==cat);
          } else state.cats.push(cat);
        } else if(c.dataset.grade){
          const g=c.dataset.grade;
          if(state.grades.includes(g)){
            if(state.grades.length>1) state.grades=state.grades.filter(x=>x!==g);
          } else state.grades.push(g);
        }
        render();
      };
    });
    document.querySelectorAll('.opt-chip').forEach(c=>{
      c.onclick=()=>{ state.count=parseInt(c.dataset.count); render(); };
    });
    document.querySelectorAll('.mode-card').forEach(m=>{
      m.onclick=()=>{
        if(m.dataset.mode==='wrong' && !state.name.trim()){ return; }
        if(m.dataset.mode==='cumwrong' && !state.name.trim()){ return; }
        state.mode=m.dataset.mode; render();
      };
    });
    document.getElementById('shuffleChk').onchange=(e)=>{ state.shuffle=e.target.checked; };
    document.getElementById('startBtn').onclick=async()=>{
      if(nameEl) state.name=nameEl.value.trim(); // 로그인 후에는 nameInput이 없으므로 기존 state.name(로그인 시 입력한 이름)을 그대로 사용
      if(!state.name){ await showAlert('이름을 먼저 입력해주세요!'); return; }
      saveLastUsedName(state.name);
      const startBtn=document.getElementById('startBtn');
      if(state.mode==='wrong'||state.mode==='cumwrong'){ startBtn.disabled=true; startBtn.textContent='🔍 다른 기기 기록도 확인하는 중...'; }
      await startInterview();
      if(startBtn){ startBtn.disabled=false; startBtn.textContent='🎓 면접 시작하기'; }
    };
    document.getElementById('micTestBtn').onclick=()=>testMic();
    document.getElementById('myStatsBtn').onclick=()=>{ screen='mystats'; render(); };
    document.getElementById('teacherBtn').onclick=()=>{ screen='tlogin'; render(); };
    const logoutBtn=document.getElementById('logoutBtn');
    if(logoutBtn) logoutBtn.onclick=()=>{ state=newSession(); serverResumeCache={normal:null,wrong:null}; screen='login'; render(); };
    // 스킬 방식: 이어풀기 버튼들 (일반/오답 모드 별도)
    document.querySelectorAll('.resumeBtn').forEach(btn=>{
      btn.onclick=()=>{
        const group = btn.dataset.group;
        const snap = group==='wrong'
          ? pickNewerSnapshot(getStudent(state.name).inProgressWrong||null, serverResumeCache&&serverResumeCache.wrong)
          : pickNewerSnapshot(getStudent(state.name).inProgress||null, serverResumeCache&&serverResumeCache.normal);
        if(snap && snap.approx) resumeApprox(snap); else resumeInterview(snap);
      };
    });
    document.querySelectorAll('.discardResumeBtn').forEach(btn=>{
      btn.onclick=async()=>{
        const group = btn.dataset.group;
        const ok=await showConfirm('이 이어풀기 기록을 지울까요? 새로 시작해야 해요.');
        if(!ok) return;
        const s=getStudent(state.name);
        if(group==='wrong') delete s.inProgressWrong; else delete s.inProgress;
        setStudent(state.name, s);
        if(serverResumeCache) serverResumeCache[group==='wrong'?'wrong':'normal']=null;
        render();
      };
    });
  }
  else if(screen==='quiz'){
    const curQ = state.queue[state.idx];
    if(lastTTSQuestionId !== curQ.id){
      lastTTSQuestionId = curQ.id;
      state._prepActive = false;
      speakQuestion(curQ.q);
    }
    const replayBtn=document.getElementById('replayTTSBtn');
    if(replayBtn) replayBtn.onclick=()=>speakQuestion(curQ.q);
    startAnswerTimer();
    const prepReadyBtn=document.getElementById('prepReadyBtn');
    if(prepReadyBtn) prepReadyBtn.onclick=()=>finishPrepCountdown(true);
    const prepExtendBtn=document.getElementById('prepExtendBtn');
    if(prepExtendBtn) prepExtendBtn.onclick=()=>{ state._prepTimeLeft += 5; const el=document.getElementById('prepCountdownNum'); if(el) el.textContent=state._prepTimeLeft+'초'; };
    const kbMicBtn=document.getElementById('keyboardMicBtn');
    if(kbMicBtn) kbMicBtn.onclick=()=>{
      const box2=document.getElementById('answerBox');
      if(box2){ box2.focus(); const len=box2.value.length; try{ box2.setSelectionRange(len,len); }catch(e){} }
      const hint=document.getElementById('kbMicHint');
      if(hint){
        hint.style.display='block';
        if(kbHintTimer) clearTimeout(kbHintTimer);
        kbHintTimer = setTimeout(()=>{ hint.style.display='none'; }, 4000);
      }
    };
    if(SR){
      const micBtn=document.getElementById('micBtn');
      if(micBtn) micBtn.onclick=()=>toggleRecording();
      renderQuizControls();
    }
    const box=document.getElementById('answerBox');
    if(box){
      box.oninput=(e)=>{
        state.answerText=e.target.value;
        const cc=document.getElementById('charCount'); if(cc) cc.textContent=e.target.value.length+'자';
        if(e.target.value.trim().length>0){
          stopAnswerTimer();
          if(state._prepActive) finishPrepCountdown(false);
        }
      };
      // 문제가 뜨자마자 답변칸에 포커스를 줘서 키보드가 바로 올라오게 함 (한 번의 탭을 줄여줌)
      box.focus();
      const len=box.value.length;
      try{ box.setSelectionRange(len,len); }catch(e){}
    }
    document.getElementById('clearBtn').onclick=()=>{
      if(isRecording && recognition){ recognition.stop(); isRecording=false; }
      state.answerText=''; recFinalBase=''; render();
    };
    document.getElementById('submitBtn').onclick=()=>{
      if(isRecording && recognition){ recognition.stop(); isRecording=false; }
      cancelQuestionAudio();
      stopAnswerTimer();
      submitAnswer();
    };
    document.getElementById('skipBtn').onclick=()=>{
      if(isRecording && recognition){ recognition.stop(); isRecording=false; }
      cancelQuestionAudio();
      stopAnswerTimer();
      state.answerText=''; submitAnswer();
    };
    document.getElementById('pauseBtn').onclick=async()=>{
      const ok=await showConfirm('지금까지 답한 문제까지는 자동으로 저장돼 있어요.\n그만 풀고 처음 화면으로 돌아갈까요?');
      if(!ok) return;
      if(isRecording && recognition){ recognition.stop(); isRecording=false; }
      cancelQuestionAudio();
      stopAnswerTimer();
      lastTTSQuestionId = null;
      screen='setup'; render();
    };
    const feBtn=document.getElementById('finishEarlyBtn');
    if(feBtn) feBtn.onclick=()=>{
      if(isRecording && recognition){ recognition.stop(); isRecording=false; }
      cancelQuestionAudio();
      stopAnswerTimer();
      finishEarly();
    };
  }
  else if(screen==='feedback'){
    document.getElementById('nextBtn').onclick=()=>goNext();
    document.getElementById('retryAnswerBtn').onclick=()=>{
      state.answerText=''; recFinalBase=''; screen='quiz'; render();
    };
    const feBtn2=document.getElementById('finishEarlyBtn2');
    if(feBtn2) feBtn2.onclick=()=>finishEarly();
    const fuBox=document.getElementById('followUpBox');
    if(fuBox) fuBox.oninput=(e)=>{ state._followUpAnswerText = e.target.value; };
    const fuBtn=document.getElementById('followUpSubmitBtn');
    if(fuBtn) fuBtn.onclick=async()=>{
      fuBtn.disabled=true; fuBtn.textContent='🤖 확인하고 있어요...';
      const ans = state._followUpAnswerText||'';
      state._followUpComment = await generateFollowUpComment(state.feedback.followUpQuestion, ans) || '답변 감사해요!';
      state._followUpAnswered = true;
      // 최근 기록에 꼬리질문 내용도 함께 저장 (교사 확인용)
      const lastRec = state.records[state.records.length-1];
      if(lastRec) lastRec.followUp = { question: state.feedback.followUpQuestion, answer: ans, comment: state._followUpComment };
      render();
    };
  }
  else if(screen==='result'){
    document.getElementById('backHomeBtn').onclick=()=>{ const nm=state.name; state=newSession(); state.name=nm; screen='setup'; render(); };
    document.getElementById('wrongNoteBtn').onclick=()=>{ screen='mystats'; render(); };
    document.getElementById('resultPrintBtn').onclick=()=>printLocalWrongNote(state.name);
    document.getElementById('resultPdfBtn').onclick=()=>downloadLocalWrongNotePDF(state.name);
    const mobileBtn=document.getElementById('mobileSubmitBtn');
    if(mobileBtn) mobileBtn.onclick=async()=>{
      mobileBtn.disabled=true; mobileBtn.textContent='📤 전송 중...';
      const wrongIds = state.records.filter(r=>r.score<WRONG_THRESHOLD).map(r=>r.id);
      const avg = Math.round(state.records.reduce((s,r)=>s+r.score,0)/state.records.length);
      const ok = await submitToSheet({ name:state.name, modeLabel:state._modeLabel, score:avg, totalCount:state.records.length, wrongIds, records:state.records, sessionId: state.sessionId });
      mobileBtn.disabled=false;
      mobileBtn.textContent = ok? '✅ 선생님께 제출 완료!' : '⚠️ 전송 실패 (다시 눌러보세요)';
    };
    const printBtn=document.getElementById('printBtn');
    if(printBtn) printBtn.onclick=()=>printResultA4();
    document.getElementById('retryBtn').onclick=()=>{
      const nm=state.name, cats=state.cats, grades=state.grades, count=state.count, shuffle=state.shuffle, mode=state.mode;
      state=newSession(); state.name=nm; state.cats=cats; state.grades=grades; state.count=count; state.shuffle=shuffle; state.mode=mode;
      screen='setup'; render();
    };
  }
  else if(screen==='mystats'){
    const back=document.getElementById('backSetupBtn'); if(back) back.onclick=()=>{ screen='setup'; render(); };
    const loadBtn=document.getElementById('loadStatsBtn');
    if(loadBtn){
      loadBtn.onclick=()=>{
        const v=document.getElementById('nameInput2').value.trim();
        if(!v){ showAlert('이름을 입력해주세요.'); return; }
        state.name=v; saveLastUsedName(v); render();
      };
    }
    document.querySelectorAll('.tabbtn').forEach(t=>{
      t.onclick=()=>{
        document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        const tab=t.dataset.tab;
        document.getElementById('tabHist').classList.toggle('hidden', tab!=='hist');
        document.getElementById('tabWrong').classList.toggle('hidden', tab!=='wrong');
      };
    });
    const pdfBtn=document.getElementById('pdfBtn');
    if(pdfBtn) pdfBtn.onclick=()=>downloadLocalWrongNotePDF(state.name);
    const printBtn2=document.getElementById('printBtn2');
    if(printBtn2) printBtn2.onclick=()=>printLocalWrongNote(state.name);
  }
  else if(screen==='tlogin'){
    document.getElementById('pwSubmit').onclick=async()=>{
      const v=document.getElementById('pwInput').value;
      if(v===getTeacherPassword()){ screen='tdash'; render(); }
      else await showAlert('비밀번호가 틀렸어요.');
    };
    document.getElementById('pwCancel').onclick=()=>{ screen='setup'; render(); };
  }
  else if(screen==='tdash'){
    document.getElementById('backSetupBtn').onclick=()=>{ screen='setup'; render(); };
    const savePwBtn=document.getElementById('savePwBtn');
    if(savePwBtn) savePwBtn.onclick=async()=>{
      const pw=(document.getElementById('newPwInput').value||'').trim();
      const enabled=document.getElementById('loginEnabledChk').checked;
      if(!pw){ await showAlert('비밀번호를 입력해주세요.'); return; }
      saveLoginConfig(pw, enabled);
      loginConfigCache=null; // 캐시 초기화
      await showAlert(`저장됐어요! 학생들에게 비밀번호 "${pw}"를 알려주세요.`);
    };
    const saveTeacherPwBtn=document.getElementById('saveTeacherPwBtn');
    if(saveTeacherPwBtn) saveTeacherPwBtn.onclick=async()=>{
      const pw=(document.getElementById('newTeacherPwInput').value||'').trim();
      if(!pw){ await showAlert('비밀번호를 입력해주세요.'); return; }
      setTeacherPassword(pw);
      await showAlert('강사용 비밀번호가 변경됐어요.');
    };
    const allQPrintBtn=document.getElementById('allQPrintBtn');
    if(allQPrintBtn) allQPrintBtn.onclick=()=>printAllQuestions();
    const allQPdfBtn=document.getElementById('allQPdfBtn');
    if(allQPdfBtn) allQPdfBtn.onclick=()=>downloadAllQuestionsPDF();
    // 구글 시트 전체 학생 목록: 캐시가 있으면 바로 표시, 없으면 불러온 뒤 캐싱
    if(sheetStudentsCache){
      renderSheetAllList(sheetStudentsCache);
    } else {
      fetchAllStudentsFromSheet().then(list=>{
        sheetStudentsCache = list;
        renderSheetAllList(list);
      }).catch(()=>{

        if(el) el.innerHTML = `<p class="small-note">⚠️ 목록을 불러오지 못했어요. 인터넷 연결을 확인해주세요.</p>`;
      });
    }
    document.getElementById('sheetSearchBtn').onclick=async()=>{
      const nm = document.getElementById('sheetSearchName').value.trim();
      const resultEl = document.getElementById('sheetSearchResult');
      if(!nm){ resultEl.innerHTML = `<p class="small-note">이름을 입력해주세요.</p>`; return; }
      await showSheetStudentDetail(nm, resultEl);
    };
  }
  else if(screen==='tdetail'){
    document.querySelectorAll('.tabbtn').forEach(t=>{
      t.onclick=()=>{
        document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        const tab=t.dataset.tab;
        document.getElementById('tabHist').classList.toggle('hidden', tab!=='hist');
        document.getElementById('tabWrong').classList.toggle('hidden', tab!=='wrong');
      };
    });
    const pdfBtn=document.getElementById('pdfBtn');
    if(pdfBtn) pdfBtn.onclick=()=>downloadLocalWrongNotePDF(tDetailName);
    const printBtn2=document.getElementById('printBtn2');
    if(printBtn2) printBtn2.onclick=()=>printLocalWrongNote(tDetailName);
    document.getElementById('backTdashBtn').onclick=()=>{ screen='tdash'; render(); };
  }
}

async function startInterview(){
  let pool;
  let modeLabel='부분 학습';
  if(state.mode==='wrong'){
    showLoadingModal('오답 기록을 불러오고 있어요...');
    const {ok, sessions} = await fetchStudentSessions(state.name);
    hideLoadingModal();
    let wrongIds = new Set(Object.keys((getStudent(state.name).wrong)||{}));
    if(ok && sessions && sessions.length > 0){
      // 스킬 방식: 시간순으로 재생해서 "마지막 기록이 오답인 것만" 추출 (다기기 정확 처리)
      const byTimeAsc = sessions.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
      const wrongMap = {};
      byTimeAsc.forEach(s=>{
        // records 배열에서 점수 기반으로 추출
        if(s.records){ try{
          const recs = typeof s.records==='string' ? JSON.parse(s.records) : s.records;
          recs.forEach(r=>{ if(r.score < WRONG_THRESHOLD && QMAP[r.id]) wrongMap[r.id]=r.id; else if(r.score >= WRONG_THRESHOLD) delete wrongMap[r.id]; });
        }catch(e){} }
        // wrongIds 배열에서도 추출
        const wrongArr = s.wrongIds ? (typeof s.wrongIds==='string' ? s.wrongIds.split(',').map(x=>x.trim()) : s.wrongIds) : [];
        wrongArr.forEach(id=>{ if(id && QMAP[id]) wrongMap[id]=id; });
      });
      wrongIds = new Set(Object.keys(wrongMap));
    }
    pool = QUESTIONS.filter(q=>wrongIds.has(q.id));
    if(!pool.length){
      await showAlert('풀 수 있는 오답 문제가 없어요.\n다른 기기에서도 아직 오답 기록이 없거나, 인터넷 연결을 확인해주세요.');
      return;
    }
    modeLabel='오답 모드';
  } else if(state.mode==='cumwrong'){
    showLoadingModal('누적 오답 기록을 불러오고 있어요...');
    const {ok, sessions} = await fetchStudentSessions(state.name);
    hideLoadingModal();
    let everWrongIds = new Set(Object.keys((getStudent(state.name).everWrong)||{}));
    if(ok && sessions && sessions.length > 0){
      // 누적: 한 번이라도 틀렸으면 계속 포함
      sessions.forEach(s=>{
        if(s.records){ try{
          const recs = typeof s.records==='string' ? JSON.parse(s.records) : s.records;
          recs.forEach(r=>{ if(r.score < WRONG_THRESHOLD && QMAP[r.id]) everWrongIds.add(r.id); });
        }catch(e){} }
        const wrongArr = s.wrongIds ? (typeof s.wrongIds==='string' ? s.wrongIds.split(',').map(x=>x.trim()) : s.wrongIds) : [];
        wrongArr.forEach(id=>{ if(id && QMAP[id]) everWrongIds.add(id); });
      });
    }
    pool = QUESTIONS.filter(q=>everWrongIds.has(q.id));
    if(!pool.length){
      await showAlert('누적 오답 문제가 없어요.\n아직 오답 기록이 없거나, 인터넷 연결을 확인해주세요.');
      return;
    }
    modeLabel='누적 오답 모드';
  } else if(state.mode==='all'){
    pool = BASIC_QUESTIONS.slice();
    modeLabel='전체 모드';
  } else if(state.mode==='advanced'){
    pool = ADV_POOL.filter(q=>state.cats.includes(q.cat) && state.grades.includes(q.grade));
    modeLabel='응용 모드(상)';
  } else if(state.mode==='random'){
    pool = QUESTIONS.filter(q=>state.cats.includes(q.cat) && state.grades.includes(q.grade));
    modeLabel='랜덤 모드';
  } else if(state.mode==='top'){
    // 최상위문제: 본문제+꼬리질문 "쌍" 단위로만 다루고, 쌍은 절대 떨어지지 않게 함
    // (셔플을 켜도 쌍의 순서 안(본문제→꼬리질문)은 항상 유지되도록 여기서 쌍째로 섞음)
    const pairsForPool = state.shuffle ? shuffleArr(TOP_PAIRS.slice()) : TOP_PAIRS.slice();
    pool = pairsForPool.flatMap(p=>[p.main, p.follow]);
    modeLabel='최상위문제';
  } else {
    pool = BASIC_QUESTIONS.filter(q=>state.cats.includes(q.cat) && state.grades.includes(q.grade));
  }
  if(state.shuffle && state.mode!=='top') pool = shuffleArr(pool); // top은 위에서 쌍 단위로 이미 섞었으므로 여기서 또 섞지 않음(개별 섞으면 쌍이 떨어짐)
  if((state.mode==='category'||state.mode==='advanced'||state.mode==='random') && state.count!==999) pool = pool.slice(0, Math.min(state.count, pool.length));
  if(!pool.length){ await showAlert('풀 수 있는 문제가 없어요.'); return; }
  state.queue = pool;
  state.idx = 0;
  state.records = [];
  state.answerText='';
  state._modeLabel = modeLabel;
  state.sessionId = genSessionId(); // 이 세션 전용 id - 서버에 저장할 때 매번 새 줄이 아니라 이 id의 줄 하나만 계속 갱신
  recFinalBase='';
  screen='quiz';
  render();
}

async function submitAnswer(){
  const q = state.queue[state.idx];
  const rawText = state.answerText;

  // AI 채점 중 로딩 상태 표시
  const submitBtn=document.getElementById('submitBtn');
  const clearBtn=document.getElementById('clearBtn');
  const skipBtn=document.getElementById('skipBtn');
  if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent='🤖 AI가 의미를 파악해서 채점하고 있어요...'; }
  if(clearBtn) clearBtn.disabled=true;
  if(skipBtn) skipBtn.style.pointerEvents='none';

  let fb = await aiGradeAnswer(q, rawText);
  if(!fb){
    fb = scoreAnswer(q, rawText);
    // 키워드 채점은 이미 기본 50점이 깔려 있어서 boostScore 미적용
  } else {
    fb.score = boostScore(fb.score); // AI 채점 결과만 boostScore 적용
  }
  if(state._timedOut){ fb.timedOut=true; state._timedOut=false; }

  // 점수 구간별 트랙 분기 (꼬리질문)
  const isAdvancedQ = q.level==='advanced';
  fb.followUpQuestion = null;
  fb.passMsg = null;
  if(fb.score>=100){
    fb.passMsg = isAdvancedQ
      ? '🎉 완벽해요! 이 응용 문제까지 확실히 이해했어요.'
      : '🎉 완벽해요! 심화 질문으로 넘어갈 준비가 되었구나!';
  } else if(fb.score>=50){
    if(submitBtn) submitBtn.textContent='🤖 꼬리질문을 준비하고 있어요...';
    const trackType = isAdvancedQ ? 'advanced-probe' : 'basic-fill';
    fb.followUpQuestion = await generateFollowUp(q, rawText, fb.score, trackType);
  }
  // score<50인 경우: 꼬리질문 없이 바로 오답 처리 (모범답안·놓친 개념은 기존 피드백 화면에 이미 표시됨)

  state._followUpAnswerText='';
  state._followUpAnswered=false;
  state._followUpComment=null;

  state.feedback = fb;
  state.records.push({id:q.id, q:q.q, cat:q.cat, score:fb.score, answer:rawText});

  // 학생별 오답노트 업데이트
  const s = getStudent(state.name);
  if(fb.score < WRONG_THRESHOLD){
    s.wrong[q.id] = {lastScore:fb.score, lastAnswer:rawText, date:fmtDT(Date.now())};
    s.everWrong[q.id] = {lastScore:fb.score, lastAnswer:rawText, date:fmtDT(Date.now())}; // 누적 오답: 나중에 맞혀도 삭제하지 않음
  } else {
    if(s.wrong[q.id]) delete s.wrong[q.id];
  }
  // 진행 상황 자동 저장: 스킬 방식 - 일반/오답 모드를 별도 슬롯에 저장
  const isWrongMode = state.mode==='wrong'||state.mode==='cumwrong';
  const snapSlot = isWrongMode ? 'inProgressWrong' : 'inProgress';
  if(state.records.length < state.queue.length){
    const snap = {
      queueIds: state.queue.map(x=>x.id),
      records: state.records.slice(),
      modeLabel: state._modeLabel || '',
      savedAt: fmtDT(Date.now()),
      ts: Date.now(),
      sessionId: state.sessionId
    };
    s[snapSlot] = snap;
    // 서버 캐시도 업데이트 (같은 기기의 다른 탭에서 바로 반영)
    if(serverResumeCache) serverResumeCache[isWrongMode?'wrong':'normal'] = snap;
  } else {
    delete s[snapSlot];
    if(serverResumeCache) serverResumeCache[isWrongMode?'wrong':'normal'] = null;
  }
  setStudent(state.name, s);

  // 문제 하나 풀 때마다 바로 구글 시트에 누적 전송 (중간에 그만둬도 지금까지 기록은 남도록)
  const wrongIdsSoFar = state.records.filter(r=>r.score<WRONG_THRESHOLD).map(r=>r.id);
  const avgSoFar = Math.round(state.records.reduce((sum,r)=>sum+r.score,0)/state.records.length);
  const isInProgress = state.records.length < state.queue.length;
  submitToSheet({
    name: state.name,
    modeLabel: (state._modeLabel||'') + (isInProgress? ' (진행중)':''),
    score: avgSoFar,
    totalCount: state.records.length,
    wrongIds: wrongIdsSoFar,
    records: state.records,
    // 이어풀기를 위해 전체 문제 목록과 현재 진행 인덱스도 함께 저장
    queueIds: isInProgress ? state.queue.map(x=>x.id) : [],
    resumeIdx: isInProgress ? state.records.length : -1,
    sessionId: state.sessionId
  });

  screen='feedback';
  render();
}

function getInProgress(name){
  if(!name || !name.trim()) return null;
  // 로컬 스냅샷
  const s = getStudent(name);
  const localSnap = (()=>{
    const ip = s.inProgress;
    if(!ip || !ip.queueIds || !ip.queueIds.length) return null;
    if((ip.records||[]).length >= ip.queueIds.length) return null;
    return ip;
  })();
  // 서버 스냅샷 (로그인 시 캐싱된 것)
  const serverSnap = serverResumeCache && serverResumeCache.normal;
  // 스킬 방식: 더 최신 것을 선택
  return pickNewerSnapshot(localSnap, serverSnap);
}
function resumeInterview(snap){
  // snap이 없으면 getInProgress로 가져옴
  const ip = snap || getInProgress(state.name);
  if(!ip || !ip.queueIds || !ip.queueIds.length){ showAlert('이어서 풀 수 있는 면접이 없어요.'); return; }
  // 위치(인덱스)가 아니라 문제 id를 기준으로 재구성해요.
  // 앞으로 이 html 파일을 수정/재배포하더라도(질문이 추가되거나 순서가 바뀌어도)
  // 기존 문제 id만 그대로 유지되면 "이미 푼 문제"와 "안 푼 문제"를 정확히 구분해서
  // 이어풀기를 계속할 수 있어요. (기존 id를 삭제·변경하면 그 문제만 이어풀기에서 빠져요.)
  const answeredIds = new Set((ip.records||[]).map(r=>r.id));
  const origQueue = ip.queueIds.map(id=>QMAP[id]).filter(Boolean);
  if(!origQueue.length){ showAlert('이어서 풀 수 있는 면접이 없어요. 문제 목록이 바뀐 것 같아요.'); return; }
  const answeredQuestions = origQueue.filter(q=>answeredIds.has(q.id));
  const remainingQuestions = origQueue.filter(q=>!answeredIds.has(q.id));
  if(!remainingQuestions.length){ showAlert('이어서 풀 수 있는 면접이 없어요. 이미 다 푼 것 같아요.'); return; }
  state.queue = answeredQuestions.concat(remainingQuestions);
  state.records = (ip.records||[]).filter(r=>QMAP[r.id]); // 사라진 문제의 기록은 제외
  state.idx = Math.min(state.records.length, state.queue.length-1);
  state.answerText='';
  state._modeLabel = (ip.modeLabel||'이어서 풀기');
  // 기존 세션과 같은 sessionId를 이어서 써야, 앞으로 저장할 때 새 줄이 아니라
  // 그 세션의 줄 하나만 계속 갱신돼요. (옛날 기록처럼 sessionId가 없으면 새로 발급)
  state.sessionId = ip.sessionId || genSessionId();
  recFinalBase='';
  lastTTSQuestionId = null;
  screen='quiz';
  render();
}
function resumeApprox(snap){
  // 정확한 이어풀기가 불가능한 옛날 기록용 근사 버전:
  // 이미 풀었던 문제 id는 빼고, 같은 카테고리에서 새 문제들로 이어감(정확한 위치 복원은 아님)
  if(!snap || !snap.cats || !snap.cats.length){ showAlert('비슷하게 이어갈 수 있는 기록이 없어요.'); return; }
  const excludeIds = new Set(snap.answeredIds||[]);
  const pool = QUESTIONS.filter(q => snap.cats.includes(q.cat) && !excludeIds.has(q.id));
  if(!pool.length){ showAlert('이 카테고리에서 아직 안 푼 새 문제가 없어요.'); return; }
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  const count = Math.min(shuffled.length, 10); // 원래 몇 문제였는지는 알 수 없어서 기본 10문제로 시작
  state.queue = shuffled.slice(0, count);
  state.idx = 0;
  state.records = [];
  state.answerText='';
  state._modeLabel = (snap.modeLabel||'부분 학습') + ' (비슷하게 이어감)';
  state.sessionId = genSessionId();
  recFinalBase='';
  lastTTSQuestionId = null;
  screen='quiz';
  render();
}
function discardProgress(name){
  const s = getStudent(name);
  delete s.inProgress;
  setStudent(name, s);
  // 서버 캐시도 초기화
  if(serverResumeCache) serverResumeCache.normal = null;
}

function buildAllQHTML(){
  const cats = ['수와 연산','문자와 식','함수','기하','확률과 통계'];
  const grade_order = ['중1','중2','중3'];
  let html = '';
  grade_order.forEach(grade=>{
    cats.forEach(cat=>{
      const qs = QUESTIONS.filter(q=>q.grade===grade && q.cat===cat);
      if(!qs.length) return;
      html += `<div style="font-size:13px;font-weight:800;color:#1b2a4a;margin:14px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;">${grade} · ${cat}</div>`;
      qs.forEach((q,i)=>{
        const isAdv = q.level==='advanced';
        html += `<div style="border:1px solid #ddd;border-radius:5px;padding:8px 10px;margin-bottom:6px;${isAdv?'background:#fffbe6;':''}break-inside:avoid;page-break-inside:avoid;">
          <div style="font-size:11.5px;font-weight:700;color:#1b2a4a;margin-bottom:3px;">${isAdv?'⭐ ':''}${q.q}</div>
          <div style="font-size:10.5px;color:#2f7d5b;"><b>모범답안:</b> ${q.a}</div>
        </div>`;
      });
    });
  });
  if(TOP_PAIRS.length){
    html += `<div style="font-size:13px;font-weight:800;color:#b8860b;margin:14px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;">🏆 최상위문제 (꼬리 질문 포함)</div>`;
    TOP_PAIRS.forEach(pair=>{
      [pair.main, pair.follow].forEach(q=>{
        const isFollow = q.id.endsWith('F');
        html += `<div style="border:1px solid #e6c869;border-radius:5px;padding:8px 10px;margin-bottom:6px;${isFollow?'background:#fffdf0;':''}break-inside:avoid;page-break-inside:avoid;">
          <div style="font-size:11.5px;font-weight:700;color:#1b2a4a;margin-bottom:3px;">${isFollow?'↳ (꼬리질문) ':''}${q.q}</div>
          <div style="font-size:10.5px;color:#2f7d5b;"><b>모범답안:</b> ${q.a}</div>
        </div>`;
      });
    });
  }
  return html;
}
